con obstáculos y terreno costoso; compara algoritmos y verifica si la heurística de A* es admisible.":"An agent searches for a path on a map with obstacles and costly terrain; compares algorithms and checks whether the A* heuristic is admissible.","<p>Un agente de búsqueda parte de un estado inicial, expande estados vecinos y busca la meta. La diferencia entre algoritmos está en qué nodo expande primero.<\/p><ul><li><b>BFS:<\/b> expande por número de pasos; es óptimo solo si todos los pasos cuestan lo mismo.<\/li><li><b>Costo uniforme (Dijkstra):<\/b> expande el nodo con menor costo acumulado g; siempre óptimo con costos no negativos.<\/li><li><b>Voraz:<\/b> expande el nodo con menor heurística h (distancia estimada a la meta); rápido pero puede no ser óptimo.<\/li><li><b>A*:<\/b> expande el nodo con menor f = g + w·h. Es <b>óptimo<\/b> si h es <i>admisible<\/i> (h ≤ costo real restante) y w = 1; con w &gt; 1 (A* ponderado) explora menos nodos a costa de optimalidad. Si además es <i>consistente<\/i> (h(u) ≤ costo(u,v) + h(v)), nunca reabre nodos.<\/li><\/ul><p class=\"small\">Mapa: «#» muro, «.» costo 1, «~» terreno costoso (costo 3), «S» inicio, «G» meta. Con 8 movimientos las diagonales cuestan √2 veces el costo de la celda y no se cortan esquinas.<\/p>":"<p>A search agent starts from an initial state, expands neighboring states and looks for the goal. The difference between algorithms lies in which node is expanded first.<\/p><ul><li><b>BFS:<\/b> expands by number of steps; it is optimal only if all steps cost the same.<\/li><li><b>Uniform cost (Dijkstra):<\/b> expands the node with the lowest accumulated cost g; always optimal with non-negative costs.<\/li><li><b>Greedy:<\/b> expands the node with the lowest heuristic h (estimated distance to the goal); fast but may not be optimal.<\/li><li><b>A*:<\/b> expands the node with the lowest f = g + w·h. It is <b>optimal<\/b> if h is <i>admissible<\/i> (h ≤ actual remaining cost) and w = 1; with w &gt; 1 (weighted A*) it explores fewer nodes at the expense of optimality. If it is also <i>consistent<\/i> (h(u) ≤ cost(u,v) + h(v)), it never reopens nodes.<\/li><\/ul><p class=\"small\">Map: “#” wall, “.” cost 1, “~” costly terrain (cost 3), “S” start, “G” goal. With 8 moves, diagonals cost √2 times the cell cost and corners are not cut.<\/p>","Mapa":"Map","Heurística de A* y voraz":"A* and greedy heuristic","Manhattan":"Manhattan","Octil (para 8 movimientos)":"Octile (for 8 moves)","Euclídea":"Euclidean","Cero (A* se vuelve costo uniforme)":"Zero (A* becomes uniform cost)","Peso de la heurística w en A* (1 = óptimo)":"Heuristic weight w in A* (1 = optimal)","Permitir 8 movimientos (diagonales)":"Allow 8 moves (diagonals)","Algoritmo que se dibuja":"Algorithm to draw","Costo uniforme":"Uniform cost","Voraz":"Greedy","BFS (pasos)":"BFS (steps)","A* ponderado (w = {0})":"Weighted A* (w = {0})","<div class=\"err\"><strong>No existe camino<\/strong> entre S y G con este mapa: los muros lo bloquean.<\/div>":"<div class=\"err\"><strong>No path exists<\/strong> between S and G on this map: the walls block it.<\/div>","<b class=\"good\">Óptimo<\/b>":"<b class=\"good\">Optimal<\/b>","Costo óptimo (costo uniforme)":"Optimal cost (uniform cost)","Nodos expandidos por A*":"Nodes expanded by A*","costo uniforme: {0}":"uniform cost: {0}","Heurística admisible":"Admissible heuristic","sobreestima hasta {0}":"overestimates by up to {0}","Heurística consistente":"Consistent heuristic","Comparación de algoritmos":"Comparison of algorithms","Camino":"Path","Costo":"Cost","Pasos":"Steps","Nodos expandidos":"Nodes expanded","Calidad":"Quality","Camino de {0} (azul), celdas expandidas (verde claro), muros (oscuro), terreno costoso (ocre).":"Path of {0} (blue), expanded cells (light green), walls (dark), costly terrain (ochre).","encontró ese costo óptimo":"found that optimal cost","entregó un camino {0} % más caro que el óptimo":"delivered a path {0}% more expensive than the optimum"," % menos":" % fewer"," % más":" % more","cero es admisible pero no guía la búsqueda":"zero is admissible but does not guide the search","es admisible, por lo que A* con w = 1 es óptimo":"is admissible, so A* with w = 1 is optimal","NO es admisible (sobreestima el costo restante): A* puede perder la optimalidad; cambie de heurística":"is NOT admissible (it overestimates the remaining cost): A* may lose optimality; change the heuristic","El voraz fue rápido ({0} nodos) pero {1} % más caro.":"Greedy was fast ({0} nodes) but {1}% more expensive.","BFS minimiza pasos, no costo, y por eso no es óptimo con terreno costoso.":"BFS minimizes steps, not cost, and is therefore not optimal with costly terrain.","<p>El camino óptimo cuesta <b>{0}<\/b>. <b>{1}<\/b> {2} expandiendo {3} nodos frente a {4} del costo uniforme ({5}). La heurística {6}. {7} {8}<\/p>":"<p>The optimal path costs <b>{0}<\/b>. <b>{1}<\/b> {2} expanding {3} nodes versus {4} for uniform cost ({5}). The heuristic {6}. {7} {8}<\/p>","Matriz singular: hay variables colineales; quite alguna.":"Singular matrix: there are collinear variables; remove some.","Descenso de gradiente":"Gradient descent","Con momento":"With momentum","Adam":"Adam","Descenso de gradiente y optimización convexa":"Gradient descent and convex optimization","Entrena una regresión lineal, una regresión logística o una función de prueba con descenso de gradiente, momento y Adam, y compara cada resultado con la solución exacta.":"Trains a linear regression, a logistic regression or a test function with gradient descent, momentum and Adam, and compares each result with the exact solution.","<p>Entrenar un modelo es minimizar una función de pérdida f(θ). Si f es <b>convexa<\/b>, todo mínimo local es global y el <b>descenso de gradiente<\/b> converge con la regla θ ← θ − η∇f(θ).<\/p><ul><li><b>Paso η:<\/b> con ∇f Lipschitz de constante L, el método converge si η &lt; 2/L; η = 1/L es la elección estándar. Un paso mayor que 2/L hace diverger el método.<\/li><li><b>Condicionamiento:<\/b> si la curvatura va de μ a L, el número de condición κ = L/μ gobierna la velocidad. Con el paso óptimo 2/(L+μ) la brecha se reduce por un factor ((κ−1)/(κ+1))² en cada iteración; con κ grande avanza lento por los valles estrechos.<\/li><li><b>Momento<\/b> (bola pesada): v ← βv + ∇f, θ ← θ − ηv. Acumula velocidad en la dirección consistente y amortigua las oscilaciones transversales.<\/li><li><b>Adam<\/b> adapta el paso de cada parámetro con estimaciones del primer y segundo momento del gradiente; es el optimizador habitual de las redes neuronales, pero con paso fijo oscila cerca del óptimo.<\/li><\/ul><p>En regresión lineal el óptimo exacto es la solución de las ecuaciones normales (MCO) y en regresión logística lo da Newton–Raphson (mínimos cuadrados reponderados). Si el descenso de gradiente reproduce esos coeficientes, el optimizador está bien implementado y bien calibrado. Las variables se estandarizan antes de entrenar, porque las escalas distintas empeoran el condicionamiento.<\/p>":"<p>Training a model is minimizing a loss function f(θ). If f is <b>convex<\/b>, every local minimum is global and <b>gradient descent<\/b> converges with the rule θ ← θ − η∇f(θ).<\/p><ul><li><b>Step η:<\/b> with ∇f Lipschitz with constant L, the method converges if η &lt; 2/L; η = 1/L is the standard choice. A step larger than 2/L makes the method diverge.<\/li><li><b>Conditioning:<\/b> if the curvature ranges from μ to L, the condition number κ = L/μ governs the speed. With the optimal step 2/(L+μ) the gap shrinks by a factor ((κ−1)/(κ+1))² at each iteration; with large κ it advances slowly along narrow valleys.<\/li><li><b>Momentum<\/b> (heavy ball): v ← βv + ∇f, θ ← θ − ηv. It accumulates velocity in the consistent direction and damps transverse oscillations.<\/li><li><b>Adam<\/b> adapts the step of each parameter with estimates of the first and second moments of the gradient; it is the usual optimizer for neural networks, but with a fixed step it oscillates near the optimum.<\/li><\/ul><p>In linear regression the exact optimum is the solution of the normal equations (OLS) and in logistic regression it is given by Newton–Raphson (iteratively reweighted least squares). If gradient descent reproduces those coefficients, the optimizer is correctly implemented and well calibrated. The variables are standardized before training, because different scales worsen the conditioning.<\/p>","Función de prueba (efecto del condicionamiento)":"Test function (effect of conditioning)","Regresión lineal (pérdida cuadrática)":"Linear regression (squared loss)","Regresión logística (pérdida de entropía cruzada)":"Logistic regression (cross-entropy loss)","Función de prueba: número de condición κ":"Test function: condition number κ","Función de prueba: punto de partida (x = y)":"Test function: starting point (x = y)","Tasa η de descenso y momento (0 = automática 1/L)":"Descent rate η and momentum (0 = automatic 1/L)","Tasa de Adam":"Adam rate","Momento β":"Momentum β","Iteraciones":"Iterations","Datos (para regresión lineal y logística)":"Data (for linear and logistic regression)","Columnas x1, x2, x3, y (continua) y clase (0/1).":"Columns x1, x2, x3, y (continuous) and class (0/1).","Predictores":"Predictors","Hay muy pocos datos para ":"There are too few data for ","Un predictor es constante.":"A predictor is constant.","La regresión logística necesita una respuesta con valores 0 y 1 (por ejemplo, «clase»).":"Logistic regression needs a response with values 0 and 1 (for example, “class”).","Intercepto":"Intercept","Función de prueba, κ = {0}":"Test function, κ = {0}","Regresión lineal":"Linear regression","Tasa η usada":"Rate η used","automática = 1/L":"automatic = 1/L","Paso máximo estable 2/L":"Maximum stable step 2/L","Pérdida mínima exacta":"Exact minimum loss","<b class=\"bad\">Diverge<\/b>":"<b class=\"bad\">Diverges<\/b>","<b class=\"warn\">No alcanza en {0}<\/b>":"<b class=\"warn\">Not reached in {0}<\/b>","<b class=\"good\">Converge<\/b>":"<b class=\"good\">Converges<\/b>","<b class=\"warn\">Aún descendiendo<\/b>":"<b class=\"warn\">Still descending<\/b>","Comparación de optimizadores":"Optimizer comparison","Iteraciones hasta brecha ≤ {0}":"Iterations until gap ≤ {0}","Brecha final de pérdida":"Final loss gap","Máx. |θ − θ exacto|":"Max |θ − exact θ|","Convergencia: log₁₀(pérdida − mínimo), piso 10⁻¹⁶":"Convergence: log₁₀(loss − minimum), floor 10⁻¹⁶","Iteración":"Iteration","log₁₀ de la brecha":"log₁₀ of the gap","Una recta descendente indica convergencia lineal (geométrica); la pendiente depende del condicionamiento.":"A descending straight line indicates linear (geometric) convergence; the slope depends on the conditioning.","Trayectorias sobre las curvas de nivel":"Trajectories over the level curves","Las elipses son curvas de nivel de f. Con κ grande el descenso de gradiente zigzaguea por el valle; el momento y Adam lo cruzan con menos oscilación.":"The ellipses are level curves of f. With large κ gradient descent zigzags along the valley; momentum and Adam cross it with less oscillation.","Verificación contra la teoría (descenso de gradiente)":"Check against theory (gradient descent)","Teoría":"Theory","Medido":"Measured","Factor de reducción de la brecha por iteración":"Gap reduction factor per iteration","no contrae (η ≥ 2/L)":"does not contract (η ≥ 2/L)","Paso óptimo 2/(L+μ)":"Optimal step 2/(L+μ)","Número de condición κ":"Condition number κ","mayor o igual que 1: no converge":"greater than or equal to 1: does not converge"," en cada iteración":" at each iteration"," y se midió {0}":" and {0} was measured","Alcanzó la tolerancia en {0} iteraciones":"Reached the tolerance in {0} iterations","No alcanzó la tolerancia":"Did not reach the tolerance","lo logró en ":"reached it in ","no la alcanzó":"did not reach it","en ":"in ","no la alcanzó (con tasa fija oscila cerca del mínimo)":"did not reach it (with a fixed rate it oscillates near the minimum)","<b>El paso supera 2/L: el descenso de gradiente simple diverge<\/b> (el momento tolera hasta 2(1+β)/L).":"<b>The step exceeds 2/L: plain gradient descent diverges<\/b> (momentum tolerates up to 2(1+β)/L).","El paso es menor que 2/L, por eso el descenso simple es estable.":"The step is smaller than 2/L, so plain descent is stable.","<p>Con κ = {0} y η = {1}, la teoría predice que el descenso de gradiente reduce la brecha por un factor {2}{3}. {4}; con momento {5} y Adam {6}. {7} Un κ mayor (curvas más alargadas) ralentiza el descenso de gradiente, que es la razón de estandarizar variables y de usar métodos adaptativos.<\/p>":"<p>With κ = {0} and η = {1}, theory predicts that gradient descent reduces the gap by a factor {2}{3}. {4}; with momentum {5} and Adam {6}. {7} A larger κ (more elongated curves) slows gradient descent, which is the reason for standardizing variables and using adaptive methods.<\/p>","Coeficientes en las unidades originales":"Coefficients in the original units","Exacto (MCO)":"Exact (OLS)","Exacto (Newton–Raphson)":"Exact (Newton–Raphson)","El mínimo exacto de la pérdida cuadrática se obtiene resolviendo las ecuaciones normales (MCO).":"The exact minimum of the squared loss is obtained by solving the normal equations (OLS).","El mínimo exacto de la entropía cruzada se obtiene con Newton–Raphson (mínimos cuadrados reponderados), el mismo algoritmo del módulo de regresión logística.":"The exact minimum of the cross-entropy is obtained with Newton–Raphson (iteratively reweighted least squares), the same algorithm as the logistic regression module.","alcanzó la tolerancia en {0} iteraciones":"reached the tolerance in {0} iterations","no alcanzó la tolerancia en {0} iteraciones (suba las iteraciones o la tasa)":"did not reach the tolerance in {0} iterations (increase the iterations or the rate)","en {0}":"in {0}","no la alcanzó con su tasa fija":"did not reach it with its fixed rate","Sus coeficientes coinciden con la solución exacta (diferencia relativa máxima {0}): el optimizador recupera el mismo modelo que el método analítico.":"Its coefficients match the exact solution (maximum relative difference {0}): the optimizer recovers the same model as the analytical method.","Mientras no converja, sus coeficientes difieren de la solución exacta.":"Until it converges, its coefficients differ from the exact solution."," En regresión logística no existe fórmula cerrada, por eso en la práctica (y en las redes neuronales) se entrena con gradientes.":" In logistic regression there is no closed formula, which is why in practice (and in neural networks) it is trained with gradients.","<p>{0} Con η = {1} el descenso de gradiente {2}, el momento {3} y Adam {4}. {5}{6}<\/p>":"<p>{0} With η = {1} gradient descent {2}, momentum {3} and Adam {4}. {5}{6}<\/p>","raíz":"root","Podado por cota (sin resolver)":"Pruned by bound (not solved)","Infactible":"Infeasible","Sin solución":"No solution","Podado por cota":"Pruned by bound","Entero: nuevo incumbente":"Integer: new incumbent","Fraccionario: ramifica":"Fractional: branches","Planta solar, Bodega, Sensores, Automatización, Capacitación, Software, Flota, Laboratorio":"Solar plant, Warehouse, Sensors, Automation, Training, Software, Fleet, Laboratory","90, 60, 35, 110, 25, 50, 70, 40; <=; 300; Presupuesto (MM$)\n1, 1, 0, 0, 0, 0, 0, 0; <=; 1; Planta solar y bodega son excluyentes\n0, 0, -1, 1, 0, 0, 0, 0; <=; 0; Automatización requiere sensores\n0, 0, 0, 0, 1, 1, 0, 0; >=; 1; Al menos capacitación o software":"90, 60, 35, 110, 25, 50, 70, 40; <=; 300; Budget (MM$)\n1, 1, 0, 0, 0, 0, 0, 0; <=; 1; Solar plant and warehouse are mutually exclusive\n0, 0, -1, 1, 0, 0, 0, 0; <=; 0; Automation requires sensors\n0, 0, 0, 0, 1, 1, 0, 0; >=; 1; At least training or software","Programación entera: ramificación y acotamiento":"Integer programming: branch and bound","Decide qué proyectos, turnos o activos elegir cuando las variables son enteras o binarias; resuelve con ramificación y acotamiento y lo verifica por enumeración exhaustiva.":"Decides which projects, shifts or assets to choose when the variables are integer or binary; solves with branch and bound and verifies by exhaustive enumeration.","<p>En <b>programación lineal entera<\/b> (PLE) algunas variables solo pueden tomar valores enteros (o 0/1 para decisiones «sí / no»). Los problemas de selección de proyectos, asignación, turnos y localización son de este tipo.<\/p><ul><li><b>Relajación lineal:<\/b> si se ignora la condición de integralidad se obtiene un problema lineal cuyo óptimo es una <i>cota<\/i> (superior si se maximiza) del óptimo entero. La diferencia es la <b>brecha de integralidad<\/b>.<\/li><li><b>Redondear<\/b> la solución de la relajación casi nunca sirve: puede violar restricciones o quedar lejos del óptimo.<\/li><li><b>Ramificación y acotamiento (branch and bound):<\/b> se resuelve la relajación; si una variable xⱼ sale fraccionaria se crean dos subproblemas, xⱼ ≤ ⌊xⱼ⌋ y xⱼ ≥ ⌈xⱼ⌉. Un nodo se <b>poda<\/b> si es infactible, si su cota no supera el mejor entero encontrado (incumbente) o si su solución ya es entera.<\/li><li>El algoritmo termina cuando no quedan nodos abiertos: el incumbente es entonces óptimo. Con variables binarias se puede <b>verificar por enumeración<\/b> de las 2ⁿ combinaciones.<\/li><li>Los programas profesionales añaden <b>planos de corte<\/b> (Gomory) y heurísticas; el esquema de ramificación es el mismo.<\/li><\/ul>":"<p>In <b>integer linear programming<\/b> (ILP) some variables can only take integer values (or 0/1 for “yes / no” decisions). Project selection, assignment, shift scheduling and location problems are of this type.<\/p><ul><li><b>Linear relaxation:<\/b> if the integrality condition is ignored, a linear problem is obtained whose optimum is a <i>bound<\/i> (upper if maximizing) on the integer optimum. The difference is the <b>integrality gap<\/b>.<\/li><li><b>Rounding<\/b> the relaxation’s solution almost never works: it may violate constraints or end up far from the optimum.<\/li><li><b>Branch and bound:<\/b> the relaxation is solved; if a variable xⱼ comes out fractional, two subproblems are created, xⱼ ≤ ⌊xⱼ⌋ and xⱼ ≥ ⌈xⱼ⌉. A node is <b>pruned<\/b> if it is infeasible, if its bound does not exceed the best integer found (incumbent) or if its solution is already integer.<\/li><li>The algorithm ends when no open nodes remain: the incumbent is then optimal. With binary variables it can be <b>verified by enumerating<\/b> the 2ⁿ combinations.<\/li><li>Professional solvers add <b>cutting planes<\/b> (Gomory) and heuristics; the branching scheme is the same.<\/li><\/ul>","Objetivo":"Objective","Tipo de variables":"Variable type","Binarias (0 o 1)":"Binary (0 or 1)","Enteras no negativas":"Non-negative integers","Nombres de las variables":"Variable names","Coeficientes de la función objetivo":"Objective function coefficients","Restricciones (coeficientes; operador; límite; nombre)":"Constraints (coefficients; operator; limit; name)","Máximo de nodos a resolver":"Maximum nodes to solve","Verificar por enumeración (solo binarias, hasta 18 variables)":"Verify by enumeration (binary only, up to 18 variables)","No se pudo resolver":"Could not be solved",": las restricciones son incompatibles":": the constraints are incompatible","<div class=\"err\"><strong>{0}.<\/strong> La relajación lineal ya no tiene solución óptima{1}; el problema entero tampoco la tiene.<\/div>":"<div class=\"err\"><strong>{0}.<\/strong> The linear relaxation already has no optimal solution{1}; the integer problem has none either.<\/div>","en {0} nodos (límite alcanzado): suba el máximo de nodos.":"in {0} nodes (limit reached): increase the maximum nodes.","tras explorar todo el árbol: el problema entero es infactible aunque su relajación no lo sea.":"after exploring the whole tree: the integer problem is infeasible even though its relaxation is not.","<div class=\"err\"><strong>No se encontró solución entera factible<\/strong> {0}<\/div>":"<div class=\"err\"><strong>No feasible ión estocástica y simulación Monte Carlo":"Stochastic optimization and Monte Carlo simulation","Decide cuánto producir cuando la demanda es incierta: compara el plan determinista, el robusto y el de dos etapas con escenarios, y lo evalúa con simulación Monte Carlo.":"Decides how much to produce when demand is uncertain: compares the deterministic, robust and two-stage scenario plans, and evaluates it with Monte Carlo simulation.","<p>En la <b>optimización estocástica<\/b> algunos datos (la demanda, por ejemplo) son variables aleatorias. Se decide en dos etapas: primero la acción <i>aquí y ahora<\/i> (cuánto producir) y, una vez conocida la demanda, la <i>recurso<\/i> (inventario sobrante o faltante).<\/p><ul><li><b>Promedio de escenarios (SAA):<\/b> se simulan S escenarios de demanda y se minimiza el costo esperado = costo de producir + promedio de (costo de inventario + costo de faltante). Es un problema lineal.<\/li><li><b>Plan determinista:<\/b> reemplaza la demanda por su media («valor esperado»). Ignora que un faltante cuesta distinto que un sobrante.<\/li><li><b>Plan robusto:<\/b> se protege con una demanda alta (μ + zσ). Reduce los faltantes a costa de producir de más.<\/li><li><b>Valor de la solución estocástica (VSS):<\/b> costo esperado del plan determinista − costo esperado del plan estocástico. Mide cuánto vale modelar la incertidumbre.<\/li><li><b>Simulación Monte Carlo:<\/b> para comparar justamente se evalúan los tres planes con las mismas miles de demandas nuevas (números aleatorios comunes), y se estiman el costo esperado, la probabilidad de faltante, la tasa de servicio y el <b>CVaR<\/b> del 95 % (costo medio del 5 % peor de los casos).<\/li><li><b>Caso de un período (vendedor de periódicos):<\/b> la cantidad óptima cumple F(x*) = (b − c)/(b + h), con b costo de faltante, c costo de producir y h costo de sobrante. La calculadora lo compara con la simulación y con la solución por escenarios.<\/li><\/ul>":"<p>In <b>stochastic optimization<\/b> some data (demand, for example) are random variables. Decisions are made in two stages: first the <i>here-and-now<\/i> action (how much to produce) and, once demand is known, the <i>recourse<\/i> (leftover or missing inventory).<\/p><ul><li><b>Sample average approximation (SAA):<\/b> S demand scenarios are simulated and the expected cost is minimized = production cost + average of (inventory cost + shortage cost). It is a linear problem.<\/li><li><b>Deterministic plan:<\/b> replaces demand with its mean (“expected value”). It ignores that a shortage costs differently from a surplus.<\/li><li><b>Robust plan:<\/b> protects against a high demand (μ + zσ). It reduces shortages at the cost of overproducing.<\/li><li><b>Value of the stochastic solution (VSS):<\/b> expected cost of the deterministic plan − expected cost of the stochastic plan. It measures how much modeling uncertainty is worth.<\/li><li><b>Monte Carlo simulation:<\/b> for a fair comparison the three plans are evaluated with the same thousands of new demands (common random numbers), and the expected cost, shortage probability, service rate and the 95% <b>CVaR<\/b> (mean cost of the worst 5% of cases) are estimated.<\/li><li><b>Single-period case (newsvendor):<\/b> the optimal quantity satisfies F(x*) = (b − c)/(b + h), with b the shortage cost, c the production cost and h the surplus cost. The calculator compares it with the simulation and with the scenario solution.<\/li><\/ul>","Plan de producción de varios períodos":"Multi-period production plan","Un período: vendedor de periódicos (con óptimo analítico)":"Single period: newsvendor (with analytical optimum)","Demanda esperada por período (coma)":"Expected demand per period (comma)","Desviación estándar de la demanda (un valor o uno por período)":"Standard deviation of demand (one value or one per period)","Capacidad por período (un valor o uno por período)":"Capacity per period (one value or one per period)","Costo de producir una unidad":"Cost of producing on ed cost: deterministic","faltante en {0} % de los casos":"shortage in {0}% of cases","Costo esperado: robusto":"Expected cost: robust","faltante en {0} %":"shortage in {0}%","Costo esperado: estocástico":"Expected cost: stochastic","VSS (valor de modelar la incertidumbre)":"VSS (value of modeling uncertainty)","el plan estocástico es mejor":"the stochastic plan is better","diferencia dentro del ruido":"difference within noise","Evaluación Monte Carlo de los tres planes (":"Monte Carlo evaluation of the three plans ("," demandas simuladas)":" simulated demands)","Plan":"Plan","CVaR 95 %":"CVaR 95%","Unidades faltantes (media)":"Missing units (mean)","Demanda esperada":"Expected demand","Determinista":"Deterministic","Robusto":"Robust","Estocástico":"Stochastic","Producción planificada por período":"Planned production per period","Unidades":"Units","El plan estocástico produce más que el determinista en los períodos donde el faltante es más caro que el sobrante, hasta el límite de capacidad.":"The stochastic plan produces more than the deterministic one in the periods where a shortage is more expensive than a surplus, up to the capacity limit.","Producción por período":"Production per period"," ({0} % del costo del plan determinista)":" ({0}% of the deterministic plan’s cost)",": no hay ventaja medible con estos parámetros":": there is no measurable advantage with these parameters","protege más, pero cuesta más en promedio que el estocástico":"protects more, but costs more on average than the stochastic one","resulta igual o mejor que el estocástico con estos datos":"turns out equal to or better than the stochastic one with these data","La capacidad total es cercana a la demanda esperada más su variabilidad: aun el mejor plan no puede eliminar los faltantes y conviene evaluar ampliar capacidad o fijar inventario de seguridad.":"The total capacity is close to the expected demand plus its variability: even the best plan cannot eliminate shortages, and it is advisable to terrain, verified against the exact solution by value iteration, and multi-armed bandits.","<p>En el <b>aprendizaje por refuerzo<\/b> un agente observa un estado s, elige una acción a, recibe una recompensa r y pasa a un nuevo estado s′. Busca una <b>política<\/b> que maximice la recompensa acumulada descontada (factor γ). Se modela como un <b>proceso de decisión de Markov<\/b>.<\/p><ul><li><b>Función de valor óptima:<\/b> Q*(s,a) = Σ P(s′|s,a)·[r + γ·máxₐ′ Q*(s′,a′)] (ecuación de Bellman). Si el modelo se conoce, la <b>iteración de valores<\/b> la resuelve de forma exacta.<\/li><li><b>Q-learning<\/b> no necesita conocer el modelo: tras cada paso actualiza Q(s,a) ← Q(s,a) + α·[r + γ·máxₐ′ Q(s′,a′) − Q(s,a)]. Converge a Q* si todos los pares estado-acción se visitan muchas veces.<\/li><li><b>Exploración:<\/b> la política ε-voraz elige una acción al azar con probabilidad ε y la mejor conocida con probabilidad 1 − ε. Sin exploración el agente se queda con la primera ruta aceptable.<\/li><li><b>Bandidos multibrazo:<\/b> versión sin estados. Hay que repartir jugadas entre varias opciones de probabilidad de éxito desconocida (por ejemplo, variantes de una página). El <i>arrepentimiento<\/i> mide lo que se pierde por no jugar siempre la mejor. UCB1 y el muestreo de Thompson logran arrepentimiento que crece solo como ln T; el algoritmo aleatorio o el voraz puro crecen casi linealmente.<\/li><\/ul><p>En el mapa, «~» es terreno costoso, «#» un muro y «S» y «G» el inicio y la meta; con probabilidad de resbalón el agente a veces se mueve en un sentido perpendicular al elegido.<\/p>":"<p>In <b>reinforcement learning<\/b> an agent observes a state s, chooses an action a, receives a reward r and moves to a new state s′. It seeks a <b>policy<\/b> that maximizes the discounted cumulative reward (factor γ). It is modeled as a <b>Markov decision process<\/b>.<\/p><ul><li><b>Optimal value function:<\/b> Q*(s,a) = Σ P(s′|s,a)·[r + γ·maxₐ′ Q*(s′,a′)] (Bellman equation). If the model is known, <b>value iteration<\/b> solves it exactly.<\/li><li><b>Q-learning<\/b> does not need to know the model: after each step it updates Q(s,a) ← Q(s,a) + α·[r + γ·maxₐ′ Q(s′,a′) − Q(s,a)]. It converges to Q* if all state-action pairs are visited many times.<\/li><li><b>Exploration:<\/b> the ε-greedy policy chooses a random action with probability ε and the best known one with probability 1 − ε. Without exploration the agent sticks with the first acceptable route.<\/li><li><b>Multi-armed bandits:<\/b> stateless version. Plays must be allocated among several options of unknown success probability (for example, variants of a page). <i>Regret<\/i> measures what is lost by not always playing the best one. UCB1 and Thompson sampling achieve regret that grows only as ln T; the random or pure greedy algorithm grows almost linearly.<\/li><\/ul><p>On the map, “~” is costly terrain, “#” a wall and “S” and “G” the start and the goal; with slip probability the agent sometimes moves in a direction perpendicular to the chosen one.<\/p>","Q-learning en un mapa (proceso de decisión de Markov)":"Q-learning on a map (Markov decision process)","Bandidos multibrazo (exploración y explotación)":"Multi-armed bandits (exploration and exploitation)","Mapa (S inicio, G meta, # muro, ~ terreno costoso)":"Map (S start, G goal, # wall, ~ costly terrain)","Probabilidad de resbalar":"Slip probability","Costo por paso normal":"Cost per normal step","Costo por paso en terreno «~»":"Cost per step on “~” terrain","Recompensa por llegar a G":"Reward for reaching G","Factor de descuento γ":"Discount factor γ","Tasa de aprendizaje α":"Learning rate α","Exploración ε inicial":"Initial exploration ε","Exploración ε final":"Final exploration ε","Episodios de entrenamiento":"Training episodes","Bandidos: probabilidad real de éxito de cada opción":"Bandits: true success probability of each option","Bandidos: jugadas por corrida":"Bandits: plays per run","Bandidos: corridas promediadas":"Bandits: runs averaged","Bandidos: ε del algoritmo ε-voraz":"Bandits: ε of the ε-greedy algorithm","Ingrese al menos dos probabilidades entre 0 y 1.":"Enter at least two probabilities between 0 and 1.","Aleatorio":"Random","Voraz puro (ε = 0)":"Pure greedy (ε = 0)","ε-voraz (ε = {0})":"ε-greedy (ε = {0})","Muestreo de Thompson":"Thompson sampling","Opciones":"Options","Mejor opción":"Best option","Jugadas × corridas":"Plays × runs","Mejor arrepentimiento final":"Best final regret","Arrepentimiento acumulado medio":"Mean cumulative regret","Jugada":"Play","Arrepentimiento (pérdida esperada)":"Regret (expected loss)","Una curva casi recta indica que el algoritmo sigue jugando opciones malas; una curva que se aplana indica que aprendió cuál es la mejor.":"An almost straight curve indicates that the algorithm keeps playing bad options; a curve that flattens indicates that it learned which one is best.","Arrepentimiento al final":"Regret at the end","Jugadas en la mejor opción":"Plays on the best option","Pendiente en el último tramo":"Slope over the last stretch","<p class=\"small\">El cociente R(T)/R(T/2) vale cerca de 2 si el arrepentimiento crece de forma lineal y desciende hacia 1 a medida que el algoritmo aprende (crecimiento logarítmico); con pocas jugadas y opciones parecidas aún no llega a 1.<\/p>":"<p class=\"small\">The ratio R(T)/R(T/2) is close to 2 if regret grows linearly and falls toward 1 as the algorithm learns (logarithmic growth); with few plays and similar options it does not yet reach 1.<\/p>","al no explorar puede quedarse con una opción mediocre que dio buenos resultados al principio":"by not exploring it may stay with a mediocre option that gave good results at the start","en esta corrida no se estancó, pero no tiene garantía de converger a la mejor":"in this run it did not stall, but it has no guarantee of converging to the best","<p>Con {0} opciones, la mejor (n.º {1}) tiene probabilidad {2}. Jugando al azar se pierden {3} aciertos esperados en {4} jugadas, es dec l de respaldo.":"Connects modules in sequence: each step receives the table from the previous one, makes a verifiable decision and delivers to the next, ending in a conclusion with its level of support.","<p>Un módulo aislado entrega un cálculo; una <b>ruta<\/b> encadena varios para que cada resultado sea verificado por el siguiente. El flujo es: <b>fuente de datos → tabla activa → explorar → modelar → validar → conclusión<\/b>.<\/p>\n  <ul><li><b>Continuidad:<\/b> cada paso recibe la tabla (o los predictores, el orden de diferenciación o los grupos) del paso anterior. El paso de raíz unitaria decide <i>d<\/i> para SARIMA; la correlación elige los predictores de la regresión; K-medias agrega la columna «grupo» que usa el ANOVA.<\/li><li><b>Verificación cruzada:<\/b> los pasos de validación pueden <i>corregir<\/i> la conclusión anterior. Si los residuos de la regresión están autocorrelacionados, se recalcula la significancia con errores robustos Newey–West y se informa qué variables dejan de ser significativas. Si hay puntos influyentes (distancia de Cook &gt; 4/n), se reajusta sin ellos para ver si la conclusión depende de pocos datos.<\/li><li><b>Validación del pronóstico:<\/b> se reserva el final de la serie, se pronostica y se compara con repetir el último valor. Si el modelo no mejora esa referencia trivial, la ruta lo advierte.<\/li><li><b>Nivel de respaldo:<\/b> proporción de verificaciones superadas. Alto: 80 % o más y ninguna no superada; moderado: 50 % a 80 %; bajo: menos de 50 % o alguna no superada.<\/li><li><b>Fuentes en línea:<\/b> el navegador consulta directamente a la fuente. Los datos que usted pega o carga no salen del navegador, pero la consulta sí es una solicitud a un tercero. Si una fuente no permite consultas desde otras páginas (CORS), pegue o cargue el CSV descargado.<\/li><\/ul>\n  <p class=\"small\">Los datos sintéticos sirven solo para probar el encadenamiento y quedan rotulados como tales en el informe.<\/p>":"<p>An isolated module delivers a calculation; a <b>route<\/b> chains several so that each result is verified by the next. The flow is: <b>data source → active table → explore → model → validate → conclusion<\/b>.<\/p>\n  <ul><li><b>Continuity:<\/b> each step receives the table (or the predictors, the differencing order or the groups) from the previous step. The unit root step decides <i>d<\/i> for SARIMA; the correlation chooses the regression predictors; K-means adds the “cluster” column used by the ANOVA.<\/li><li><b>Cross-checking:<\/b> the validation steps can <i>correct<\/i> the previous conclusion. If the regression residuals are autocorrelated, the significance is recomputed with Newey–West robust errors and it is reported which variables cease to be significant. If there are influential points (Cook’s distance &gt; 4/n), the model is refitted without them to see whether the conclusion depends on a few data points.<\/li><li><b>Forecast validation:<\/b> the end of the series is held out, forecast, and compared with repeating the last value. If the model does not improve on that trivial reference, the route warns about it.<\/li><li><b>Support level:<\/b> proportion of checks passed. High: 80% or more and none failed; moderate: 50% to 80%; low: less than 50% or any failed.<\/li><li><b>Online sources:<\/b> the browser queries the source directly. The data you paste or upload do not leave the browser, but the query is a request to a third party. If a source does not allow queries from other pages (CORS), paste or upload the downloaded CSV.<\/li><\/ul>\n  <p class=\"small\">Synthetic data serve only to test the chaining and are labeled as such in the report.<\/p>","Ruta de análisis":"Analysis route","Fuente de datos":"Data source","Pegar o cargar un CSV propio":"Paste or upload your own CSV","Tabla activa (CSV con encabezado)":"Active table (CSV with header)","Variable objetivo":"Target variable","Período estacional (1 = ninguno; 7 = semanal en datos diarios)":"Seasonal period (1 = none; 7 = ; la herramienta real se usa fuera del navegador. Los casos con datos reales en línea están en la familia «Rutas», que incluye un caso de regresión logística (Avanzado 8).<\/p>\n  <p class=\"small\">B = metodologías básicas; A = metodologías avanzadas.<\/p><\/section>\n  <section class=\"panel note\"><h3>Alcance y límites<\/h3><p>Prototipo diseñado por {23} ({24}). Los algoritmos están implementados desde cero en JavaScript y se verificaron contra valores de referencia (distribuciones t, F y χ², regresión, ANOVA, Tukey). Algunas implementaciones son versiones didácticas: SARIMA se estima por mínimos cuadrados condicionales, la SVR es lineal, el motor SQL cubre las construcciones más usadas y los precios de AWS son valores de ejemplo editables. Para decisiones críticas contraste los resultados con R o Python.<\/p><\/section>":"\n  <header class=\"hero\"><svg class=\"sigline\" viewBox=\"0 0 600 60\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><polyline points=\"0,40 40,40 60,12 85,50 110,26 140,34 190,34 215,8 240,48 270,30 330,30 360,14 385,46 410,32 470,32 495,10 520,44 545,28 600,28\"/><\/svg>\n  <svg class=\"robot big\" viewBox=\"0 0 48 48\" aria-hidden=\"true\"><use href=\"#robot\"/><\/svg><p class=\"eyebrow\">{0} · {1}<\/p><h1>{2}<\/h1>\n  <p class=\"lead\">{3} Each methodology is a calculator that works with its own data: results, charts, plain-language interpretation and a professional report that you assemble module by module.<\/p>\n  <p class=\"byline\"><span class=\"avatar\" aria-hidden=\"true\">{4}<\/span><span><b>{5}<\/b><br><small>{6}{7}<\/small><\/span><\/p>\n  <div class=\"row\"><a class=\"btn pri\" href=\"#bloques\">Open the block panel<\/a><a class=\"btn\" href=\"#desc\">Start with descriptive statistics<\/a><a class=\"btn\" href=\"#informe\">Go to the report<\/a><\/div>\n  <div class=\"stats\" id=\"homeStats\"><div><b data-n=\"{8}\">0<\/b><span>calculation modules<\/span><\/div><div><b data-n=\"{9}\">0<\/b><span>topics covered<\/span><\/div><d ul to you. Edit titles and comments.<\/li><li><b>Generate the report<\/b> with cover, index, executive summary, conclusions and methodological annex, and download it as HTML.<\/li><\/ol>\n   <p class=\"small\">Calculations run in your browser; the data you paste or upload are not sent to any server.<\/p><\/section>\n   <section class=\"panel\"><h3>Prototype sheet<\/h3><dl class=\"facts\">{11}{12}{13}{14}{15}<dt>Scope<\/dt><dd>{16} modules · {17} families · {18} chained routes<\/dd><dt>Technology<\/dt><dd>HTML, CSS and JavaScript in a single file, no server<\/dd><dt>Data<\/dt><dd>Processed locally in the browser<\/dd>{19}<\/dl><p class=\"small\">Edit these data in <b>Settings → Prototype identity<\/b>.<\/p><\/section><\/div>\n  <section class=\"panel\"><h3>Learning path<\/h3><p class=\"small\">The menu goes from the basics to the integrative: each family builds on the previous ones and, within each, the modules go from simple to complex. You can open any of them on its own.<\/p><div class=\"tw\"><table class=\"t\"><thead><tr><th>No.<\/th><th class=\"l\">Family<\/th><th class=\"l\">Modules<\/th><\/tr><\/thead><tbody>{20}<\/tbody><\/table><\/div><\/section>\n  <section class=\"panel note\"><h3>Scope and limits<\/h3><p>Prototype designed by {21} ({22}). The algorithms are implemented from scratch in JavaScript and were verified against reference values (t, F and χ² distributions, regression, ANOVA, Tukey). Some implementations are didactic versions: SARIMA is estimated by conditional least squares, the SVR is linear, the SQL engine covers the most commonly used constructs and the AWS prices are editable example values. For critical decisions, check the results against R or Python.<\/p><\/section>","<thead><tr><th>N.º<\/th><th class=\"l\">Familia<\/th><th>Módulos<\/th><th class=\"l\">Qué aporta y de qué depende<\/th><\/tr><\/thead>":"<thead><tr><th>No.<\/th><th class=\"l\">Family<\/th><th>Modules<\/th><th class=\"l\">What it provides and what it depends on<\/th><\/tr><\/thead>","# Python\nfrom sklearn.linear_model import RidgeCV, LassoCV\nfrom sklearn.cross_decomposition import PLSRegression\nLassoCV(cv=5).fit(Z, y)\n# R\nlibrary(glmnet); cv.glmnet(X, y, alpha = 0)  # ridge;  alpha = 1 LASSO\nlibrary(grpreg); library(pls); pcr(y ~ ., ncomp = 4, validation = \"CV\")":"# Python\nfrom sklearn.linear_model import RidgeCV, LassoCV\nfrom sklearn.cross_decomposition import PLSRegression\nLassoCV(cv=5).fit(Z, y)\n# R\nlibrary(glmnet); cv.glmnet(X, y, alpha = 0)  # ridge;  alpha = 1 is LASSO\nlibrary(grpreg); library(pls); pcr(y ~ ., ncomp = 4, validation = \"CV\")","# Python\nfrom sklearn.svm import SVR\nSVR(kernel=\"linear\", C=10, epsilon=0.5).fit(X, y)   # kernel=\"rbf\" para no lineal\n# R\nlibrary(e1071); svm(y ~ x, data = df, type = \"eps-regression\", kernel = \"linear\", cost = 10, epsilon = 0.5)":"# Python\nfrom sklearn.svm import SVR\nSVR(kernel=\"linear\", C=10, epsilon=0.5).fit(X, y)   # kernel=\"rbf\" for nonlinear\n# R\nlibrary(e1071); svm(y ~ x, data = df, type = \"eps-regression\", kernel = \"linear\", cost = 10, epsilon = 0.5)","# Python\nfrom sklearn.metrics.pairwise import cosine_similarity\nS = cosine_similarity(R.fillna(0))\n# librerías: surprise (KNNWithMeans), implicit, LightFM\n# R\nlibrary(recommenderlab); Recommender(as(R, \"realRatingMatrix\"), method = \"UBCF\")":"# Python\nfrom sklearn.metrics.pairwise import cosine_similarity\nS = cosine_similarity(R.fillna(0))\n# libraries: surprise (KNNWithMeans), implicit, LightFM\n# R\nlibrary(recommenderlab); Recommender(as(R, \"realRatingMatrix\"), method = \"UBCF\")","# Python\nimport numpy as np\ndef softmax(z, T=1.0):\n    e = np.exp((z - z.max()) / T); return e / e.sum()\nfrom collections import Counter, defaultdict  # modelo de bigramas\n# LLM: from transformers import AutoModelForCausalLM, AutoTokenizer":"# Python\nimport numpy as np\ndef softmax(z, T=1.0):\n    e = np.exp((z - z.max()) / T); return e / e.sum()\nfrom collections import Counter, defaultdict  # bigram model\n# LLM: from transformers import AutoModelForCausalLM, AutoTokenizer","# Python (recocido simulado, esquema)\nimport math, random\ncur = s0; T = T0\nfor k in range(n_iter):\n    T = T0 * (T1 / T0) ** (k / n_iter)\n    cand = vecino(cur)\n    d = costo(cand) - costo(cur)\n    if d <= 0 or random.random() < math.exp(-d / T): cur = cand":"# Python (simulated annealing, outline)\nimport math, random\ncur = s0; T = T0\nfor k in range(n_iter):\n    T = T0 * (T1 / T0) ** (k / n_iter)\n    cand = vecino(cur)\n    d = costo(cand) - costo(cur)\n    if d <= 0 or random.random() < math.exp(-d / T): cur = cand","# Python\nfrom scipy.optimize import linprog\nres = linprog(c=[-40, -30], A_ub=[[2, 1], [1, 1], [1, 0]], b_ub=[100, 80, 40])\nprint(res.x, -res.fun)  # solución y valor\n# CSP: from ortools.sat.python import cp_model  # o python-constraint":"# Python\nfrom scipy.optimize import linprog\nres = linprog(c=[-40, -30], A_ub=[[2, 1], [1, 1], [1, 0]], b_ub=[100, 80, 40])\nprint(res.x, -res.fun)  # solution and value\n# CSP: from ortools.sat.python import cp_model  # or python-constraint","# Python (A*, esquema)\nimport heapq\nopen_ = [(h(start), 0, start)]\nwhile open_:\n    f, g, u = heapq.heappop(open_)\n    if u == goal: break\n    for v, c in vecinos(u):\n        if g + c < G.get(v, 1e9):\n            G[v] = g + c; heapq.heappush(open_, (g + c + h(v), G[v], v))":"# Python (A*, outline)\nimport heapq\nopen_ = [(h(start), 0, start)]\nwhile open_:\n    f, g, u = heapq.heappop(open_)\n    if u == goal: break\n    for v, c in vecinos(u):\n        if g + c < G.get(v, 1e9):\n            G[v] = g + c; heapq.heappush(open_, (g + c + h(v), G[v], v))","# Python\nimport numpy as np\ndef gd(grad, x0, lr, it):\n    x = np.array(x0, float)\n    for _ in range(it):\n        x -= lr * grad(x)\n    return x\n# regresión: grad = lambda b: Z.T @ (Z @ b - y) / n\n# logística: grad = lambda b: Z.T @ (1/(1+np.exp(-Z @ b)) - y) / n\n# en PyTorch: torch.optim.SGD(params, lr, momentum=0.9) o torch.optim.Adam(params, lr)":"# Python\nimport numpy as np\ndef gd(grad, x0, lr, it):\n    x = np.array(x0, float)\n    for _ in range(it):\n        x -= lr * grad(x)\n    return x\n# regression: grad = lambda b: Z.T @ (Z @ b - y) / n\n# logistic: grad = lambda b: Z.T @ (1/(1+np.exp(-Z @ b)) - y) / n\n# in PyTorch: torch.optim.SGD(params, lr, momentum=0.9) or torch.optim.Adam(params, lr)","# Python\nfrom scipy.optimize import milp, LinearConstraint, Bounds\nimport numpy as np\nc = -np.array([120, 85, 60, 140, 40, 75, 95, 50])   # maximizar → minimizar -c\nA = np.array([[90, 60, 35, 110, 25, 50, 70, 40]])\nres = milp(c, constraints=LinearConstraint(A, ub=300), integrality=np.ones(8), bounds=Bounds(0, 1))\nprint(res.x, -res.fun)":"# Python\nfrom scipy.optimize import milp, LinearConstraint, Bounds\nimport numpy as np\nc = -np.array([120, 85, 60, 140, 40, 75, 95, 50])   # maximize → minimize -c\nA = np.array([[90, 60, 35, 110, 25, 50, 70, 40]])\nres = milp(c, constraints=LinearConstraint(A, ub=300), integrality=np.ones(8), bounds=Bounds(0, 1))\nprint(res.x, -res.fun)","# Python (vendedor de periódicos, SAA)\nimport numpy as np\nfrom scipy.stats import norm\nmu, sd, c, h, b = 100, 20, 10, 1, 30\nxq = mu + sd * norm.ppf((b - c) / (b + h))            # óptimo analítico\nd = np.maximum(0, np.random.default_rng(7).normal(mu, sd, 100000))\ncost = lambda x: c*x + h*np.maximum(x-d, 0).mean() + b*np.maximum(d-x, 0).mean()\n# varios períodos: scipy.optimize.linprog con variables de recurso por escenario":"# Python (newsvendor, SAA)\nimport numpy as np\nfrom scipy.stats import norm\nmu, sd, c, h, b = 100, 20, 10, 1, 30\nxq = mu + sd * norm.ppf((b - c) / (b + h))            # analytical optimum\nd = np.maximum(0, np.random.default_rng(7).normal(mu, sd, 100000))\ncost = lambda x: c*x + h*np.maximum(x-d, 0).mean() + b*np.maximum(d-x, 0).mean()\n# several periods: scipy.optimize.linprog with recourse variables per scenario","# Python (Q-learning tabular)\nimport numpy as np\nQ = np.zeros((nS, 4))\nfor ep in range(E):\n    s = start\n    while s != goal:\n        a = rng.integers(4) if rng.random() < eps else Q[s].argmax()\n        s2, r = step(s, a)\n        Q[s, a] += alpha * (r + gamma * Q[s2].max() - Q[s, a])\n        s = s2\n# bandidos: UCB1 → mean + sqrt(2*log(t)/n);  Thompson → rng.beta(1+s, 1+n-s)":"# Python (tabular Q-learning)\nimport numpy as np\nQ = np.zeros((nS, 4))\nfor ep in range(E):\n    s = start\n    while s != goal:\n        a = rng.integers(4) if rng.random() < eps else Q[s].argmax()\n        s2, r = step(s, a)\n        Q[s, a] += alpha * (r + gamma * Q[s2].max() - Q[s, a])\n        s = s2\n# bandits: UCB1 → mean + sqrt(2*log(t)/n);  Thompson → rng.beta(1+s, 1+n-s)","# Python: la ruta \"serie de tiempo\" equivalente\nimport pandas as pd, requests\nfrom statsmodels.tsa.stattools import adfuller\nfrom statsmodels.tsa.statespace.sarimax import SARIMAX\ns = pd.DataFrame(requests.get(\"https://mindicador.cl/api/dolar/2025\").json()[\"serie\"])\ny = s.sort_values(\"fecha\")[\"valor\"].values\nd = 0 if adfuller(y, regression=\"c\")[1] < .05 else 1\nm = SARIMAX(y[:-12], order=(1, d, 1)).fit()\nprint(m.get_forecast(12).summary_frame())  # comparar con y[-12:] y con el valor ingenuo":"# Python: the equivalent \"time series\" route\nimport pandas as pd, requests\nfrom statsmodels.tsa.stattools import adfuller\nfrom statsmodels.tsa.statespace.sarimax import SARIMAX\ns = pd.DataFrame(requests.get(\"https://mindicador.cl/api/dolar/2025\").json()[\"serie\"])\ny = s.sort_values(\"fecha\")[\"valor\"].values\nd = 0 if adfuller(y, regression=\"c\")[1] < .05 else 1\nm = SARIMAX(y[:-12], order=(1, d, 1)).fit()\nprint(m.get_forecast(12).summary_frame())  # compare with y[-12:] and with the naive value"} : null;

const L = (function () {
  const S = {};
  /* ---------- utilidades ---------- */
  S.sum = a => { let s = 0; for (const v of a) s += v; return s; };
  S.mean = a => S.sum(a) / a.length;
  S.variance = (a, ddof = 1) => { const m = S.mean(a); let s = 0; for (const v of a) s += (v - m) ** 2; return s / (a.length - ddof); };
  S.sd = (a, ddof = 1) => Math.sqrt(S.variance(a, ddof));
  S.sorted = a => Float64Array.from(a).sort();
  S.quantile = (a, p, sorted) => {
    const s = sorted || S.sorted(a); const n = s.length; if (n === 1) return s[0];
    const h = (n - 1) * p, lo = Math.floor(h), hi = Math.ceil(h); return s[lo] + (h - lo) * (s[hi] - s[lo]);
  };
  S.median = a => S.quantile(a, 0.5);
  S.cov = (x, y) => { const mx = S.mean(x), my = S.mean(y); let s = 0; for (let i = 0; i < x.length; i++) s += (x[i] - mx) * (y[i] - my); return s / (x.length - 1); };
  S.corr = (x, y) => S.cov(x, y) / (S.sd(x) * S.sd(y));
  S.range = a => { let lo = Infinity, hi = -Infinity; for (const v of a) { if (v < lo) lo = v; if (v > hi) hi = v; } return [lo, hi]; };
  S.rank = a => {
    const idx = a.map((v, i) => [v, i]).sort((p, q) => p[0] - q[0]); const r = new Array(a.length);
    let i = 0; while (i < idx.length) { let j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++; const rk = (i + j) / 2 + 1; for (let k = i; k <= j; k++) r[idx[k][1]] = rk; i = j + 1; }
    return r;
  };
  S.rng = seed => { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  S.randn = rnd => { let u = 0, v = 0; while (u === 0) u = rnd(); v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  S.shuffle = (a, rnd) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- funciones especiales y distribuciones ---------- */
  const G = [676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  function gammaln(x) {
    if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - gammaln(1 - x);
    x -= 1; let a = 0.99999999999980993; const t = x + 7.5;
    for (let i = 0; i < 8; i++) a += G[i] / (x + i + 1);
    return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
  }
  function betacf(a, b, x) {
    const FP = 1e-300; let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap; if (Math.abs(d) < FP) d = FP; d = 1 / d; let h = d;
    for (let m = 1; m <= 300; m++) {
      const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < FP) d = FP; c = 1 + aa / c; if (Math.abs(c) < FP) c = FP; d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < FP) d = FP; c = 1 + aa / c; if (Math.abs(c) < FP) c = FP; d = 1 / d; const del = d * c; h *= del;
      if (Math.abs(del - 1) < 3e-16) break;
    }
    return h;
  }
  function betai(x, a, b) {
    if (x <= 0) return 0; if (x >= 1) return 1;
    const bt = Math.exp(gammaln(a + b) - gammaln(a) - gammaln(b) + a * Math.log(x) + b * Math.log(1 - x));
    return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
  }
  function gammp(a, x) {
    if (x <= 0) return 0;
    if (x < a + 1) { let ap = a, sum = 1 / a, del = sum; for (let n = 0; n < 500; n++) { ap++; del *= x / ap; sum += del; if (Math.abs(del) < Math.abs(sum) * 1e-15) break; } return sum * Math.exp(-x + a * Math.log(x) - gammaln(a)); }
    let b = x + 1 - a, c = 1e300, d = 1 / b, h = d;
    for (let i = 1; i < 500; i++) { const an = -i * (i - a); b += 2; d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300; c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300; d = 1 / d; const del = d * c; h *= del; if (Math.abs(del - 1) < 1e-15) break; }
    return 1 - Math.exp(-x + a * Math.log(x) - gammaln(a)) * h;
  }

/* ===== diseño de matriz con variables categóricas ===== */
function design(tb, ycol, xnames, opt = {}) {
  const yc = tb.cols.find(c => c.name === ycol); if (!yc || !yc.num) throw new Error(__t('La variable respuesta debe ser numérica.'));
  const xs = xnames.filter(n => n !== ycol).map(n => tb.cols.find(c => c.name === n)).filter(Boolean); if (!xs.length) throw new Error(__t('Seleccione al menos una variable explicativa.'));
  const keep = []; for (let i = 0; i < tb.n; i++) if (!isNaN(yc.v[i]) && xs.every(c => c.num ? !isNaN(c.v[i]) : c.raw[i] !== '')) keep.push(i);
  const names = [], colsData = [], groups = [];
  xs.forEach((c, gi) => { if (c.num) { names.push(c.name); colsData.push(keep.map(i => c.v[i])); groups.push(gi + 1); } else { const lv = [...new Set(keep.map(i => c.raw[i]))].sort(); lv.slice(1).forEach(l => { names.push(`${c.name}[${l}]`); colsData.push(keep.map(i => (c.raw[i] === l ? 1 : 0))); groups.push(gi + 1); }); } });
  const X = keep.map((_, r) => colsData.map(cd => cd[r]));
  return { X, y: keep.map(i => yc.v[i]), names, groups, n: keep.length, dropped: tb.n - keep.length, yname: ycol, idx: keep, xs };
}
const olsFit = (D, intercept = true) => L.ols(intercept ? L.withIntercept(D.X) : D.X, D.y, { intercept });
const coefTable = (m, names, ci = 0.95, intercept = true) => { const tq = L.tppf(0.5 + ci / 2, m.df), nm = intercept ? [__t('(Intercepto)'), ...names] : names; return tbl([__t('Término'), __t('Coef.'), __t('Error est.'), 't', __t('p-valor'), '', __t`IC ${Math.round(ci * 100)}%`], nm.map((n, j) => [esc(n), m.b[j], m.se[j], m.t[j], P(m.p[j]), sig(m.p[j]), `[${F(m.b[j] - tq * m.se[j], 3)}; ${F(m.b[j] + tq * m.se[j], 3)}]`]), {}); };
const fitStats = m => kpis([['R²', m.r2], [__t('R² ajustado'), m.adj], [__t('Error estándar residual'), m.sigma, `${m.df} g.l.`], [__t('F global'), m.F, `p ${P(m.pF)}`], ['AIC', m.aic], ['BIC', m.bic]]);
const qqSVG = (res, title) => { const n = res.length, s = L.sorted(res), sd = L.sd(res), mu = L.mean(res), th = Array.from(s, (_, i) => L.normppf((i + .5) / n)), pts = th.map((t, i) => ({ x: t, y: (s[i] - mu) / sd })), lim = ext(th.concat(pts.map(p => p.y)), .06); return plot({ title, xlab: __t('Cuantiles teóricos N(0,1)'), ylab: __t('Residuos estandarizados'), xlim: lim, ylim: lim, h: 320 }, a => path(lim, lim, a.sx, a.sy, 2, 1.5, '5 4') + dots(pts, a.sx, a.sy)); };
const resPlot = (fit, res, title) => scatterSVG(fit, res, { title, xlab: __t('Valores ajustados'), ylab: __t('Residuos'), h: 300, lines: [{ x: ext(fit), y: [0, 0], c: 2, w: 1.5, dash: '5 4' }] });

reg({

  review: __t`<p>La estadística descriptiva condensa los datos sin inferir más allá de ellos. Primero se clasifica cada variable: <b>cuantitativa</b> (continua o discreta) o <b>cualitativa</b> (nominal u ordinal), porque de ello depende qué resumen y qué prueba son válidos.</p>
  <ul><li><b>Tendencia central:</b> media x̄ = Σxᵢ/n, mediana (percentil 50) y moda.</li><li><b>Dispersión:</b> varianza s² = Σ(xᵢ−x̄)²/(n−1), desviación estándar, rango intercuartil IQR = Q3−Q1, coeficiente de variación CV = s/|x̄|.</li><li><b>Forma:</b> asimetría g₁ = m₃/m₂^{3/2} y curtosis en exceso g₂ = m₄/m₂² − 3 (0 en una normal).</li><li><b>Valores atípicos (regla de Tukey):</b> fuera de [Q1 − 1,5·IQR ; Q3 + 1,5·IQR].</li></ul>
  <p>Una media muy distinta de la mediana, o una asimetría marcada, sugiere cola larga: conviene reportar mediana e IQR y considerar transformaciones (log).</p>`,

        const nums = tb.cols.filter(c => c.num); if (nums.length) {

  <p>Un p-valor pequeño indica evidencia contra H₀, no la magnitud del efecto: reporte siempre el intervalo y el tamaño de efecto.</p>`,

      { k: 'a', t: 'col', from: 'data', label: __t('Variable A'), def: 'first' }, { k: 'b', t: 'col', from: 'data', label: __t('Variable B (si aplica)') },

        if (v.kind === 'one') { r = L.ttest1(a, v.mu, v.alt); tcrit = L.tppf(1 - al / 2, r.df); ic = [r.mean - tcrit * r.se, r.mean + tcrit * r.se]; lab = __t`μ de ${A.name}`; html += kpis([[__t('Media muestral'), r.mean], [__t('Error estándar'), r.se], ['t', r.t], [__t('g.l.'), r.df], [__t('p-valor'), P(r.p)]]); }

        else { const b = B.v.filter(x => !isNaN(x)); r = L.ttest2(a, b, v.alt, v.kind === 'pool'); tcrit = L.tppf(1 - al / 2, r.df); ic = [r.diff - tcrit * r.se, r.diff + tcrit * r.se]; lab = __t`diferencia de medias (${A.name} − ${B.name})`; const ft = L.varFtest(a, b); html += kpis([[__t('Media A'), r.m1, `n = ${r.n1}`], [__t('Media B'), r.m2, `n = ${r.n2}`], [__t('Diferencia'), r.diff], ['t', r.t], [__t('g.l.'), r.df], [__t('p-valor'), P(r.p)], [__t('d de Cohen'), r.d]]) + __t`<p class="small">Prueba F de igualdad de varianzas: F = ${F(ft.f, 3)}, p = ${P(ft.p)}.</p>`; }
        // curva t con región de rechazo

  lead: __t('Mide la asociación entre variables con tres coeficientes y sus pruebas de significancia.'),
  review: __t`<p>La elección del coeficiente depende del tipo de relación y de los supuestos:</p>
  <ul><li><b>Pearson r</b> mide asociación <i>lineal</i>; supone variables continuas sin atípicos fuertes. Prueba: t = r√((n−2)/(1−r²)). IC por transformación de Fisher: tanh(atanh r ± z/√(n−3)).</li><li><b>Spearman ρ</b> es la correlación de Pearson sobre los rangos: detecta relaciones monótonas y resiste atípicos.</li><li><b>Kendall τ</b> cuenta pares concordantes y discordantes: τ = (C − D)/√((n₀−t_x)(n₀−t_y)); más robusto con muestras pequeñas y empates.</li></ul>
  <p>Correlación no implica causalidad; una correlación Pearson baja con Spearman alta indica relación no lineal pero monótona.</p>`,
  code: `# Python\nfrom scipy import stats\nstats.pearsonr(x, y); stats.spearmanr(x, y); stats.kendalltau(x, y)\ndf.corr(method="spearman")\n# R\ncor.test(x, y, method = "pearson")  # "spearman" | "kendall"`,
  build() {
    const form = Form('corr', [{ k: 'data', t: 'data', label: __t('Datos'), sample: SAMPLES.planta, rows: 7 }, { k: 'x', t: 'col', from: 'data', label: __t('Variable X'), def: 'produccion' }, { k: 'y', t: 'col', from: 'data', label: __t('Variable Y'), def: 'consumo_kwh' }, { k: 'm', t: 'sel', label: __t('Método para la matriz'), opts: [['p', 'Pearson'], ['s', 'Spearman'], ['k', 'Kendall']] }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), nums = tb.cols.filter(c => c.num), cx = nums.find(c => c.name === v.x), cy = nums.find(c => c.name === v.y), ok = []; for (let i = 0; i < tb.n; i++) if (!isNaN(cx.v[i]) && !isNaN(cy.v[i])) ok.push(i);
        const x = ok.map(i => cx.v[i]), y = ok.map(i => cy.v[i]), pe = L.pearsonTest(x, y), sp = L.spearmanTest(x, y), ke = L.kendallTest(x, y), m = L.ols(L.withIntercept(x.map(a => [a])), y);
        let html = tbl([__t('Coeficiente'), __t('Valor'), __t('p-valor'), __t('Lectura')], [['Pearson r', pe.r, P(pe.p), __t`IC 95 %: [${F(pe.lo, 3)} ; ${F(pe.hi, 3)}]`], ['Spearman ρ', sp.r, P(sp.p), __t('Asociación monótona')], ['Kendall τ-b', ke.r, P(ke.p), __t`${ke.c} concordantes, ${ke.d} discordantes`]]);
        const xl = ext(x); html += fig(scatterSVG(x, y, { title: `${cy.name} vs ${cx.name}`, xlab: cx.name, ylab: cy.name, lines: [{ x: xl, y: xl.map(t => m.b[0] + m.b[1] * t), c: 2 }] }), __t`Recta de mínimos cuadrados: ŷ = ${F(m.b[0], 3)} + ${F(m.b[1], 3)}·x  (R² = ${F(m.r2, 3)}).`);
        const k = nums.length, fn = v.m === 'p' ? L.pearsonTest : v.m === 's' ? L.spearmanTest : L.kendallTest, M = nums.map(a => nums.map(b => { if (a === b) return 1; const idx = []; for (let i = 0; i < tb.n; i++) if (!isNaN(a.v[i]) && !isNaN(b.v[i])) idx.push(i); return fn(idx.map(i => a.v[i]), idx.map(i => b.v[i])).r; }));
        html += H4(__t`Matriz de correlación (${{ p: 'Pearson', s: 'Spearman', k: 'Kendall' }[v.m]})`) + fig(heatSVG(M, nums.map(c => c.name), nums.map(c => c.name)));
        const mag = a => { a = Math.abs(a); return a < .2 ? __t('muy débil') : a < .4 ? __t('débil') : a < .6 ? __t('moderada') : a < .8 ? __t('fuerte') : __t('muy fuerte'); };
        html += interp(__t`<p>Entre <b>${esc(cx.name)}</b> y <b>${esc(cy.name)}</b> existe una asociación ${pe.r > 0 ? __t('positiva') : __t('negativa')} ${mag(pe.r)} (Pearson r = ${F(pe.r, 3)}; ${pe.p < 0.05 ? __t('estadísticamente significativa') : __t('no significativa')} al 5 %). ${Math.abs(sp.r) - Math.abs(pe.r) > 0.1 ? __t('Spearman supera claramente a Pearson: la relación es monótona pero no lineal, o hay atípicos que afectan a r.') : __t('Pearson y Spearman son similares: la relación es esencialmente lineal.')} El coeficiente de determinación simple es R² = ${F(pe.r ** 2, 3)}.</p>`);
        out.innerHTML = html;

reg({

  code: `# Python\nimport statsmodels.api as sm\nm = sm.OLS(y, sm.add_constant(x)).fit(); print(m.summary())\nfrom scipy.stats import jarque_bera; jarque_bera(m.resid)\n# R\nm <- lm(y ~ x); summary(m); plot(m)`,
  build() {
    const form = Form('slr', [{ k: 'data', t: 'data', label: __t('Datos'), sample: SAMPLES.simple, rows: 6 }, { k: 'x', t: 'col', from: 'data', label: __t('Variable explicativa X'), def: 'first' }, { k: 'y', t: 'col', from: 'data', label: __t('Variable respuesta Y') }, { k: 'x0', t: 'num', label: __t('Valor x₀ para pronosticar'), val: 30 }, { k: 'conf', t: 'num', label: __t('Nivel de confianza'), val: 0.95, min: 0.5, max: 0.999 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), D = design(tb, v.y, [v.x]), m = olsFit(D), x = D.X.map(r => r[0]), n = D.n, xm = L.mean(x), sxx = L.sum(x.map(t => (t - xm) ** 2)), tq = L.tppf(0.5 + v.conf / 2, m.df);
        const band = (t, pred) => m.sigma * Math.sqrt((pred ? 1 : 0) + 1 / n + (t - xm) ** 2 / sxx) * tq, xl = ext(x, .02), gx = Array.from({ length: 60 }, (_, i) => xl[0] + (xl[1] - xl[0]) * i / 59), fx = gx.map(t => m.b[0] + m.b[1] * t);
        const svg = plot({ title: __t`Ajuste: ${v.y} ~ ${v.x}`, xlab: v.x, ylab: v.y, xlim: xl, ylim: ext(D.y), legend: [{ name: __t('Ajuste'), c: 2 }, { name: __t('Banda de pronóstico'), c: 3 }] }, a => `<polygon class="f3" fill-opacity=".12" points="${gx.map((t, i) => `${a.sx(t)},${a.sy(fx[i] + band(t, true))}`).join(' ')} ${gx.map((t, i) => [a.sx(t), a.sy(fx[i] - band(t, true))]).reverse().map(p => p.join(',')).join(' ')}"/><polygon class="f2" fill-opacity=".2" points="${gx.map((t, i) => `${a.sx(t)},${a.sy(fx[i] + band(t, false))}`).join(' ')} ${gx.map((t, i) => [a.sx(t), a.sy(fx[i] - band(t, false))]).reverse().map(p => p.join(',')).join(' ')}"/>` + path(gx, fx, a.sx, a.sy, 2, 2.2) + dots(x.map((t, i) => ({ x: t, y: D.y[i] })), a.sx, a.sy));
        const jb = L.describe(m.res), jbp = L.chi2sf(jb.jb, 2), y0 = m.b[0] + m.b[1] * v.x0;

        html += fig(svg, __t('Banda interior: intervalo de confianza de la media. Banda exterior: intervalo de pronóstico de una observación nueva.')) + `<div class="grid2">${fig(resPlot(m.fit, m.res, __t('Residuos vs ajustados')))}${fig(qqSVG(m.res, __t('Gráfico Q–Q de los residuos')))}</div>`;
        html += H4(__t('Pronóstico en x₀')) + tbl(['x₀', __t('Pronóstico ŷ₀'), __t`IC media ${F(v.conf * 100, 0)} %`, __t`Intervalo de pronóstico ${F(v.conf * 100, 0)} %`], [[v.x0, y0, `[${F(y0 - band(v.x0, false), 3)} ; ${F(y0 + band(v.x0, false), 3)}]`, `[${F(y0 - band(v.x0, true), 3)} ; ${F(y0 + band(v.x0, true), 3)}]`]]);

reg({

  <ul><li><b>Una vía:</b> F = [SCE/(k−1)] / [SCD/(N−k)] ~ F(k−1, N−k) bajo H₀: todas las medias iguales.</li><li><b>Razón de correlación:</b> η² = SCE/SCT, proporción de variabilidad explicada por el factor (ω² corrige el sesgo).</li><li><b>Dos vías:</b> efectos principales A y B e interacción A×B, calculados por sumas de cuadrados secuenciales (tipo I; coinciden con tipo III en diseños balanceados).</li><li><b>Supuestos:</b> normalidad de residuos, independencia y homogeneidad de varianzas (Levene/Brown–Forsythe).</li><li><b>Tukey HSD:</b> compara todos los pares controlando el error global: |x̄ᵢ − x̄ⱼ| > q·√(CMD/2·(1/nᵢ+1/nⱼ)).</li></ul>`,
  code: `# Python\nimport statsmodels.api as sm, statsmodels.formula.api as smf\nm = smf.ols("y ~ C(a) * C(b)", df).fit(); sm.stats.anova_lm(m, typ=2)\nfrom statsmodels.stats.multicomp import pairwise_tukeyhsd\n# R\nsummary(aov(y ~ a * b)); TukeyHSD(aov(y ~ a))`,
  build() {

    const ex = h('div', { class: 'row' }, h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { const t = $('#anova-data'); t.value = SAMPLES.anova2(); t.dispatchEvent(new Event('input')); $('#anova-mode').value = 'two'; setTimeout(() => { $('#anova-f1').value = 'turno'; $('#anova-f2').value = 'linea'; $('#anova-y').value = 'unidades'; }, 400); } }, __t('Cargar ejemplo de dos vías')));
    return {
      form, extra: [ex], run(out, v) {
        const tb = L.parseTable(v.data), yc = tb.cols.find(c => c.name === v.y), f1 = tb.cols.find(c => c.name === v.f1); let html = '';
        if (v.mode === 'one') {
          const lv = [...new Set(f1.raw)].filter(Boolean).sort(), gs = lv.map(l => f1.raw.map((r, i) => r === l ? yc.v[i] : null).filter(x => x !== null && !isNaN(x))), a = L.anova1(gs);
          html += kpis([['F', a.F, `${a.dfb} y ${a.dfw} g.l.`], [__t('p-valor'), P(a.p)], [__t('η² (razón de correlación)'), a.eta2], ['ω²', a.omega2], ['Levene (B–F)', P(a.levene.p), __t('p-valor')]]);
          html += H4(__t('Tabla ANOVA')) + tbl([__t('Fuente'), __t('g.l.'), __t('Suma de cuadrados'), __t('Cuadrado medio'), 'F', __t('p-valor')], [[__t('Entre grupos'), a.dfb, a.ssb, a.msb, a.F, P(a.p)], [__t('Dentro de grupos'), a.dfw, a.ssw, a.msw, '', ''], [__t('Total'), a.N - 1, a.ssb + a.ssw, '', '', '']]);
          html += H4(__t('Estadísticos por grupo')) + tbl([__t('Grupo'), 'n', __t('Media'), __t('Desv. est.'), __t('IC 95 % de la media')], lv.map((l, i) => { const g = a.info[i], t = L.tppf(.975, g.n - 1) * g.sd / Math.sqrt(g.n); return [esc(l), g.n, g.mean, g.sd, `[${F(g.mean - t, 3)} ; ${F(g.mean + t, 3)}]`]; }));
          html += fig(boxSVG(gs, lv, { title: __t`${v.y} por ${v.f1}`, ylab: v.y }));
          if (a.k > 2) { const q = L.qtukey(.95, a.k, a.dfw); const rows = []; for (let i = 0; i < a.k; i++) for (let j = i + 1; j < a.k; j++) { const d = a.info[i].mean - a.info[j].mean, hsd = q * Math.sqrt(a.msw / 2 * (1 / a.info[i].n + 1 / a.info[j].n)); rows.push({ cells: [`${esc(lv[i])} − ${esc(lv[j])}`, d, `[${F(d - hsd, 3)} ; ${F(d + hsd, 3)}]`, Math.abs(d) > hsd ? __t('<b class="bad">Diferencia significativa</b>') : __t('No significativa')] }); } html += H4(__t`Comparaciones múltiples de Tukey (q = ${F(q, 3)})`) + tbl([__t('Par'), __t('Diferencia'), __t('IC 95 % simultáneo'), __t('Decisión')], rows); }
          html += interp(__t`<p>El factor <b>${esc(v.f1)}</b> ${a.p < 0.05 ? __t('tiene efecto significativo') : __t('no tiene efecto significativo')} sobre ${esc(v.y)} (F(${a.dfb}, ${a.dfw}) = ${F(a.F, 3)}; p = ${P(a.p)}). Explica el ${F(a.eta2 * 100, 1)} % de la variabilidad (η²). ${a.levene.p < 0.05 ? __t('La prueba de Levene sugiere varianzas desiguales: considere ANOVA de Welch.') : __t('La homogeneidad de varianzas es aceptable.')}</p>`);
        } else {

          const y = keep.map(i => yc.v[i]), la = [...new Set(keep.map(i => f1.raw[i]))].sort(), lb = [...new Set(keep.map(i => f2.raw[i]))].sort(), dum = (col, lv) => keep.map(i => lv.slice(1).map(l => col.raw[i] === l ? 1 : 0));
          const A = dum(f1, la), B = dum(f2, lb), AB = A.map((ra, i) => ra.flatMap(x => B[i].map(z => x * z))), rss = X => L.ols(X, y).rss, ones = y.map(() => [1]);
          const cat = (...parts) => ones.map((o, i) => [1, ...parts.flatMap(p => p[i])]), r0 = L.sum(y.map(t => (t - L.mean(y)) ** 2)), rA = rss(cat(A)), rAB_ = rss(cat(A, B)), rF = rss(cat(A, B, AB)), N = y.length;
          const dfA = la.length - 1, dfB = lb.length - 1, dfI = dfA * dfB, dfE = N - la.length * lb.length, msE = rF / dfE; const rows = [['A: ' + esc(v.f1), dfA, r0 - rA, (r0 - rA) / dfA], ['B: ' + esc(v.f2), dfB, rA - rAB_, (rA - rAB_) / dfB], [__t('Interacción A×B'), dfI, rAB_ - rF, (rAB_ - rF) / dfI]].map(r => { const F_ = r[3] / msE, p = L.fsf(F_, r[1], dfE); return { cells: [r[0], r[1], r[2], r[3], F_, P(p), sig(p)], p }; });
          html += H4(__t('Tabla ANOVA de dos vías')) + tbl([__t('Fuente'), __t('g.l.'), __t('Suma de cuadrados'), __t('Cuadrado medio'), 'F', __t('p-valor'), ''], [...rows.map(r => r.cells), [__t('Residual'), dfE, rF, msE, '', '', ''], [__t('Total'), N - 1, r0, '', '', '', '']]);
          const means = la.map(a => lb.map(b => { const g = keep.filter(i => f1.raw[i] === a && f2.raw[i] === b).map(i => yc.v[i]); return g.length ? L.mean(g) : NaN; }));
          html += H4(__t('Medias por celda')) + tbl([esc(v.f1) + ' \\ ' + esc(v.f2), ...lb.map(esc)], la.map((a, i) => [esc(a), ...means[i]]));
          const allm = means.flat(); html += fig(lineSVG(lb.map((b, j) => ({ name: b, x: la.map((_, i) => i), y: la.map((_, i) => means[i][j]), dots: true })), { title: __t('Gráfico de interacción'), xlab: `${v.f1} (${la.join(' · ')})`, ylab: __t`Media de ${v.y}`, xticks: la.map((_, i) => i), xfmt: i => la[i] || '', xlim: [-0.2, la.length - 0.8], ylim: ext(allm, .15) }), __t('Rectas no paralelas indican interacción.'));
          const sg = rows.filter(r => r.p < 0.05).map(r => r.cells[0]);
          html += interp(`<p>${sg.length ? __t`Son significativos al 5 %: ${sg.join(', ')}.` : __t('Ningún término resulta significativo al 5 %.')} ${rows[2].p < 0.05 ? __t('Existe <b>interacción</b>: el efecto de un factor depende del nivel del otro, por lo que los efectos principales deben interpretarse con cuidado (revise el gráfico de interacción).') : __t('No hay evidencia de interacción: los efectos de los factores son aditivos.')}</p>`);
        }

});

reg({
  id: 'pca', group: __t('Fundamentos'), ref: 'Básico 4', title: __t('Análisis de componentes principales (ACP)'),
  lead: __t('Reduce la dimensión conservando la mayor varianza posible y revela la estructura de las variables.'),
  review: __t`<p>El ACP busca combinaciones lineales ortogonales de las variables, Zₖ = Xv_k, que maximizan la varianza. Los vectores v_k son los <b>vectores propios</b> de la matriz de covarianzas (o de correlaciones si se estandariza) y los <b>valores propios</b> λ_k son las varianzas de cada componente.</p>
  <ul><li><b>Varianza explicada:</b> λ_k/Σλ. Se retienen componentes según el criterio de Kaiser (λ &gt; 1 con variables estandarizadas), el gráfico de sedimentación o un 80–90 % acumulado.</li><li><b>Cargas</b> (loadings): peso de cada variable en el componente; las variables con cargas altas definen su significado.</li><li><b>Estandarice</b> cuando las variables tienen escalas distintas.</li></ul>`,
  code: `# Python\nfrom sklearn.decomposition import PCA\nfrom sklearn.preprocessing import StandardScaler\nZ = StandardScaler().fit_transform(X); p = PCA().fit(Z); p.explained_variance_ratio_\n# R\nprcomp(X, scale. = TRUE); summary(prcomp(X, scale. = TRUE))`,
  build() {
    const form = Form('pca', [{ k: 'data', t: 'data', label: __t('Datos numéricos'), sample: SAMPLES.multi, rows: 7 }, { k: 'cols', t: 'cols', from: 'data', label: __t('Variables incluidas') }, { k: 'sc', t: 'check', label: __t('Estandarizar (usar matriz de correlaciones)'), val: true }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), cs = v.cols.map(n => tb.cols.find(c => c.name === n)).filter(c => c && c.num); if (cs.length < 2) throw new Error(__t('Seleccione al menos dos variables numéricas.'));
        const rows = []; for (let i = 0; i < tb.n; i++) if (cs.every(c => !isNaN(c.v[i]))) rows.push(cs.map(c => c.v[i])); const pc = L.pca(rows, v.sc), p = cs.length, kaiser = pc.values.filter(l => l > 1).length;
        let html = kpis([[__t('Observaciones'), rows.length], [__t('Variables'), p], [__t('PC con λ > 1 (Kaiser)'), v.sc ? kaiser : '—'], [__t('Varianza en PC1+PC2'), `${F((pc.cum[Math.min(1, p - 1)]) * 100, 1)} %`]]);
        html += H4(__t('Valores propios y varianza explicada')) + tbl([__t('Componente'), __t('Valor propio'), __t('% varianza'), __t('% acumulado')], pc.values.map((l, i) => [`PC${i + 1}`, l, F(pc.ratio[i] * 100, 2), F(pc.cum[i] * 100, 2)]));
        html += fig(barSVG(pc.values.map((_, i) => `PC${i + 1}`), pc.values, { title: __t('Gráfico de sedimentación'), ylab: __t('Valor propio'), hline: v.sc ? [{ y: 1, t: __t('λ = 1 (Kaiser)') }] : [] }));

  <p>Estos procedimientos son voraces: no garantizan el óptimo global y los p-valores posteriores quedan optimistas. Valide con datos nuevos.</p>`,
  code: `# Python\nfrom mlxtend.feature_selection import SequentialFeatureSelector as SFS\n# R\nstep(lm(y ~ ., df), direction = "both", k = log(nrow(df)))  # BIC`,
  build() {

        let cur = v.dir === 'backward' ? [...Array(p).keys()] : [], best = crit(cur); const steps = [{ act: __t('Inicio'), set: cur.slice(), c: best }];

reg({

  code: `# Python\nfrom statsmodels.stats.diagnostic import het_breuschpagan, het_white, acorr_breusch_godfrey\nfrom statsmodels.stats.stattools import durbin_watson\nm.get_robustcov_results(cov_type="HC3")\n# R\nlibrary(lmtest); bptest(m); dwtest(m); bgtest(m, order = 1); library(sandwich); coeftest(m, vcovHC(m, "HC3"))`,

        const tb = L.parseTable(v.data), xs = v.x.filter(n => n !== 't'), D = design(tb, v.y, xs.length ? xs : v.x), m = olsFit(D), n = D.n, k = m.k, XI = L.withIntercept(D.X);

        const bp = n * aux(XI, e2), bpP = L.chi2sf(bp, k - 1); let wh = null; { const cols = []; const p = D.X[0].length; const Xw = D.X.map(r => { const o = [1, ...r]; for (let a = 0; a < p; a++) for (let b = a; b < p; b++) o.push(r[a] * r[b]); return o; }); if (Xw[0].length < n / 2) { try { const lm = n * aux(Xw, e2); wh = { lm, df: Xw[0].length - 1, p: L.chi2sf(lm, Xw[0].length - 1) }; } catch (e) { } } }

        // MCG factibles

        // HC3

        // Cochrane-Orcutt

reg({

  lead: __t('Extensión del modelo lineal al aprendizaje automático: regresión con pérdida ε-insensible.'),
  review: __t`<p>La regresión de vectores de soporte minimiza ½‖w‖² + C·Σ max(0, |yᵢ − wᵀxᵢ − b| − ε). Los errores menores que ε no se penalizan (tubo ε); solo los puntos fuera del tubo, los <b>vectores de soporte</b>, determinan el modelo.</p>
  <ul><li><b>C</b> controla la penalización de las desviaciones: C grande ajusta más; C pequeño suaviza.</li><li><b>ε</b> es el ancho del tubo: mayor ε produce modelos más simples y con menos vectores de soporte.</li><li>La versión mostrada es <i>lineal</i> y se resuelve por descenso de subgradiente sobre variables estandarizadas; con núcleos (RBF) se obtiene una regresión no lineal.</li></ul>`,
  code: __t`# Python\nfrom sklearn.svm import SVR\nSVR(kernel="linear", C=10, epsilon=0.5).fit(X, y)   # kernel="rbf" para no lineal\n# R\nlibrary(e1071); svm(y ~ x, data = df, type = "eps-regression", kernel = "linear", cost = 10, epsilon = 0.5)`,
  build() {
    const form = Form('svr', [{ k: 'data', t: 'data', label: __t('Datos'), sample: SAMPLES.simple, rows: 6 }, { k: 'x', t: 'col', from: 'data', label: __t('Variable X'), def: 'first' }, { k: 'y', t: 'col', from: 'data', label: __t('Variable Y') }, { k: 'C', t: 'num', label: __t('C (penalización)'), val: 10, min: 0.01 }, { k: 'eps', t: 'num', label: __t('ε (ancho del tubo, en desviaciones de y)'), val: 0.3, min: 0 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), D = design(tb, v.y, [v.x]), x = D.X.map(r => r[0]), y = D.y, n = D.n, mx = L.mean(x), sx = L.sd(x), my = L.mean(y), sy = L.sd(y), xs = x.map(t => (t - mx) / sx), ys = y.map(t => (t - my) / sy);
        let w = 0, b = 0; const lam = 1 / (v.C * n); for (let it = 1; it <= 30000; it++) { const lr = 0.2 / Math.sqrt(it); let gw = lam * w, gb = 0; for (let i = 0; i < n; i++) { const r = ys[i] - (w * xs[i] + b); if (Math.abs(r) > v.eps) { const s = Math.sign(r); gw -= s * xs[i] / n; gb -= s / n; } } w -= lr * gw; b -= lr * gb; }
        const slope = w * sy / sx, icpt = my + sy * b - slope * mx, ols = L.ols(L.withIntercept(x.map(t => [t])), y), sv = xs.map((t, i) => Math.abs(ys[i] - (w * t + b)) >= v.eps - 1e-6), nsv = sv.filter(Boolean).length, tube = v.eps * sy, xl = ext(x, .03), gx = xl;
        const rmse = Math.sqrt(L.mean(x.map((t, i) => (y[i] - icpt - slope * t) ** 2))), mae = L.mean(x.map((t, i) => Math.abs(y[i] - icpt - slope * t)));

        html += fig(plot({ title: __t('Regresión SVM lineal con tubo ε'), xlab: v.x, ylab: v.y, xlim: xl, ylim: ext(y, .1), legend: [{ name: 'SVR', c: 2 }, { name: __t('MCO'), c: 3, dash: true }] }, a => `<polygon class="f2" fill-opacity=".14" points="${gx.map(t => `${a.sx(t)},${a.sy(icpt + slope * t + tube)}`).join(' ')} ${gx.slice().reverse().map(t => `${a.sx(t)},${a.sy(icpt + slope * t - tube)}`).join(' ')}"/>` + path(gx, gx.map(t => icpt + slope * t), a.sx, a.sy, 2, 2.4) + path(gx, gx.map(t => ols.b[0] + ols.b[1] * t), a.sx, a.sy, 3, 1.8, '5 4') + x.map((t, i) => `<circle class="f${sv[i] ? 4 : 1}" fill-opacity=".75" cx="${a.sx(t)}" cy="${a.sy(y[i])}" r="${sv[i] ? 4.2 : 3}"/>`).join('')), __t('Puntos rojos: vectores de soporte (sobre el borde o fuera del tubo).'));
        html += interp(__t`<p>La SVR ajusta una recta con pendiente ${F(slope, 3)} frente a ${F(ols.b[1], 3)} de MCO. Con ε = ${F(v.eps, 2)} desviaciones estándar de y (±${F(tube, 2)} unidades), ${nsv} de ${n} puntos son vectores de soporte. ${Math.abs(slope - ols.b[1]) / Math.abs(ols.b[1]) > 0.1 ? __t('Las pendientes difieren: la pérdida ε-insensible es menos sensible a atípicos que MCO.') : __t('Ambas rectas son casi idénticas porque los datos son aproximadamente lineales y sin atípicos.')}</p>`);

  code: `# Python\nfrom statsmodels.tsa.stattools import adfuller\nadfuller(y, regression="c", autolag="AIC")\n# R\nlibrary(urca); summary(ur.df(y, type = "drift", lags = 2))`,
