  review: `<p>Un módulo aislado entrega un cálculo; una <b>ruta</b> encadena varios para que cada resultado sea verificado por el siguiente. El flujo es: <b>fuente de datos → tabla activa → explorar → modelar → validar → conclusión</b>.</p>
  <ul><li><b>Continuidad:</b> cada paso recibe la tabla (o los predictores, el orden de diferenciación o los grupos) del paso anterior. El paso de raíz unitaria decide <i>d</i> para SARIMA; la correlación elige los predictores de la regresión; K-medias agrega la columna «grupo» que usa el ANOVA.</li><li><b>Verificación cruzada:</b> los pasos de validación pueden <i>corregir</i> la conclusión anterior. Si los residuos de la regresión están autocorrelacionados, se recalcula la significancia con errores robustos Newey–West y se informa qué variables dejan de ser significativas. Si hay puntos influyentes (distancia de Cook &gt; 4/n), se reajusta sin ellos para ver si la conclusión depende de pocos datos.</li><li><b>Validación del pronóstico:</b> se reserva el final de la serie, se pronostica y se compara con repetir el último valor. Si el modelo no mejora esa referencia trivial, la ruta lo advierte.</li><li><b>Nivel de respaldo:</b> proporción de verificaciones superadas. Alto: 80 % o más y ninguna no superada; moderado: 50 % a 80 %; bajo: menos de 50 % o alguna no superada.</li><li><b>Fuentes en línea:</b> el navegador consulta directamente a la fuente. Los datos que usted pega o carga no salen del navegador, pero la consulta sí es una solicitud a un tercero. Si una fuente no permite consultas desde otras páginas (CORS), pegue o cargue el CSV descargado.</li></ul>

/* ---------- sonidos (Web Audio, sintetizados: no hay archivos externos) ---------- */
const SFX = (() => {
  let ctx = null, master = null;
  const ensure = () => {
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); master = ctx.createGain(); master.connect(ctx.destination); }
      if (ctx.state === 'suspended') ctx.resume();
      master.gain.value = Math.pow(SETTINGS.vol, 1.6); return ctx;
    } catch (e) { return null; }
  };
  const tone = (f, d, o = {}) => {
    const c = ensure(); if (!c) return; const t0 = c.currentTime + (o.at || 0), osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t0); if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + d);
    const v = o.v == null ? 0.2 : o.v; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + d + 0.03);
  };
  const lib = {
    click: () => { tone(740, 0.07, { type: 'triangle', v: 0.2, to: 480 }); tone(1480, 0.03, { type: 'square', v: 0.03 }); },
    hover: () => tone(1250, 0.03, { type: 'sine', v: 0.05 }),
    nav: () => { tone(420, 0.09, { type: 'triangle', v: 0.16 }); tone(630, 0.09, { type: 'triangle', v: 0.14, at: 0.06 }); },
    ok: () => { tone(523, 0.11, { type: 'triangle', v: 0.2 }); tone(784, 0.18, { type: 'triangle', v: 0.2, at: 0.09 }); },
    add: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, { type: 'sine', v: 0.18, at: i * 0.07 })); },
    err: () => { tone(220, 0.18, { type: 'sawtooth', v: 0.14, to: 140 }); tone(165, 0.22, { type: 'sawtooth', v: 0.12, at: 0.14, to: 110 }); },
    toggle: () => tone(900, 0.06, { type: 'square', v: 0.07, to: 1200 }),
    alarm: () => { [0, 0.22].forEach(a => tone(980, 0.14, { type: 'square', v: 0.1, at: a })); },
    warn: () => tone(660, 0.16, { type: 'square', v: 0.07 }),
    ack: () => { tone(700, 0.06, { type: 'triangle', v: 0.14 }); tone(1050, 0.1, { type: 'triangle', v: 0.14, at: 0.05 }); },
    open: () => { tone(380, 0.12, { type: 'sine', v: 0.15, to: 760 }); },
    close: () => { tone(760, 0.12, { type: 'sine', v: 0.13, to: 380 }); }
  };
  const play = n => { if (!SETTINGS.sound || !lib[n]) return; try { lib[n](); } catch (e) { } };
  return { play, force: n => { try { lib[n](); } catch (e) { } } };
})();

  const dl = h('button', { class: 'btn pri', id: 'repDl', type: 'button', onclick: async () => { const msg = $('#repMsg'); msg.textContent = ''; try { const d = await claude.use('downloads'); if (!d) { msg.textContent = 'La descarga directa no está disponible en esta vista. Use «Copiar HTML» y guárdelo como archivo .html.'; return; } await d.save({ filename: `informe-${slug(REPORT.meta.titulo)}.html`, data: exportDoc() }); msg.textContent = 'Informe guardado. Ábralo en su navegador; desde allí puede imprimirlo o guardarlo como PDF.'; } catch (e) { msg.textContent = e && e.code === 'declined' ? 'Descarga cancelada.' : 'No se pudo guardar el archivo (' + (e.code || e.message || 'error') + '). Pruebe «Copiar HTML».'; } } }, 'Descargar informe (.html)');
  const cp = h('button', { class: 'btn', id: 'repCopy', type: 'button', onclick: async () => { const msg = $('#repMsg'); try { await navigator.clipboard.writeText(exportDoc()); msg.textContent = 'HTML copiado al portapapeles. Péguelo en un archivo con extensión .html.'; } catch (e) { const t = h('textarea', { rows: 6, class: 'mono', 'aria-label': 'HTML del informe' }); t.value = exportDoc(); msg.textContent = 'Su navegador bloqueó el portapapeles. Seleccione y copie el texto de abajo.'; msg.after(t); t.select(); } } }, 'Copiar HTML');
  const draft = h('button', { class: 'btn', id: 'repDraft', type: 'button', onclick: () => { const bits = REPORT.sections.map(s => { const d = document.createElement('div'); d.innerHTML = s.html; const t = $('.interp', d); if (!t) return ''; const txt = t.textContent.replace(/^Interpretación/, '').trim(), first = txt.match(/^.*?[.!?](?=\s|$)(?:\s.*?[.!?](?=\s|$))?/); return `${s.title}: ${(first ? first[0] : txt).slice(0, 320)}`; }).filter(Boolean); if (!bits.length) return; REPORT.meta.resumen = bits.join('\n'); $('#rm-resumen').value = REPORT.meta.resumen; saveReport(); renderPreview(); } }, 'Redactar resumen desde las interpretaciones');

function buildNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  const box = (title, items, cnt) => h('section', { class: 'ngb' }, h('div', { class: 'ng' }, h('span', null, title), cnt ? h('b', { class: 'cnt' }, String(cnt)) : null), ...items);

  GROUPS.forEach(g => { const ms = MODS.filter(m => m.group === g); if (!ms.length) return; nav.append(box(g, ms.map(m => h('a', { href: `#${m.id}`, 'data-id': m.id, class: 'ni' }, h('span', null, m.title.replace(/^(Regresión lineal múltiple y predicción)$/, 'Regresión lineal múltiple')), h('small', null, m.ref))), ms.length)); });
  nav.append(box('Entregable', [h('a', { href: '#informe', 'data-id': 'informe', class: 'ni' }, h('span', null, 'Informe ', h('b', { id: 'repCount', class: 'badge', hidden: true }, '0')))]));
  buildGrip();
}
/* Ancho del panel izquierdo: se ajusta arrastrando; vive solo en memoria y vuelve al valor base al reiniciar la app. */
function buildGrip() {
  const app = $('.app'); if (!app || $('#navGrip')) return;
  const MIN = 260, maxW = () => Math.max(MIN, Math.min(680, window.innerWidth - 480));
  let cur = 359;
  const set = w => { cur = Math.round(Math.max(MIN, Math.min(maxW(), w))); app.style.setProperty('--navw', cur + 'px'); grip.setAttribute('aria-valuenow', cur); };
  const grip = h('div', { id: 'navGrip', role: 'separator', 'aria-orientation': 'vertical', tabindex: '0', 'aria-label': 'Ajustar ancho del panel izquierdo', 'aria-valuemin': MIN, 'aria-valuenow': cur, title: 'Arrastre para ajustar el ancho del panel' }, h('i'));
  app.append(grip);
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); grip.setPointerCapture(e.pointerId); grip.classList.add('drag'); document.body.classList.add('resizing');
    const x0 = app.getBoundingClientRect().left;
    const mv = ev => set(ev.clientX - x0);
    const up = () => { grip.classList.remove('drag'); document.body.classList.remove('resizing'); grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up); };
    grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  });
  grip.addEventListener('keydown', e => { const d = e.key === 'ArrowLeft' ? -16 : e.key === 'ArrowRight' ? 16 : 0; if (d) { e.preventDefault(); set(cur + d); } });
  window.addEventListener('resize', () => set(cur));
}
function start() {
  loadReport(); if (!REPORT.meta.autor) REPORT.meta.autor = PROFILE.nombre; if (!REPORT.meta.org) REPORT.meta.org = PROFILE.org || '';
  initAppearance(); buildSettings(); initFx(); applyIdentity();
  buildNav(); buildHome(); buildReportPage(); buildPanel(); updateBadge();
  document.addEventListener('profile', () => { buildHome(); renderPreview(); });
  $('#menuBtn').onclick = () => { const n = $('#nav'), o = n.classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', o); };
  window.addEventListener('hashchange', route); route();
}
start();
