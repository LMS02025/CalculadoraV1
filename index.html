    const ch = Math.max(...D.names.map((_, j) => Math.abs(hb.b[j + 1] - m.b[j + 1]) / (Math.abs(m.b[j + 1]) || 1)));
    html += interp(`<p>${flag.length ? `Se identifican ${flag.length} observaciones potencialmente problemáticas; las de mayor distancia de Cook son las filas ${flag.slice(0, 3).map(f => f.i + 1).join(', ')}.` : 'No hay observaciones problemáticas.'} La estimación robusta cambia los coeficientes hasta un ${F(ch * 100, 1)} % respecto de MCO${ch > 0.1 ? ': los atípicos influyen de forma material y conviene usar Huber o investigar esos registros' : ': el ajuste es estable frente a los atípicos'}. Antes de eliminar datos, verifique si son errores o casos legítimos.</p>`);
    out.innerHTML = html;
  } }; }
});

reg({
  id: 'het', group: 'Modelos lineales', ref: 'Avanzado 1e', title: 'Heterocedasticidad y autocorrelación',
  lead: 'Pruebas de Breusch–Pagan, White, Durbin–Watson y Breusch–Godfrey, con correcciones MCG, Cochrane–Orcutt y errores robustos.',
  review: `<p>MCO supone errores con varianza constante (homocedasticidad) y no correlacionados. Si se violan, los coeficientes siguen siendo insesgados pero los errores estándar y las pruebas dejan de ser válidos.</p>
  <ul><li><b>Breusch–Pagan (Koenker):</b> regresa e² sobre X; LM = n·R² ~ χ²(k−1). <b>White:</b> añade cuadrados y productos.</li><li><b>Durbin–Watson:</b> DW = Σ(eₜ−eₜ₋₁)²/Σeₜ² ≈ 2(1−ρ̂); ~2 sin autocorrelación, &lt;2 positiva, &gt;2 negativa. <b>Breusch–Godfrey:</b> LM = n·R² de regresar e sobre X y eₜ₋₁.</li><li><b>MCG factibles:</b> con varianza σᵢ² estimada se ponderan las observaciones por 1/σ̂ᵢ². <b>Cochrane–Orcutt</b> transforma y*ₜ = yₜ − ρ̂yₜ₋₁ para errores AR(1).</li><li><b>Errores robustos HC3</b> corrigen los errores estándar sin cambiar los coeficientes.</li><li>Se pueden modelar los residuos con un <b>ARMA(p,q)</b> para capturar la dependencia restante.</li></ul>`,
  code: `# Python\nfrom statsmodels.stats.diagnostic import het_breuschpagan, het_white, acorr_breusch_godfrey\nfrom statsmodels.stats.stattools import durbin_watson\nm.get_robustcov_results(cov_type="HC3")\n# R\nlibrary(lmtest); bptest(m); dwtest(m); bgtest(m, order = 1); library(sandwich); coeftest(m, vcovHC(m, "HC3"))`,
  build() {
    const form = Form('het', [{ k: 'data', t: 'data', label: 'Datos ordenados en el tiempo', sample: SAMPLES.hetauto, rows: 7 }, { k: 'y', t: 'col', from: 'data', label: 'Variable respuesta', def: 'y' }, { k: 'x', t: 'cols', from: 'data', label: 'Variables explicativas' }, { k: 'p', t: 'num', label: 'ARMA en residuos: p (AR)', val: 1, min: 0, max: 4 }, { k: 'q', t: 'num', label: 'ARMA en residuos: q (MA)', val: 0, min: 0, max: 3 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), xs = v.x.filter(n => n !== 't'), D = design(tb, v.y, xs.length ? xs : v.x), m = olsFit(D), n = D.n, k = m.k, XI = L.withIntercept(D.X);
        const aux = (X, y) => L.ols(X, y).r2, e2 = m.res.map(e => e * e);
        const bp = n * aux(XI, e2), bpP = L.chi2sf(bp, k - 1); let wh = null; { const cols = []; const p = D.X[0].length; const Xw = D.X.map(r => { const o = [1, ...r]; for (let a = 0; a < p; a++) for (let b = a; b < p; b++) o.push(r[a] * r[b]); return o; }); if (Xw[0].length < n / 2) { try { const lm = n * aux(Xw, e2); wh = { lm, df: Xw[0].length - 1, p: L.chi2sf(lm, Xw[0].length - 1) }; } catch (e) { } } }
        const dw = L.dw(m.res), rho = 1 - dw / 2; const lag = m.res.slice(0, -1), Xbg = XI.slice(1).map((r, i) => [...r, lag[i]]), bg = (n - 1) * aux(Xbg, m.res.slice(1)), bgP = L.chi2sf(bg, 1);
        // MCG factibles
        const lg = L.ols(XI, e2.map(t => Math.log(t + 1e-12))), wts = lg.fit.map(f => 1 / Math.exp(f)), wl = L.ols(XI, D.y, { w: wts });
        // HC3
        const Xt = L.M.T(XI), meat = Array.from({ length: k }, () => new Array(k).fill(0)); XI.forEach((r, i) => { const s = (m.res[i] / (1 - m.h[i])) ** 2; for (let a = 0; a < k; a++) for (let b = 0; b < k; b++) meat[a][b] += r[a] * r[b] * s; }); const cov = L.M.mul(L.M.mul(m.XtXi, meat), m.XtXi), seh = cov.map((r, i) => Math.sqrt(r[i]));
        // Cochrane-Orcutt
        let rh = rho, co; for (let it = 0; it < 20; it++) { const ys = D.y.slice(1).map((t, i) => t - rh * D.y[i]), Xs = XI.slice(1).map((r, i) => r.map((a, j) => j === 0 ? 1 - rh : a - rh * XI[i][j])); co = L.ols(Xs, ys, { intercept: false }); const res = D.y.map((t, i) => t - L.sum(XI[i].map((a, j) => a * co.b[j]))); const nr = L.sum(res.slice(1).map((e, i) => e * res[i])) / L.sum(res.slice(0, -1).map(e => e * e)); if (Math.abs(nr - rh) < 1e-8) { rh = nr; break; } rh = nr; }
        const nm = ['(Intercepto)', ...D.names]; let html = kpis([['Breusch–Pagan LM', bp, `p ${P(bpP)}`], ['White LM', wh ? wh.lm : '—', wh ? `p ${P(wh.p)}` : 'no aplicable'], ['Durbin–Watson', dw, `ρ̂ ≈ ${F(rho, 3)}`], ['Breusch–Godfrey LM', bg, `p ${P(bgP)}`]]);
        html += H4('Comparación de estimaciones') + tbl(['Término', 'MCO', 'EE (MCO)', 'EE robusto HC3', 'MCG factibles', 'EE (MCG)', 'Cochrane–Orcutt', 'EE (C–O)'], nm.map((t, j) => [esc(t), m.b[j], m.se[j], seh[j], wl.b[j], wl.se[j], co.b[j], co.se[j]]));
        html += `<div class="grid2">${fig(resPlot(m.fit, m.res, 'Residuos vs ajustados (¿embudo?)'))}${fig(lineSVG([{ name: 'Residuos', x: m.res.map((_, i) => i + 1), y: m.res, c: 1 }], { title: 'Residuos en el orden de las observaciones', xlab: 'Observación', ylab: 'Residuo', h: 300 }))}</div>`;
        const ac = L.acf(m.res, Math.min(20, Math.floor(n / 4))); html += fig(acfSVG(ac, n, 'Autocorrelación de los residuos'));
        const p = Math.round(v.p), q = Math.round(v.q); if (p + q > 0) { const ar = L.arima(m.res, { p, q, mean: false }), lb = L.ljungBox(ar.e.slice(ar.burn), 10, p + q); html += H4(`Residuos modelados como ARMA(${p},${q})`) + tbl(['Parámetro', 'Estimación'], [...ar.u.phi.map((t, i) => [`φ${i + 1}`, t]), ...ar.u.theta.map((t, i) => [`θ${i + 1}`, t]), ['σ² de las innovaciones', ar.sigma2]]) + `<p class="small">Ljung–Box (10 rezagos) sobre las innovaciones: p = ${P(lb.p)} → ${lb.p > 0.05 ? 'sin autocorrelación remanente' : 'queda dependencia sin modelar'}.</p>`; }
        html += interp(`<p>${bpP < 0.05 || (wh && wh.p < 0.05) ? '<b class="bad">Hay evidencia de heterocedasticidad</b>' : '<b class="good">No hay evidencia de heterocedasticidad</b>'} (Breusch–Pagan p = ${P(bpP)}). ${dw < 1.5 || bgP < 0.05 ? `<b class="bad">Los residuos están autocorrelacionados</b> (DW = ${F(dw, 2)}; Breusch–Godfrey p = ${P(bgP)}; ρ̂ ≈ ${F(rho, 2)})` : `<b class="good">No hay evidencia de autocorrelación</b> (DW = ${F(dw, 2)})`}. ${(bpP < 0.05 || dw < 1.5) ? 'Los errores estándar de MCO son poco confiables; use los errores robustos HC3, MCG factibles o Cochrane–Orcutt que se muestran arriba.' : ''}</p>`);
        out.innerHTML = html;
      }
    };
  }
});

reg({
  id: 'svr', group: 'Modelos lineales', ref: 'Avanzado 1f', title: 'Regresión SVM (SVR)',
  lead: 'Extensión del modelo lineal al aprendizaje automático: regresión con pérdida ε-insensible.',
  review: `<p>La regresión de vectores de soporte minimiza ½‖w‖² + C·Σ max(0, |yᵢ − wᵀxᵢ − b| − ε). Los errores menores que ε no se penalizan (tubo ε); solo los puntos fuera del tubo, los <b>vectores de soporte</b>, determinan el modelo.</p>
  <ul><li><b>C</b> controla la penalización de las desviaciones: C grande ajusta más; C pequeño suaviza.</li><li><b>ε</b> es el ancho del tubo: mayor ε produce modelos más simples y con menos vectores de soporte.</li><li>La versión mostrada es <i>lineal</i> y se resuelve por descenso de subgradiente sobre variables estandarizadas; con núcleos (RBF) se obtiene una regresión no lineal.</li></ul>`,
  code: `# Python\nfrom sklearn.svm import SVR\nSVR(kernel="linear", C=10, epsilon=0.5).fit(X, y)   # kernel="rbf" para no lineal\n# R\nlibrary(e1071); svm(y ~ x, data = df, type = "eps-regression", kernel = "linear", cost = 10, epsilon = 0.5)`,
  build() {
    const form = Form('svr', [{ k: 'data', t: 'data', label: 'Datos', sample: SAMPLES.simple, rows: 6 }, { k: 'x', t: 'col', from: 'data', label: 'Variable X', def: 'first' }, { k: 'y', t: 'col', from: 'data', label: 'Variable Y' }, { k: 'C', t: 'num', label: 'C (penalización)', val: 10, min: 0.01 }, { k: 'eps', t: 'num', label: 'ε (ancho del tubo, en desviaciones de y)', val: 0.3, min: 0 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), D = design(tb, v.y, [v.x]), x = D.X.map(r => r[0]), y = D.y, n = D.n, mx = L.mean(x), sx = L.sd(x), my = L.mean(y), sy = L.sd(y), xs = x.map(t => (t - mx) / sx), ys = y.map(t => (t - my) / sy);
        let w = 0, b = 0; const lam = 1 / (v.C * n); for (let it = 1; it <= 30000; it++) { const lr = 0.2 / Math.sqrt(it); let gw = lam * w, gb = 0; for (let i = 0; i < n; i++) { const r = ys[i] - (w * xs[i] + b); if (Math.abs(r) > v.eps) { const s = Math.sign(r); gw -= s * xs[i] / n; gb -= s / n; } } w -= lr * gw; b -= lr * gb; }
        const slope = w * sy / sx, icpt = my + sy * b - slope * mx, ols = L.ols(L.withIntercept(x.map(t => [t])), y), sv = xs.map((t, i) => Math.abs(ys[i] - (w * t + b)) >= v.eps - 1e-6), nsv = sv.filter(Boolean).length, tube = v.eps * sy, xl = ext(x, .03), gx = xl;
        const rmse = Math.sqrt(L.mean(x.map((t, i) => (y[i] - icpt - slope * t) ** 2))), mae = L.mean(x.map((t, i) => Math.abs(y[i] - icpt - slope * t)));
        let html = kpis([['Pendiente SVR', slope], ['Intercepto SVR', icpt], ['Pendiente MCO', ols.b[1]], ['Intercepto MCO', ols.b[0]], ['Vectores de soporte', nsv, `de ${n}`], ['RMSE (SVR)', rmse], ['MAE (SVR)', mae], ['RMSE (MCO)', Math.sqrt(ols.rss / n)]]);
        html += fig(plot({ title: 'Regresión SVM lineal con tubo ε', xlab: v.x, ylab: v.y, xlim: xl, ylim: ext(y, .1), legend: [{ name: 'SVR', c: 2 }, { name: 'MCO', c: 3, dash: true }] }, a => `<polygon class="f2" fill-opacity=".14" points="${gx.map(t => `${a.sx(t)},${a.sy(icpt + slope * t + tube)}`).join(' ')} ${gx.slice().reverse().map(t => `${a.sx(t)},${a.sy(icpt + slope * t - tube)}`).join(' ')}"/>` + path(gx, gx.map(t => icpt + slope * t), a.sx, a.sy, 2, 2.4) + path(gx, gx.map(t => ols.b[0] + ols.b[1] * t), a.sx, a.sy, 3, 1.8, '5 4') + x.map((t, i) => `<circle class="f${sv[i] ? 4 : 1}" fill-opacity=".75" cx="${a.sx(t)}" cy="${a.sy(y[i])}" r="${sv[i] ? 4.2 : 3}"/>`).join('')), 'Puntos rojos: vectores de soporte (sobre el borde o fuera del tubo).');
        html += interp(`<p>La SVR ajusta una recta con pendiente ${F(slope, 3)} frente a ${F(ols.b[1], 3)} de MCO. Con ε = ${F(v.eps, 2)} desviaciones estándar de y (±${F(tube, 2)} unidades), ${nsv} de ${n} puntos son vectores de soporte. ${Math.abs(slope - ols.b[1]) / Math.abs(ols.b[1]) > 0.1 ? 'Las pendientes difieren: la pérdida ε-insensible es menos sensible a atípicos que MCO.' : 'Ambas rectas son casi idénticas porque los datos son aproximadamente lineales y sin atípicos.'}</p>`);
        out.innerHTML = html;
      }
    };
  }
});

reg({
  id: 'boot', group: 'Cómputo intensivo', ref: 'Avanzado 2b', title: 'Bootstrap paramétrico y no paramétrico',
  lead: 'Estima error estándar, sesgo e intervalos de confianza de cualquier estadístico remuestreando los datos.',
  review: `<p>El bootstrap aproxima la distribución muestral de un estadístico θ̂ generando B muestras artificiales y recalculando θ̂* en cada una.</p>
  <ul><li><b>No paramétrico:</b> remuestrea con reposición las observaciones originales (no supone una distribución).</li><li><b>Paramétrico:</b> ajusta un modelo (aquí normal, o en regresión y = Xβ̂ + N(0, σ̂²)) y simula muestras nuevas desde él.</li><li><b>Residuos (regresión):</b> mantiene X y remuestrea los residuos del ajuste.</li><li><b>Error estándar bootstrap</b> = desv. estándar de los θ̂*; <b>sesgo</b> = media(θ̂*) − θ̂.</li><li><b>IC percentil:</b> cuantiles α/2 y 1−α/2 de θ̂*. <b>IC básico:</b> [2θ̂ − q₁₋α/₂ ; 2θ̂ − q_α/₂]. <b>IC normal:</b> θ̂ ± z·EE*.</li></ul>
  <p>Con B ≥ 2000 los intervalos son estables; es una tarea ideal para paralelizar en la nube (EC2).</p>`,
  code: `# Python\nimport numpy as np\nrng = np.random.default_rng(1)\nboot = [np.median(rng.choice(x, len(x))) for _ in range(5000)]\nnp.percentile(boot, [2.5, 97.5])\n# R\nlibrary(boot); boot.ci(boot(x, function(d, i) median(d[i]), R = 5000), type = c("perc", "basic", "norm"))`,
  build() {
    const form = Form('boot', [{ k: 'data', t: 'data', label: 'Datos', sample: SAMPLES.simple, rows: 6 }, { k: 'a', t: 'col', from: 'data', label: 'Variable A (o X)', def: 'first' }, { k: 'b', t: 'col', from: 'data', label: 'Variable B (Y, para pendiente/correlación)' }, { k: 'stat', t: 'sel', label: 'Estadístico', opts: [['mean', 'Media de A'], ['median', 'Mediana de A'], ['sd', 'Desviación estándar de A'], ['p90', 'Percentil 90 de A'], ['slope', 'Pendiente de la regresión B ~ A'], ['cor', 'Correlación de Pearson A–B']], val: 'median' }, { k: 'mode', t: 'sel', label: 'Método', opts: [['np', 'No paramétrico (casos)'], ['par', 'Paramétrico (normal)'], ['res', 'Remuestreo de residuos (solo pendiente)']] }, { k: 'B', t: 'num', label: 'Réplicas B', val: 2000, min: 200, max: 20000 }, { k: 'conf', t: 'num', label: 'Nivel de confianza', val: 0.95, min: 0.5, max: 0.999 }, { k: 'seed', t: 'num', label: 'Semilla', val: 123 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), ca = tb.cols.find(c => c.name === v.a), cb = tb.cols.find(c => c.name === v.b), idx = []; for (let i = 0; i < tb.n; i++) if (!isNaN(ca.v[i]) && (!cb || !cb.num || !isNaN(cb.v[i]))) idx.push(i);

reg({
  id: 'sql', group: 'Datos: SQL y Spark', ref: 'Avanzado 4', title: 'SQL: consultas, modelo relacional y depuración',

  review: `<p>SQL (<i>Structured Query Language</i>) consulta bases de datos <b>relacionales</b>: tablas con filas y columnas, vinculadas por <b>claves primarias</b> (identifican cada fila) y <b>claves foráneas</b> (referencian a otra tabla). Las tablas ventas y clientes del ejemplo se relacionan por <code>ventas.cliente_id = clientes.id</code>.</p>
  <ul><li><b>Orden lógico de ejecución:</b> FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.</li><li><b>Agregaciones:</b> COUNT, SUM, AVG, MIN, MAX. <b>WHERE</b> filtra filas; <b>HAVING</b> filtra grupos.</li><li><b>JOIN:</b> INNER conserva solo coincidencias; LEFT conserva todas las filas de la izquierda (con NULL si no hay pareja).</li><li><b>Depuración:</b> detectar nulos, duplicados y valores fuera de rango antes de analizar. Los NULL no participan en SUM/AVG y requieren <code>IS NULL</code> para filtrarse.</li></ul>
  <p>El motor incluido soporta SELECT, DISTINCT, JOIN/LEFT JOIN, WHERE (AND, OR, NOT, IN, LIKE, BETWEEN, IS NULL), GROUP BY, HAVING, ORDER BY y LIMIT. Es una simulación didáctica; la sintaxis es compatible con SQL Server en estos casos.</p>`,
  code: `-- SQL Server\nSELECT c.region, COUNT(*) AS n, SUM(v.monto) AS total\nFROM ventas v JOIN clientes c ON v.cliente_id = c.id\nWHERE v.estado = 'pagada'\nGROUP BY c.region HAVING SUM(v.monto) > 1000 ORDER BY total DESC;\n# Python\nimport pyodbc, pandas as pd\ncn = pyodbc.connect("DRIVER={ODBC Driver 18 for SQL Server};SERVER=srv;DATABASE=db;UID=u;PWD=p")\npd.read_sql(consulta, cn)`,

/* ============================== APRENDIZAJE AUTOMÁTICO ============================== */
function numMatrix(tb, names) { const cs = names.map(n => tb.cols.find(c => c.name === n)).filter(c => c && c.num), idx = []; for (let i = 0; i < tb.n; i++) if (cs.every(c => !isNaN(c.v[i]))) idx.push(i); return { X: idx.map(i => cs.map(c => c.v[i])), names: cs.map(c => c.name), idx }; }
const zs = X => { const st = L.standardize(X); return st.Z; };
// extrae X y y binaria 0/1
function binData(tb, ycol, xnames) {
  const yc = tb.cols.find(c => c.name === ycol), xs = xnames.filter(n => n !== ycol).map(n => tb.cols.find(c => c.name === n)).filter(c => c && c.num), idx = [];
  for (let i = 0; i < tb.n; i++) if (yc.raw[i] !== '' && xs.every(c => !isNaN(c.v[i]))) idx.push(i);
  const labs = [...new Set(idx.map(i => yc.raw[i]))].sort(); if (labs.length !== 2) throw new Error(`La variable respuesta debe tener exactamente 2 categorías (tiene ${labs.length}).`);
  return { X: idx.map(i => xs.map(c => c.v[i])), y: idx.map(i => yc.raw[i] === labs[1] ? 1 : 0), names: xs.map(c => c.name), labs, n: idx.length };
}
const splitTT = (n, frac, rnd) => { const ord = L.shuffle([...Array(n).keys()], rnd), nt = Math.round(n * frac); return { te: ord.slice(0, nt), tr: ord.slice(nt) }; };
const sub = (A, ix) => ix.map(i => A[i]);
const confTbl = (c, labs) => tbl(['', `Pred. ${esc(labs[0])}`, `Pred. ${esc(labs[1])}`], [[`Real ${esc(labs[0])}`, c.tn, c.fp], [`Real ${esc(labs[1])}`, c.fn, c.tp]]);
const rocSVG = (y, s, title) => { const r = L.roc(y, s), a = L.auc(y, s); return plot({ title: `${title} (AUC = ${F(a, 3)})`, xlab: '1 − especificidad', ylab: 'Sensibilidad', xlim: [0, 1], ylim: [0, 1], h: 320, w: 440 }, A => path([0, 1], [0, 1], A.sx, A.sy, 5, 1.2, '4 4') + path(r.map(p => p[0]), r.map(p => p[1]), A.sx, A.sy, 1, 2.4)); };
const clsForm = (mod, sample = SAMPLES.clasif, extra = []) => Form(mod, [{ k: 'data', t: 'data', label: 'Datos (la respuesta binaria en una columna)', sample, rows: 6 }, { k: 'y', t: 'col', from: 'data', any: true, label: 'Variable respuesta (2 categorías)', def: 'evento' }, { k: 'x', t: 'cols', from: 'data', label: 'Variables predictoras', }, ...extra]);

reg({
  id: 'kmeans', group: 'Aprendizaje automático', ref: 'Avanzado 6', title: 'K-medias y clustering jerárquico',

  review: `<p>El <i>clustering</i> agrupa observaciones similares sin etiquetas previas. La similaridad se mide con una distancia, normalmente euclídea d(x,y) = √Σ(xⱼ−yⱼ)²; <b>estandarice</b> las variables si tienen escalas distintas.</p>
  <ul><li><b>K-medias:</b> minimiza la inercia W = Σ‖xᵢ − μ_{c(i)}‖². Alterna asignar cada punto al centroide más cercano y recalcular centroides. La inicialización <i>k-means++</i> reparte bien los centros iniciales.</li><li><b>Jerárquico aglomerativo:</b> parte de n clusters y fusiona los dos más cercanos. Enlaces: <i>Ward</i> (minimiza el aumento de varianza), <i>promedio</i>, <i>completo</i> (distancia máxima) y <i>simple</i> (mínima). El <b>dendrograma</b> muestra las fusiones; cortarlo a una altura da k grupos.</li><li><b>Validación:</b> <b>silueta</b> s(i) = (b−a)/max(a,b) en [−1,1] (cercana a 1: bien agrupado); <b>Calinski–Harabasz</b> (mayor es mejor); <b>codo</b> en la inercia.</li></ul>`,
  code: `# Python\nfrom sklearn.cluster import KMeans, AgglomerativeClustering\nfrom sklearn.metrics import silhouette_score\nKMeans(4, n_init=10).fit(Z).inertia_; silhouette_score(Z, labels)\nAgglomerativeClustering(4, linkage="ward").fit(Z)\n# R\nkmeans(Z, 4, nstart = 25); hclust(dist(Z), "ward.D2")`,
  build() {
    const form = Form('kmeans', [{ k: 'data', t: 'data', label: 'Datos numéricos', sample: SAMPLES.blobs, rows: 6 }, { k: 'x', t: 'cols', from: 'data', label: 'Variables' }, { k: 'sc', t: 'check', label: 'Estandarizar', val: true }, { k: 'k', t: 'num', label: 'Número de clusters k', val: 4, min: 2, max: 10 }, { k: 'kmax', t: 'num', label: 'k máximo para el codo y la silueta', val: 8, min: 3, max: 12 }, { k: 'link', t: 'sel', label: 'Enlace jerárquico', opts: [['ward', 'Ward'], ['average', 'Promedio'], ['complete', 'Completo'], ['single', 'Simple']] }, { k: 'seed', t: 'num', label: 'Semilla', val: 3 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), { X: X0, names } = numMatrix(tb, v.x), X = v.sc ? zs(X0) : X0, n = X.length, k = Math.round(v.k), kmax = Math.min(Math.round(v.kmax), n - 1), rnd = L.rng(Math.round(v.seed));
        const best = kk => { let b = null; for (let r = 0; r < 8; r++) { const m = L.kmeans(X, kk, rnd); if (!b || m.inertia < b.inertia) b = m; } return b; };
        const ks = [], inert = [], sil = [], ch = []; for (let kk = 2; kk <= kmax; kk++) { const m = best(kk); ks.push(kk); inert.push(m.inertia); sil.push(L.silhouette(X, m.lab, kk).mean); ch.push(L.calinski(X, m.lab, kk, m.C)); }
        const km = best(k), sl = L.silhouette(X, km.lab, k), sizes = Array.from({ length: k }, (_, j) => km.lab.filter(l => l === j).length), kOpt = ks[sil.indexOf(Math.max(...sil))];
        let html = kpis([['Inercia (k = ' + k + ')', km.inertia], ['Silueta media', sl.mean], ['Calinski–Harabasz', L.calinski(X, km.lab, k, km.C)], ['k óptimo por silueta', kOpt]]);
        html += `<div class="grid2">${fig(lineSVG([{ name: 'Inercia', x: ks, y: inert, dots: true }], { title: 'Criterio del codo', xlab: 'k', ylab: 'Inercia', xticks: ks, h: 280 }))}${fig(lineSVG([{ name: 'Silueta', x: ks, y: sil, c: 3, dots: true }], { title: 'Silueta media según k', xlab: 'k', ylab: 'Silueta', xticks: ks, h: 280 }))}</div>`;
        const px = X.map(r => r[0]), py = X.map(r => r[1] ?? 0); html += fig(plot({ title: `K-medias (k = ${k}) en las dos primeras variables${v.sc ? ' estandarizadas' : ''}`, xlab: names[0], ylab: names[1] || '', xlim: ext(px), ylim: ext(py) }, a => dots(px.map((x, i) => ({ x, y: py[i], c: (km.lab[i] % 6) + 1 })), a.sx, a.sy) + km.C.map((c, j) => `<path class="f${(j % 6) + 1}" stroke="var(--fg)" stroke-width="2" d="M${a.sx(c[0]) - 7},${a.sy(c[1] ?? 0)}l7,-9l7,9l-7,9z"/>`).join('')), 'Rombos: centroides.');

        html += interp(`<p>K-medias con k = ${k} logra una silueta media de <b>${F(sl.mean, 3)}</b> (${sl.mean > .7 ? 'estructura fuerte' : sl.mean > .5 ? 'estructura razonable' : sl.mean > .25 ? 'estructura débil' : 'sin estructura clara'}). El máximo de silueta ocurre en k = ${kOpt}. El agrupamiento jerárquico coincide con K-medias en el ${F(agree * 100, 0)} % de los pares de observaciones.${kOpt !== k ? ` Considere probar k = ${kOpt}.` : ''}</p>`);

/* ---------- informe ---------- */
const para = t => (t || '').split(/\n{2,}|\n/).map(s => s.trim()).filter(Boolean).map(s => `<p>${esc(s)}</p>`).join('');
function reportHTML() {

  if (S.length) h_ += `<nav class="toc"><h2>Contenido</h2><ol>${M.resumen ? '<li>Resumen ejecutivo</li>' : ''}${M.supuestos ? '<li>Alcance y supuestos</li>' : ''}${S.map(s => `<li>${esc(s.title)}</li>`).join('')}${M.concl ? '<li>Conclusiones y recomendaciones</li>' : ''}${used.length ? '<li>Anexo: metodología</li>' : ''}</ol></nav>`;
  if (M.resumen) h_ += `<section class="rs"><h2>Resumen ejecutivo</h2>${para(M.resumen)}</section>`;
  if (M.supuestos) h_ += `<section class="rs"><h2>Alcance y supuestos</h2>${para(M.supuestos)}</section>`;
  S.forEach((s, i) => { h_ += `<section class="rs"><h2><span class="n">${i + 1}</span>${esc(s.title)}</h2>${s.params ? `<p class="prm">${esc(s.params)}</p>` : ''}<div class="res">${s.html}</div>${s.note ? `<div class="analyst"><strong>Comentario del analista</strong>${para(s.note)}</div>` : ''}</section>`; });
  if (M.concl) h_ += `<section class="rs"><h2>Conclusiones y recomendaciones</h2>${para(M.concl)}</section>`;
  if (used.length) h_ += `<section class="rs annex"><h2>Anexo: metodología</h2>${used.map(m => `<h3>${esc(m.title)}</h3><div class="revb">${m.review}</div>`).join('')}</section>`;
  return h_ + `<footer class="rfoot">Generado con el Laboratorio de Data Science · ${fecha || ''}. Los resultados son producto de cálculos automáticos sobre los datos entregados; contrástelos antes de usarlos en decisiones críticas.</footer></article>`;
}
function exportDoc() {
  const css = $('#repcss').textContent + `:root{${LIGHT_TOKENS}}body{background:#e9edf3;margin:0;padding:24px 12px;font-family:system-ui,sans-serif}`; return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(REPORT.meta.titulo || 'Informe')}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap"><style>${css}</style></head><body>${reportHTML()}</body></html>`;
}
let LIGHT_TOKENS = '';
function renderPreview() { const box = $('#repPreview'); if (box) box.innerHTML = reportHTML(); const has = REPORT.sections.length > 0; ['#repDl', '#repCopy', '#repDraft'].forEach(s => { const b = $(s); if (b) b.disabled = !has; }); }
let pvT; const pvLater = () => { clearTimeout(pvT); pvT = setTimeout(() => { saveReport(); renderPreview(); }, 250); };
function renderReportList() {
  const box = $('#repList'); if (!box) return; box.innerHTML = '';
  if (!REPORT.sections.length) { box.append(h('div', { class: 'empty' }, 'Aún no hay análisis en el informe. Ejecute un módulo y pulse «Agregar al informe», o cargue un informe de ejemplo.')); }
  REPORT.sections.forEach((s, i) => {
    const mv = d => () => { const j = i + d; if (j < 0 || j >= REPORT.sections.length) return; [REPORT.sections[i], REPORT.sections[j]] = [REPORT.sections[j], REPORT.sections[i]]; saveReport(); renderReportList(); renderPreview(); };
    box.append(h('div', { class: 'rsec' }, h('div', { class: 'rsec-h' }, h('span', { class: 'idx' }, i + 1), h('input', { id: `rt-${s.id}`, value: s.title, 'aria-label': 'Título de la sección', oninput: e => { s.title = e.target.value; pvLater(); } }), h('button', { class: 'btn sm ghost', type: 'button', title: 'Subir', 'aria-label': 'Subir', onclick: mv(-1) }, '↑'), h('button', { class: 'btn sm ghost', type: 'button', title: 'Bajar', 'aria-label': 'Bajar', onclick: mv(1) }, '↓'), h('button', { class: 'btn sm ghost danger', type: 'button', 'aria-label': 'Quitar del informe', onclick: () => { REPORT.sections.splice(i, 1); saveReport(); updateBadge(); renderReportList(); renderPreview(); } }, 'Quitar')), h('textarea', { id: `rn-${s.id}`, rows: 2, placeholder: 'Comentario del analista (opcional)', oninput: e => { s.note = e.target.value; pvLater(); } }, s.note || '')));
  });

function buildReportPage() {

  const el = $('#informe'); el.innerHTML = '';
  const head = h('header', { class: 'mh' }, h('div', null, h('p', { class: 'eyebrow' }, 'Entregable'), h('h2', null, 'Generador de informes')), h('p', { class: 'lead' }, 'Reúna los resultados de los módulos en un documento profesional con portada, índice, resumen, conclusiones y anexo metodológico.'));

  const cp = h('button', { class: 'btn', id: 'repCopy', type: 'button', onclick: async () => { const msg = $('#repMsg'); try { await navigator.clipboard.writeText(exportDoc()); msg.textContent = 'HTML copiado al portapapeles. Péguelo en un archivo con extensión .html.'; } catch (e) { const t = h('textarea', { rows: 6, class: 'mono', 'aria-label': 'HTML del informe' }); t.value = exportDoc(); msg.textContent = 'Su navegador bloqueó el portapapeles. Seleccione y copie el texto de abajo.'; msg.after(t); t.select(); } } }, 'Copiar HTML');
  const draft = h('button', { class: 'btn', id: 'repDraft', type: 'button', onclick: () => { const bits = REPORT.sections.map(s => { const d = document.createElement('div'); d.innerHTML = s.html; const t = $('.interp', d); if (!t) return ''; const txt = t.textContent.replace(/^Interpretación/, '').trim(), first = txt.match(/^.*?[.!?](?=\s|$)(?:\s.*?[.!?](?=\s|$))?/); return `${s.title}: ${(first ? first[0] : txt).slice(0, 320)}`; }).filter(Boolean); if (!bits.length) return; REPORT.meta.resumen = bits.join('\n'); $('#rm-resumen').value = REPORT.meta.resumen; saveReport(); renderPreview(); } }, 'Redactar resumen desde las interpretaciones');
  const sample = h('button', { class: 'btn ghost', id: 'repSample', type: 'button', onclick: async e => { e.target.disabled = true; e.target.textContent = 'Preparando…'; for (const id of ['desc', 'slr', 'mlr', 'arima', 'logit']) { const pg = ensureMounted(id); await pg.ready; const out = $(`#${id}-out`), m = modById(id); if (out && !$('.err', out) && out.querySelector('.interp')) REPORT.sections.push({ id: Date.now() + id, mod: id, title: m.title, html: snapshot(out), note: '', ts: new Date().toISOString() }); } if (!M.resumen) draft.click(); saveReport(); updateBadge(); renderReportList(); renderPreview(); e.target.textContent = 'Informe de ejemplo cargado'; } }, 'Cargar informe de ejemplo');
  const clear = h('button', { class: 'btn ghost danger', type: 'button', id: 'repClear', onclick: e => { if (!e.target.dataset.sure) { e.target.dataset.sure = 1; e.target.textContent = 'Confirmar: vaciar informe'; setTimeout(() => { delete e.target.dataset.sure; e.target.textContent = 'Vaciar informe'; }, 3500); return; } REPORT.sections = []; saveReport(); updateBadge(); renderReportList(); renderPreview(); delete e.target.dataset.sure; e.target.textContent = 'Vaciar informe'; } }, 'Vaciar informe');
  const bar = h('div', { class: 'actions' }, dl, cp, draft, sample, clear), msg = h('p', { class: 'small', id: 'repMsg', role: 'status' });

function buildNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  nav.append(h('a', { href: '#inicio', 'data-id': 'inicio', class: 'ni' }, 'Inicio'));
  GROUPS.forEach(g => { const ms = MODS.filter(m => m.group === g); if (!ms.length) return; nav.append(h('div', { class: 'ng' }, g), ...ms.map(m => h('a', { href: `#${m.id}`, 'data-id': m.id, class: 'ni' }, h('span', null, m.title.replace(/^(Regresión lineal múltiple y predicción)$/, 'Regresión lineal múltiple')), h('small', null, m.ref)))); });
  nav.append(h('div', { class: 'ng' }, 'Entregable'), h('a', { href: '#informe', 'data-id': 'informe', class: 'ni' }, h('span', null, 'Informe ', h('b', { id: 'repCount', class: 'badge', hidden: true }, '0'))));
}
function initTheme() {
  const root = document.documentElement, k = 'lab-tema'; let saved = null; try { saved = localStorage.getItem(k); } catch (e) { } if (saved) root.setAttribute('data-theme', saved);
  const btn = $('#themeBtn'), eff = () => root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const sync = () => { btn.textContent = eff() === 'dark' ? 'Tema claro' : 'Tema oscuro'; };
  btn.onclick = () => { const n = eff() === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', n); try { localStorage.setItem(k, n); } catch (e) { } sync(); }; sync();
}
function start() {
  loadReport(); initTheme();
  const probe = h('div', { class: 'rpt', style: 'position:absolute;visibility:hidden' }); document.body.append(probe); const cs = getComputedStyle(probe); LIGHT_TOKENS = ['--bg', '--panel', '--fg', '--mut', '--line', '--ac', '--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--good', '--bad', '--warn', '--soft', '--mono', '--sans', '--disp'].map(k => `${k}:${cs.getPropertyValue(k).trim()}`).join(';'); probe.remove();
