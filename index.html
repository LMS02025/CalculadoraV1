<\/b>. Los precios son valores de ejemplo: confírmelos para su región antes de presupuestar.<\/p>":"<p>The task of {0} replicates consumes {1} CPU hours. With {2} vCPUs and a sequential fraction of {3}% it finishes in <b>{4} min<\/b> (speedup {5}×). The estimated total cost is <b>USD {6}<\/b>. The prices are example values: confirm them for your region before budgeting.<\/p>","Series temporales: Box, SARIMA y pronóstico":"Time series: Box, SARIMA and forecasting","Identificación con ACF/PACF, test de Box–Ljung, ajuste SARIMA, diagnóstico de residuos y pronóstico con intervalos.":"Identification with ACF/PACF, Box–Ljung test, SARIMA fitting, residual diagnostics and forecasting with intervals.","<p>Un modelo SARIMA(p,d,q)(P,D,Q)ₛ aplica diferencias regulares (d) y estacionales (D, período s) y modela lo que queda con términos autorregresivos y de media móvil:<\/p>\n  <p class=\"eq\">φ(B)Φ(Bˢ)(1−B)ᵈ(1−Bˢ)ᴰ yₜ = c + θ(B)Θ(Bˢ) εₜ<\/p>\n  <ul><li><b>Identificación:<\/b> la ACF decae lentamente si hay tendencia (diferenciar); picos en múltiplos de s indican estacionalidad. PACF que se corta en p sugiere AR(p); ACF que se corta en q sugiere MA(q).<\/li><li><b>Test de Box–Pierce / Ljung–Box:<\/b> Q = n(n+2)Σ ρ̂ₖ²/(n−k) ~ χ²(h − parámetros). Rechazar H₀ implica autocorrelación (la serie no es ruido blanco).<\/li><li><b>Estimación:<\/b> mínimos cuadrados condicionales (suma de cuadrados de las innovaciones), optimizados numéricamente.<\/li><li><b>Selección:<\/b> menor AIC/BIC; el diagnóstico exige residuos sin autocorrelación.<\/li><li><b>Pronóstico:<\/b> recursión del modelo con intervalos ŷ ± z·σ̂√(Σψⱼ²).<\/li><\/ul>":"<p>A SARIMA(p,d,q)(P,D,Q)ₛ model applies regular (d) and seasonal (D, period s) differencing and models what remains with autoregressive and moving-average terms:<\/p>\n  <p class=\"eq\">φ(B)Φ(Bˢ)(1−B)ᵈ(1−Bˢ)ᴰ yₜ = c + θ(B)Θ(Bˢ) εₜ<\/p>\n  <ul><li><b>Identification:<\/b> the ACF decays slowly if there is a trend (difference); spikes at multiples of s indicate seasonality. A PACF that cuts off at p suggests AR(p); an ACF that cuts off at q suggests MA(q).<\/li><li><b>Box–Pierce / Ljung–Box test:<\/b> Q = n(n+2)Σ ρ̂ₖ²/(n−k) ~ χ²(h − parameters). Rejecting H₀ implies autocorrelation (the series is not white noise).<\/li><li><b>Estimation:<\/b> conditional least squares (sum of squared innovations), optimized numerically.<\/li><li><b>Selection:<\/b> lowest AIC/BIC; the diagnostics require residuals without autocorrelation.<\/li><li><b>Forecasting:<\/b> model recursion with intervals ŷ ± z·σ̂√(Σψⱼ²).<\/li><\/ul>","Serie (una columna, ordenada en el tiempo)":"Series (one column, ordered in time)","Columna":"Column","Período estacional s (1 = sin estacionalidad)":"Seasonal period s (1 = no seasonality)","p (AR)":"p (AR)","q (MA)":"q (MA)","P (AR estacional)":"P (seasonal AR)","Q (MA estacional)":"Q (seasonal MA)","Horizonte de pronóstico":"Forecast horizon","Rezagos de ACF/PACF y Box–Ljung":"ACF/PACF and Box–Ljung lags","Buscar el mejor modelo por AIC (p,q ≤ 2; P,Q ≤ 1)":"Find the best model by AIC (p,q ≤ 2; P,Q ≤ 1)","Búsqueda por AIC (5 mejores)":"AIC search (top 5)","Modelo":"Model","Serie original (n = {0})":"Original series (n = {0})","Tiempo":"Time","ACF de la serie original":"ACF of the original series","ACF tras d = {0}, D = {1}":"ACF after d = {0}, D = {1}","PACF de la serie original":"PACF of the original series","PACF de la serie diferenciada":"PACF of the differenced series","Test de Box sobre la serie original":"Box test on the original series","Estadístico Q":"Q statistic","Conclusión":"Conclusion","Hay autocorrelación":"There is autocorrelation","Ruido blanco":"White noise","Modelo ajustado: SARIMA({0},{1},{2})({3},{4},{5}){6}":"Fitted model: SARIMA({0},{1},{2})({3},{4},{5}){6}","σ² de innovaciones":"Innovation σ²","Ljung–Box residuos":"Ljung–Box residuals","sin autocorrelación":"no autocorrelation","dependencia remanente":"remaining dependence","<p>Modelo sin parámetros (solo diferenciación).<\/p>":"<p>Model without parameters (differencing only).<\/p>","ACF de los residuos":"ACF of the residuals","Pronóstico a {0} períodos con banda del 95 %":"Forecast for {0} periods with a 95% band","Valores pronosticados":"Forecast values","Período":"Period","Límite inferior 95 %":"Lower limit 95%","Límite superior 95 %":"Upper limit 95%","presenta autocorrelación significativa":"shows significant autocorrelation","es compatible con ruido blanco":"is consistent with white noise","Los residuos no muestran autocorrelación: el modelo captura la dependencia temporal y es adecuado para pronosticar.":"The residuals show no autocorrelation: the model captures the temporal dependence and is adequate for forecasting.","<b class=\"warn\">Los residuos aún muestran autocorrelación<\/b>: pruebe con otros órdenes (p, q) o más diferenciación.":"<b class=\"warn\">The residuals still show autocorrelation<\/b>: try other orders (p, q) or more differencing.","<p>La serie {0} (Ljung–Box p = {1}). El modelo SARIMA({2},{3},{4})({5},{6},{7}){8} logra AIC = {9}. {10} El pronóstico a {11} períodos termina en {12} (intervalo {13} a {14}); la banda se ensancha con el horizonte, reflejando mayor incertidumbre.<\/p>":"<p>The series {0} (Ljung–Box p = {1}). The SARIMA({2},{3},{4})({5},{6},{7}){8} model achieves AIC = {9}. {10} The forecast for {11} periods ends at {12} (interval {13} to {14}); the band widens with the horizon, reflecting greater uncertainty.<\/p>","Raíz unitaria y regresión falsa":"Unit root and spurious regression","Test de Dickey–Fuller aumentado y simulación del problema de regresión espuria entre series no estacionarias.":"Augmented Dickey–Fuller test and simulation of the spurious regression problem between nonstationary series.","<p>Una serie con <b>raíz unitaria<\/b> (paseo aleatorio) no es estacionaria: sus shocks son permanentes. El test <b>Dickey–Fuller aumentado<\/b> estima Δyₜ = α + βt + γ·yₜ₋₁ + Σδⱼ·Δyₜ₋ⱼ + εₜ y contrasta H₀: γ = 0 (hay raíz unitaria). El estadístico τ no sigue una t de Student: se compara con valores críticos de Dickey–Fuller (p. ej. −2,86 al 5 % con constante). Si τ es <i>menor<\/i> que el crítico, se rechaza la raíz unitaria.<\/p>\n  <p><b>Regresión falsa (espuria):<\/b> al regresar dos paseos aleatorios independientes, MCO suele arrojar R² alto, t muy significativos y Durbin–Watson cercano a 0. Es un artefacto de la no estacionariedad, no una relación real. Regla práctica de Granger–Newbold: R² &gt; DW sugiere regresión espuria. Se evita diferenciando las series o verificando cointegración.<\/p>":"<p>A series with a <b>unit root<\/b> (random walk) is not stationary: its shocks are permanent. The <b>augmented Dickey–Fuller<\/b> test estimates Δyₜ = α + βt + γ·yₜ₋₁ + Σδⱼ·Δyₜ₋ⱼ + εₜ and tests H₀: γ = 0 (there is a unit root). The τ statistic does not follow a Student t: it is compared with Dickey–Fuller critical values (e.g. −2.86 at 5% with a constant). If τ is <i>lower<\/i> than the critical value, the unit root is rejected.<\/p>\n  <p><b>Spurious regression:<\/b> when regressing two independent random walks, OLS usually yields a high R², very significant t values and a Durbin–Watson close to 0. It is an artifact of nonstationarity, not a real relationship. Granger–Newbold rule of thumb: R² &gt; DW suggests spurious regression. It is avoided by differencing the series or checking for cointegration.<\/p>","Serie (una columna)":"Series (one column)","Componente determinista":"Deterministic component","Constante":"Constant","Constante y tendencia":"Constant and trend","Ninguno":"None","Rezagos de Δy":"Lags of Δy","Simulación: longitud T":"Simulation: length T","Simulación: réplicas":"Simulation: replicates","<b class=\"good\">Estacionaria (se rechaza raíz unitaria)<\/b>":"<b class=\"good\">Stationary (unit root rejected)<\/b>","<b class=\"bad\">Raíz unitaria (no se rechaza)<\/b>":"<b class=\"bad\">Unit root (not rejected)<\/b>","Test de Dickey–Fuller aumentado":"Augmented Dickey–Fuller test","Serie":"Series","Estadístico τ":"τ statistic","Crítico 1 %":"Critical 1%","Crítico 5 %":"Critical 5%","Crítico 10 %":"Critical 10%","Conclusión al 5 %":"Conclusion at 5%","Δ{0} (primera diferencia)":"Δ{0} (first difference)","Simulación de regresión falsa ({0} pares de paseos aleatorios independientes, T = {1})":"Spurious regression simulation ({0} pairs of independent random walks, T = {1})","% con pendiente \"significativa\" al 5 %":"% with “significant” slope at 5%","esperado: 5 %":"expected: 5%","R² medio":"Mean R²","Durbin–Watson medio":"Mean Durbin–Watson","% significativas tras diferenciar":"% significant after differencing","Distribución de R² (series independientes)":"Distribution of R² (independent series)","Serie X":"Series X","Serie Y":"Series Y","Ejemplo: R² = {0}, DW = {1}":"Example: R² = {0}, DW = {1}","una tendencia determinista":"a deterministic trend","una constante":"a constant","Para <b>{0}<\/b> se rechaza la raíz unitaria al 5 % (τ = {1} &lt; {2}): la serie puede tratarse como estacionaria (en torno a {3}).":"For <b>{0}<\/b> the unit root is rejected at 5% (τ = {1} &lt; {2}): the series can be treated as stationary (around {3})."," y su primera diferencia sí lo es, es decir, es integrada de orden 1; corresponde d = 1 en ARIMA":" and its first difference is, that is, it is integrated of order 1; d = 1 corresponds in ARIMA","Para <b>{0}<\/b> <b>no<\/b> se rechaza la raíz unitaria (τ = {1} ≥ {2}): la serie no es estacionaria{3}.":"For <b>{0}<\/b> the unit root is <b>not<\/b> rejected (τ = {1} ≥ {2}): the series is not stationary{3}.","<p>{0} La simulación muestra que dos series independientes con raíz unitaria parecen relacionadas en el {1} % de los casos (frente al 5 % nominal) y con R² medio de {2} y DW de {3}: diferenciar elimina el problema ({4} %).<\/p>":"<p>{0} The simulation shows that two independent series with a unit root appear related in {1}% of cases (versus the nominal 5%) and with a mean R² of {2} and DW of {3}: differencing eliminates the problem ({4}%).<\/p>","Carácter no reconocido cerca de: ":"Unrecognized character near: ","Se esperaba {0}":"Expected {0}"," y se encontró \"{0}\"":" and found \"{0}\"","Se esperaba ( después de IN":"Expected ( after IN","Falta )":"Missing )","Expresión incompleta":"Incomplete expression","Falta ) en ":"Missing ) in ","Token inesperado: ":"Unexpected token: ","Sintaxis no reconocida cerca de \"":"Unrecognized syntax near \"","La tabla \"{0}\" no existe (disponibles: {1}).":"The table \"{0}\" does not exist (available: {1}).","Columna desconocida: {0}":"Unknown column: {0}","Función de agregación fuera de un grupo.":"Aggregate function outside a group.","SQL: consultas, modelo relacional y depuración":"SQL: queries, relational model and debugging","Ejecute consultas SELECT con JOIN, GROUP BY y funciones de agregación sobre tablas editables y revise la calidad de los datos.":"Run SELECT queries with JOIN, GROUP BY and aggregate functions on editable tables and review data quality.","<p>SQL (<i>Structured Query Language<\/i>) consulta bases de datos <b>relacionales<\/b>: tablas con filas y columnas, vinculadas por <b>claves primarias<\/b> (identifican cada fila) y <b>claves foráneas<\/b> (referencian a otra tabla). Las tablas ventas y clientes del ejemplo se relacionan por <code>ventas.cliente_id = clientes.id<\/code>.<\/p>\n  <ul><li><b>Orden lógico de ejecución:<\/b> FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.<\/li><li><b>Agregaciones:<\/b> COUNT, SUM, AVG, MIN, MAX. <b>WHERE<\/b> filtra filas; <b>HAVING<\/b> filtra grupos.<\/li><li><b>JOIN:<\/b> INNER conserva solo coincidencias; LEFT conserva todas las filas de la izquierda (con NULL si no hay pareja).<\/li><li><b>Depuración:<\/b> detectar nulos, duplicados y valores fuera de rango antes de analizar. Los NULL no participan en SUM/AVG y requieren <code>IS NULL<\/code> para filtrarse.<\/li><\/ul>\n  <p>El motor incluido soporta SELECT, DISTINCT, JOIN/LEFT JOIN, WHERE (AND, OR, NOT, IN, LIKE, BETWEEN, IS NULL), GROUP BY, HAVING, ORDER BY y LIMIT. Es una simulación didáctica; la sintaxis es compatible con SQL Server en estos casos.<\/p>":"<p>SQL (<i>Structured Query Language<\/i>) queries <b>relational<\/b> databases: tables with rows and columns, linked by <b>primary keys<\/b> (identify each row) and <b>foreign keys<\/b> (reference another table). The sample tables ventas and clientes are related by <code>ventas.cliente_id = clientes.id<\/code>.<\/p>\n  <ul><li><b>Logical order of execution:<\/b> FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.<\/li><li><b>Aggregations:<\/b> COUNT, SUM, AVG, MIN, MAX. <b>WHERE<\/b> filters rows; <b>HAVING<\/b> filters groups.<\/li><li><b>JOIN:<\/b> INNER keeps only matches; LEFT keeps all rows from the left (with NULL if there is no match).<\/li><li><b>Debugging:<\/b> detect nulls, duplicates and out-of-range values before analyzing. NULLs do not participate in SUM/AVG and require <code>IS NULL<\/code> to be filtered.<\/li><\/ul>\n  <p>The included engine supports SELECT, DISTINCT, JOIN/LEFT JOIN, WHERE (AND, OR, NOT, IN, LIKE, BETWEEN, IS NULL), GROUP BY, HAVING, ORDER BY and LIMIT. It is a teaching simulation; the syntax is compatible with SQL Server in these cases.<\/p>","Consulta SQL":"SQL query","Tablas disponibles: clientes, ventas (editables abajo).":"Available tables: clientes, ventas (editable below).","Tabla clientes":"clientes table","Tabla ventas":"ventas table","Total por producto":"Total by product","Clientes sin ventas":"Customers without sales","Ventas grandes":"Large sales","Filas devueltas":"Rows returned","Filas procesadas":"Rows processed","Resultado":"Result","Calidad de datos":"Data quality","Tabla":"Table","Filas":"Rows","Duplicados exactos":"Exact duplicates","<p>La consulta devolvió {0} fila(s) a partir de {1} filas procesadas. En la depuración de <b>ventas<\/b> se observan {2} registro(s) sin estado y {3} fila(s) duplicada(s) exactas; estas últimas inflarían los totales y deben eliminarse con <code>SELECT DISTINCT<\/code> o <code>ROW_NUMBER() OVER (PARTITION BY …)<\/code> antes de reportar.<\/p>":"<p>The query returned {0} row(s) from {1} rows processed. In the cleaning of <b>ventas<\/b>, {2} record(s) without status and {3} exact duplicate row(s) are observed; the latter would inflate the totals and must be removed with <code>SELECT DISTINCT<\/code> or <code>ROW_NUMBER() OVER (PARTITION BY …)<\/code> before reporting.<\/p>","Spark: DataFrame, descripción y categorización":"Spark: DataFrame, description and categorization","Operaciones típicas sobre un DataFrame (describe, groupBy, categorización) con el código PySpark equivalente.":"Typical operations on a DataFrame (describe, groupBy, categorization) with the equivalent PySpark code.","<p><b>Apache Spark<\/b> procesa datos distribuidos en memoria. Su abstracción central, el <b>DataFrame<\/b>, es una tabla inmutable particionada entre nodos con <i>evaluación perezosa<\/i>: las transformaciones (<code>filter<\/code>, <code>groupBy<\/code>, <code>withColumn<\/code>) solo construyen un plan; las <i>acciones<\/i> (<code>show<\/code>, <code>count<\/code>, <code>collect<\/code>) lo ejecutan.<\/p>\n  <ul><li><b>Análisis descriptivo:<\/b> <code>df.describe()<\/code> entrega conteo, media, desviación, mínimo y máximo; <code>summary()<\/code> añade cuartiles.<\/li><li><b>Categorización de variables:<\/b> <code>Bucketizer<\/code> (cortes fijos) o <code>QuantileDiscretizer<\/code> (cuantiles) convierten una variable continua en categorías.<\/li><li><b>Agregación:<\/b> <code>groupBy(col).agg(...)<\/code>.<\/li><\/ul>\n  <p>Esta herramienta calcula localmente los mismos resultados y genera el código PySpark para ejecutarlo a escala.<\/p>":"<p><b>Apache Spark<\/b> processes distributed data in memory. Its central abstraction, the <b>DataFrame<\/b>, is an immutable table partitioned across nodes with <i>lazy evaluation<\/i>: transformations (<code>filter<\/code>, <code>groupBy<\/code>, <code>withColumn<\/code>) only build a plan; <i>actions<\/i> (<code>show<\/code>, <code>count<\/code>, <code>collect<\/code>) execute it.<\/p>\n  <ul><li><b>Descriptive analysis:<\/b> <code>df.describe()<\/code> returns count, mean, deviation, minimum and maximum; <code>summary()<\/code> adds quartiles.<\/li><li><b>Variable categorization:<\/b> <code>Bucketizer<\/code> (fixed cuts) or <code>QuantileDiscretizer<\/code> (quantiles) turn a continuous variable into categories.<\/li><li><b>Aggregation:<\/b> <code>groupBy(col).agg(...)<\/code>.<\/li><\/ul>\n  <p>This tool computes the same results locally and generates the PySpark code to run them at scale.<\/p>","Columna de agrupación":"Grouping column","Variable numérica":"Numeric variable","Categorización":"Categorization","Por cuantiles (QuantileDiscretizer)":"By quantiles (QuantileDiscretizer)","Ancho igual (Bucketizer)":"Equal width (Bucketizer)","N.º de categorías":"No. of categories","Categorización de ":"Categorization of ","Desde (>)":"From (>)","Hasta (≤)":"To (≤)","Distribución por categoría":"Distribution by category","qd = QuantileDiscretizer(numBuckets={0}, inputCol=\"{1}\", outputCol=\"categoria\")\ndf = qd.fit(df).transform(df)":"qd = QuantileDiscretizer(numBuckets={0}, inputCol=\"{1}\", outputCol=\"category\")\ndf = qd.fit(df).transform(df)","splits = [float(\"-inf\"), {0}, float(\"inf\")]\ndf = Bucketizer(splits=splits, inputCol=\"{1}\", outputCol=\"categoria\").transform(df)":"splits = [float(\"-inf\"), {0}, float(\"inf\")]\ndf = Bucketizer(splits=splits, inputCol=\"{1}\", outputCol=\"category\").transform(df)","Código PySpark equivalente":"Equivalent PySpark code","ancho igual":"equal width","quedan balanceadas":"are balanced","pueden quedar desbalanceadas si la distribución es asimétrica":"may be unbalanced if the distribution is skewed","<p>Se procesaron {0} filas y {1} variables numéricas. {2} promedia {3}. Las {4} categorías por {5} {6} (mínimo {7} y máximo {8} filas por categoría).<\/p>":"<p>{0} rows and {1} numeric variables were processed. {2} averages {3}. The {4} categories by {5} {6} (minimum {7} and maximum {8} rows per category).<\/p>","La variable respuesta debe tener exactamente 2 categorías (tiene {0}).":"The response variable must have exactly 2 categories (it has {0}).","Pred. {0}":"Pred. {0}","Real {0}":"Actual {0}","1 − especificidad":"1 − specificity","Sensibilidad":"Sensitivity","Datos (la respuesta binaria en una columna)":"Data (the binary response in one column)","Variable respuesta (2 categorías)":"Response variable (2 categories)","Variables predictoras":"Predictor variables","K-medias y clustering jerárquico":"K-means and hierarchical clustering","Segmenta observaciones sin etiquetas con K-medias (k-means++) y con aglomeración jerárquica; valida con silueta y el criterio del codo.":"Segments unlabeled observations with K-means (k-means++) and hierarchical agglomeration; validates with silhouette and the elbow criterion.","<p>El <i>clustering<\/i> agrupa observaciones similares sin etiquetas previas. La similaridad se mide con una distancia, normalmente euclídea d(x,y) = √Σ(xⱼ−yⱼ)²; <b>estandarice<\/b> las variables si tienen escalas distintas.<\/p>\n  <ul><li><b>K-medias:<\/b> minimiza la inercia W = Σ‖xᵢ − μ_{c(i)}‖². Alterna asignar cada punto al centroide más cercano y recalcular centroides. La inicialización <i>k-means++<\/i> reparte bien los centros iniciales.<\/li><li><b>Jerárquico aglomerativo:<\/b> parte de n clusters y fusiona los dos más cercanos. Enlaces: <i>Ward<\/i> (minimiza el aumento de varianza), <i>promedio<\/i>, <i>completo<\/i> (distancia máxima) y <i>simple<\/i> (mínima). El <b>dendrograma<\/b> muestra las fusiones; cortarlo a una altura da k grupos.<\/li><li><b>Validación:<\/b> <b>silueta<\/b> s(i) = (b−a)/max(a,b) en [−1,1] (cercana a 1: bien agrupado); <b>Calinski–Harabasz<\/b> (mayor es mejor); <b>codo<\/b> en la inercia.<\/li><\/ul>":"<p><i>Clustering<\/i> groups similar observations without prior labels. Similarity is measured with a distance, usually Euclidean d(x,y) = √Σ(xⱼ−yⱼ)²; <b>standardize<\/b> the variables if they have different scales.<\/p>\n  <ul><li><b>K-means:<\/b> minimizes the inertia W = Σ‖xᵢ − μ_{c(i)}‖². It alternates assigning each point to the nearest centroid and recomputing centroids. The <i>k-means++<\/i> initialization spreads the initial centers well.<\/li><li><b>Agglomerative hierarchical:<\/b> starts from n clusters and merges the two closest. Linkages: <i>Ward<\/i> (minimizes the increase in variance), <i>average<\/i>, <i>complete<\/i> (maximum distance) and <i>single<\/i> (minimum). The <b>dendrogram<\/b> shows the merges; cutting it at a height gives k groups.<\/li><li><b>Validation:<\/b> <b>silhouette<\/b> s(i) = (b−a)/max(a,b) in [−1,1] (close to 1: well clustered); <b>Calinski–Harabasz<\/b> (higher is better); <b>elbow<\/b> in the inertia.<\/li><\/ul>","Estandarizar":"Standardize","Número de clusters k":"Number of clusters k","k máximo para el codo y la silueta":"Maximum k for the elbow and silhouette","Enlace jerárquico":"Hierarchical linkage","Promedio":"Average","Completo":"Complete","Simple":"Single","Inercia (k = ":"Inertia (k = ","Silueta media":"Mean silhouette","k óptimo por silueta":"Optimal k by silhouette","Inercia":"Inertia","Criterio del codo":"Elbow criterion","Silueta":"Silhouette","Silueta media según k":"Mean silhouette by k","K-medias (k = {0}) en las dos primeras variables{1}":"K-means (k = {0}) on the first two variables{1}","Rombos: centroides.":"Diamonds: centroids.","Perfil de los clusters (media en la escala original)":"Cluster profile (mean on the original scale)","Cluster {0}":"Cluster {0}","Clustering jerárquico ({0})":"Hierarchical clustering ({0})","Línea vertical: corte que produce k grupos.":"Vertical line: cut that produces k groups.","Tamaño (jerárquico)":"Size (hierarchical)","estructura fuerte":"strong structure","estructura razonable":"reasonable structure","estructura débil":"weak structure","sin estructura clara":"no clear structure"," Considere probar k = {0}.":" Consider trying k = {0}.","<p>K-medias con k = {0} logra una silueta media de <b>{1}<\/b> ({2}). El máximo de silueta ocurre en k = {3}. El agrupamiento jerárquico coincide con K-medias en el {4} % de los pares de observaciones.{5}<\/p>":"<p>K-means with k = {0} achieves a mean silhouette of <b>{1}<\/b> ({2}). The maximum silhouette occurs at k = {3}. Hierarchical clustering agrees with K-means on {4}% of observation pairs.{5}<\/p>","Random Forest y XGBoost":"Random Forest and XGBoost","Compara bosques aleatorios (bagging) con gradient boosting al estilo XGBoost: entrenamiento, error out-of-bag y desempeño.":"Compares random forests (bagging) with XGBoost-style gradient boosting: training, out-of-bag error and performance.","<p>Ambos métodos combinan muchos árboles de decisión débiles, pero de forma opuesta:<\/p>\n  <ul><li><b>Random Forest (bagging):<\/b> cada árbol se entrena con una muestra bootstrap y en cada nodo considera solo <i>mtry<\/i> variables al azar. Se promedian los árboles, lo que reduce la <b>varianza<\/b>. Los datos que no entran en la muestra de un árbol (≈36,8 %) son su conjunto <b>out-of-bag<\/b> (OOB): el error OOB estima el error de generalización sin conjunto de prueba.<\/li><li><b>XGBoost (boosting):<\/b> los árboles se agregan secuencialmente, cada uno corrigiendo el error del conjunto previo, lo que reduce el <b>sesgo<\/b>. Minimiza una pérdida regularizada con aproximación de segundo orden; el peso óptimo de una hoja es w* = −G/(H+λ) y la ganancia de un corte es ½[G_L²/(H_L+λ) + G_R²/(H_R+λ) − G²/(H+λ)] − γ. La tasa de aprendizaje η acota la contribución de cada árbol.<\/li><li><b>Importancia de variables:<\/b> reducción total de impureza (RF) o ganancia acumulada (XGBoost).<\/li><\/ul>":"<p>Both methods combine many weak decision trees, but in opposite ways:<\/p>\n  <ul><li><b>Random Forest (bagging):<\/b> each tree is trained on a bootstrap sample and at each node considers only <i>mtry<\/i> random variables. The trees are averaged, which reduces <b>variance<\/b>. The data that do not enter a tree’s sample (≈36.8%) are its <b>out-of-bag<\/b> (OOB) set: the OOB error estimates the generalization error without a test set.<\/li><li><b>XGBoost (boosting):<\/b> trees are added sequentially, each correcting the error of the previous ensemble, which reduces <b>bias<\/b>. It minimizes a regularized loss with a second-order approximation; the optimal leaf weight is w* = −G/(H+λ) and the gain of a split is ½[G_L²/(H_L+λ) + G_R²/(H_R+λ) − G²/(H+λ)] − γ. The learning rate η bounds the contribution of each tree.<\/li><li><b>Variable importance:<\/b> total impurity reduction (RF) or accumulated gain (XGBoost).<\/li><\/ul>","RF: n.º de árboles":"RF: number of trees","Profundidad máxima":"Maximum depth","RF: mtry (variables por nodo)":"RF: mtry (variables per node)","XGBoost: rondas":"XGBoost: rounds","XGBoost: η (tasa de aprendizaje)":"XGBoost: η (learning rate)","XGBoost: λ (regularización L2)":"XGBoost: λ (L2 regularization)","XGBoost: γ (ganancia mínima)":"XGBoost: γ (minimum gain)","Fracción para prueba":"Test fraction","Entrenamiento":"Training","Error OOB (RF)":"OOB error (RF)","Exactitud RF (prueba)":"RF accuracy (test)","Exactitud XGBoost (prueba)":"XGBoost accuracy (test)","Desempeño en el conjunto de prueba":"Performance on the test set","Métrica":"Metric","Exactitud":"Accuracy","Especificidad":"Specificity","Precisión":"Precision","<div class=\"grid2\"><div><h4>Matriz de confusión: Random Forest<\/h4>{0}<\/div><div><h4>Matriz de confusión: XGBoost<\/h4>{1}<\/div><\/div>":"<div class=\"grid2\"><div><h4>Confusion matrix: Random Forest<\/h4>{0}<\/div><div><h4>Confusion matrix: XGBoost<\/h4>{1}<\/div><\/div>","Error OOB":"OOB error","Random Forest: error OOB vs n.º de árboles":"Random Forest: OOB error vs number of trees","Árboles":"Trees","Tasa de error":"Error rate","XGBoost: pérdida logística por ronda":"XGBoost: logistic loss per round","Rondas":"Rounds","Log-pérdida":"Log-loss","ROC Random Forest":"ROC Random Forest","ROC XGBoost":"ROC XGBoost","Importancia de variables":"Variable importance","es coherente con el error de prueba":"is consistent with the test error","difiere del error de prueba (muestra de prueba pequeña)":"differs from the test error (small test sample)","; más rondas sobreajustan, por lo que conviene detención temprana o menor η":"; more rounds overfit, so early stopping or a smaller η is advisable","<p>En el conjunto de prueba, <b>{0}<\/b> obtiene el mejor AUC ({1}). El error OOB del bosque ({2} %) {3}, lo que valida su uso como estimador sin conjunto aparte. La pérdida de prueba de XGBoost es mínima cerca de la ronda {4}{5}. Las variables más importantes son {6}, mientras que {7} aporta poco.<\/p>":"<p>On the test set, <b>{0}<\/b> obtains the best AUC ({1}). The forest’s OOB error ({2}%) {3}, which validates its use as an estimator without a separate set. The XGBoost test loss is minimal near round {4}{5}. The most important variables are {6}, while {7} contributes little.<\/p>","Regresión logística":"Logistic regression","Modela la probabilidad de un evento binario: coeficientes, razones de odds, curva ROC y matriz de confusión.":"Models the probability of a binary event: coefficients, odds ratios, ROC curve and confusion matrix.","<p>Para una respuesta binaria y ∈ {0,1} se modela el logaritmo de las odds: ln[p/(1−p)] = β₀ + β₁x₁ + … + β_kx_k, de modo que p = 1/(1+e^{−η}). Se estima por máxima verosimilitud mediante mínimos cuadrados iterativamente reponderados (IRLS).<\/p>\n  <ul><li><b>Interpretación:<\/b> eᵝʲ es la <b>razón de odds<\/b> (OR) por cada unidad de xⱼ; OR &gt; 1 aumenta la probabilidad del evento.<\/li><li><b>Prueba de Wald:<\/b> z = β̂/EE. <b>Razón de verosimilitud:<\/b> 2(ℓ − ℓ₀) ~ χ²(k). <b>R² de McFadden<\/b> = 1 − ℓ/ℓ₀.<\/li><li><b>Evaluación:<\/b> matriz de confusión (exactitud, sensibilidad, especificidad), <b>curva ROC<\/b> y <b>AUC<\/b> (probabilidad de que un caso positivo reciba mayor puntaje que uno negativo). El umbral 0,5 puede ajustarse según el costo de cada error.<\/li><\/ul>":"<p>For a binary response y ∈ {0,1}, the log of the odds is modeled: ln[p/(1−p)] = β₀ + β₁x₁ + … + β_kx_k, so that p = 1/(1+e^{−η}). It is estimated by maximum likelihood using iteratively reweighted least squares (IRLS).<\/p>\n  <ul><li><b>Interpretation:<\/b> eᵝʲ is the <b>odds ratio<\/b> (OR) for each unit of xⱼ; OR &gt; 1 increases the probability of the event.<\/li><li><b>Wald test:<\/b> z = β̂/SE. <b>Likelihood ratio:<\/b> 2(ℓ − ℓ₀) ~ χ²(k). <b>McFadden’s R²<\/b> = 1 − ℓ/ℓ₀.<\/li><li><b>Evaluation:<\/b> confusion matrix (accuracy, sensitivity, specificity), <b>ROC curve<\/b> and <b>AUC<\/b> (probability that a positive case receives a higher score than a negative one). The 0.5 threshold can be adjusted according to the cost of each error.<\/li><\/ul>","Umbral de clasificación":"Classification threshold","Fracción para prueba (0 = ninguna)":"Test fraction (0 = none)","Caso nuevo (valores en el orden de las variables)":"New case (values in the order of the variables)","Para estimar su probabilidad.":"To estimate its probability.","Observaciones (entrenamiento)":"Observations (training)","Log-verosimilitud":"Log-likelihood","Devianza":"Deviance","Razón de verosimilitud":"Likelihood ratio","R² de McFadden":"McFadden’s R²","Coeficientes y razones de odds":"Coefficients and odds ratios","Coef. (log-odds)":"Coef. (log-odds)","IC 95 % del OR":"95% CI of the OR","Desempeño":"Performance","Curva ROC":"ROC curve","<div class=\"grid2\"><div><h4>Matriz de confusión ({0}, umbral {1})<\/h4>{2}<\/div>{3}<\/div>":"<div class=\"grid2\"><div><h4>Confusion matrix ({0}, threshold {1})<\/h4>{2}<\/div>{3}<\/div>","Probabilidad ajustada vs predictor lineal":"Fitted probability vs linear predictor","P(evento)":"P(event)","Puntos: eventos observados (0 o 1). Curva: función logística.":"Points: observed events (0 or 1). Curve: logistic function.","<p><b>Caso nuevo<\/b> ({0}): probabilidad estimada de «{1}» = <b>{2} %<\/b> → clasificado como {3}.<\/p>":"<p><b>New case<\/b> ({0}): estimated probability of “{1}” = <b>{2}%<\/b> → classified as {3}.<\/p>","cada unidad aumenta":"each unit increases","cada unidad reduce":"each unit reduces","<b>{0}<\/b> (OR {1}: {2} las odds en {3} %)":"<b>{0}<\/b> (OR {1}: {2} the odds by {3}%)","Predictores significativos: {0}.":"Significant predictors: {0}.","Ningún predictor individual es significativo.":"No individual predictor is significant.","<p>El modelo es {0} (LR = {1}, p {2}) y discrimina con AUC {3} ({4}). {5}<\/p>":"<p>The model is {0} (LR = {1}, p {2}) and discriminates with AUC {3} ({4}). {5}<\/p>","<p class=\"warn\">El algoritmo no convergió completamente: puede haber separación casi perfecta.<\/p>":"<p class=\"warn\">The algorithm did not fully converge: there may be near-perfect separation.<\/p>","Máquinas de vectores de soporte (SVM)":"Support vector machines (SVM)","Clasificador de margen máximo con núcleos lineal, polinomial y RBF; visualiza hiperplano, margen y vectores de soporte.":"Maximum-margin classifier with linear, polynomial and RBF kernels; visualizes the hyperplane, margin and support vectors.","<p>Una SVM busca el hiperplano wᵀx + b = 0 que separa dos clases con el <b>margen máximo<\/b> 2/‖w‖. Los puntos sobre el margen o dentro de él son los <b>vectores de soporte<\/b>: solo ellos determinan la frontera.<\/p>\n  <ul><li><b>Margen duro<\/b> (datos separables): min ½‖w‖² sujeto a yᵢ(wᵀxᵢ+b) ≥ 1.<\/li><li><b>Margen blando<\/b> (no separables): min ½‖w‖² + C·Σξᵢ; el parámetro <b>C<\/b> equilibra margen ancho (C pequeño) y errores de entrenamiento (C grande).<\/li><li><b>Truco del núcleo:<\/b> reemplaza el producto interno por K(x,x′) sin calcular el mapeo explícito. <i>RBF:<\/i> exp(−γ‖x−x′‖²); <i>polinomial:<\/i> (γxᵀx′+1)ᵈ. γ grande produce fronteras muy ajustadas (riesgo de sobreajuste).<\/li><li><b>Entrenamiento:<\/b> optimización dual por SMO; la decisión es f(x) = Σαᵢyᵢ K(xᵢ,x) + b.<\/li><li><b>Validación:<\/b> exactitud, sensibilidad, especificidad y AUC en datos de prueba.<\/li><\/ul>":"<p>An SVM looks for the hyperplane wᵀx + b = 0 that separates two classes with the <b>maximum margin<\/b> 2/‖w‖. The points on or inside the margin are the <b>support vectors<\/b>: only they determine the boundary.<\/p>\n  <ul><li><b>Hard margin<\/b> (separable data): min ½‖w‖² subject to yᵢ(wᵀxᵢ+b) ≥ 1.<\/li><li><b>Soft margin<\/b> (non-separable): min ½‖w‖² + C·Σξᵢ; the parameter <b>C<\/b> balances a wide margin (small C) and training errors (large C).<\/li><li><b>Kernel trick:<\/b> replaces the inner product with K(x,x′) without computing the explicit mapping. <i>RBF:<\/i> exp(−γ‖x−x′‖²); <i>polynomial:<\/i> (γxᵀx′+1)ᵈ. A large γ produces very tight boundaries (risk of overfitting).<\/li><li><b>Training:<\/b> dual optimization by SMO; the decision is f(x) = Σαᵢyᵢ K(xᵢ,x) + b.<\/li><li><b>Validation:<\/b> accuracy, sensitivity, specificity and AUC on test data.<\/li><\/ul>","Datos: dos variables y una clase binaria (0/1)":"Data: two variables and a binary class (0/1)","Clase":"Class","Variables (se grafican las dos primeras)":"Variables (the first two are plotted)","Núcleo":"Kernel","RBF (gaussiano)":"RBF (Gaussian)","Lineal":"Linear","Polinomial":"Polynomial","γ (RBF/polinomial)":"γ (RBF/polynomial)","Grado (polinomial)":"Degree (polynomial)","Fracción de prueba":"Test fraction","Lunas":"Moons","Círculos":"Circles","Separable linealmente":"Linearly separable","Ejemplo: ":"Example: ","Exactitud (entrenamiento)":"Accuracy (training)","Exactitud (prueba)":"Accuracy (test)","AUC (prueba)":"AUC (test)","Margen 2/‖w‖ (estandarizado)":"Margin 2/‖w‖ (standardized)","Sesgo b":"Bias b","Color: región de cada clase. Puntos con borde grueso: vectores de soporte (entrenamiento).":"Color: region of each class. Points with a thick border: support vectors (training).","Curva ROC (prueba)":"ROC curve (test)","<div class=\"grid2\"><div><h4>Matriz de confusión (prueba)<\/h4>{0}<\/div>{1}<\/div>":"<div class=\"grid2\"><div><h4>Confusion matrix (test)<\/h4>{0}<\/div>{1}<\/div>","<b class=\"warn\">La brecha entre entrenamiento y prueba sugiere sobreajuste<\/b>: reduzca C o γ.":"<b class=\"warn\">The gap between training and test suggests overfitting<\/b>: reduce C or γ.","La brecha entre entrenamiento y prueba es pequeña: el modelo generaliza bien.":"The gap between training and test is small: the model generalizes well.","La frontera lineal es insuficiente para estos datos; pruebe el núcleo RBF.":"The linear boundary is insufficient for these data; try the RBF kernel.","<p>La SVM con núcleo <b>{0}<\/b> usa {1} vectores de soporte ({2} % de los datos de entrenamiento) y alcanza {3} % de exactitud en prueba. {4} {5}<\/p>":"<p>The SVM with <b>{0}<\/b> kernel uses {1} support vectors ({2}% of the training data) and reaches {3}% test accuracy. {4} {5}<\/p>","Redes neuronales: perceptrón y retropropagación":"Neural networks: perceptron and backpropagation","Entrene en el navegador una red multicapa; observe la pérdida, la frontera de decisión y la influencia de la arquitectura.":"Train a multilayer network in the browser; observe the loss, the decision boundary and the influence of the architecture.","<p>Una red neuronal compone capas de neuronas: a⁽ˡ⁾ = f(W⁽ˡ⁾a⁽ˡ⁻¹⁾ + b⁽ˡ⁾). El <b>perceptrón<\/b> es la red mínima (sin capas ocultas): una combinación lineal y un umbral, que solo resuelve problemas linealmente separables (no XOR).<\/p>\n  <ul><li><b>Funciones de activación:<\/b> ReLU max(0,z), tanh y sigmoide 1/(1+e⁻ᶻ). Sin no linealidad, varias capas equivalen a una sola.<\/li><li><b>Pérdida<\/b> (clasificación binaria): entropía cruzada −[y ln ŷ + (1−y) ln(1−ŷ)].<\/li><li><b>Retropropagación:<\/b> aplica la regla de la cadena desde la salida: δ⁽ᴸ⁾ = ŷ − y; δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾ᵀδ⁽ˡ⁺¹⁾) ⊙ f′(z⁽ˡ⁾). El gradiente es ∂ℒ/∂W⁽ˡ⁾ = δ⁽ˡ⁾a⁽ˡ⁻¹⁾ᵀ y los pesos se actualizan por descenso de gradiente con tasa η.<\/li><li><b>Número de parámetros:<\/b> Σ (n_{l−1}·n_l + n_l). Más parámetros que datos invita al sobreajuste: valide con datos de prueba.<\/li><\/ul>":"<p>A neural network composes layers of neurons: a⁽ˡ⁾ = f(W⁽ˡ⁾a⁽ˡ⁻¹⁾ + b⁽ˡ⁾). The <b>perceptron<\/b> is the minimal network (no hidden layers): a linear combination and a threshold, which only solves linearly separable problems (not XOR).<\/p>\n  <ul><li><b>Activation functions:<\/b> ReLU max(0,z), tanh and sigmoid 1/(1+e⁻ᶻ). Without nonlinearity, several layers are equivalent to a single one.<\/li><li><b>Loss<\/b> (binary classification): cross-entropy −[y ln ŷ + (1−y) ln(1−ŷ)].<\/li><li><b>Backpropagation:<\/b> applies the chain rule from the output: δ⁽ᴸ⁾ = ŷ − y; δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾ᵀδ⁽ˡ⁺¹⁾) ⊙ f′(z⁽ˡ⁾). The gradient is ∂ℒ/∂W⁽ˡ⁾ = δ⁽ˡ⁾a⁽ˡ⁻¹⁾ᵀ and the weights are updated by gradient descent with rate η.<\/li><li><b>Number of parameters:<\/b> Σ (n_{l−1}·n_l + n_l). More parameters than data invites overfitting: validate with test data.<\/li><\/ul>","Datos: dos variables y clase 0/1":"Data: two variables and a 0/1 class","Capas ocultas (neuronas separadas por coma; vacío = perceptrón)":"Hidden layers (neurons separated by commas; empty = perceptron)","Activación oculta":"Hidden activation","Sigmoide":"Sigmoid","Tasa de aprendizaje η":"Learning rate η","Épocas":"Epochs","Tamaño de lote":"Batch size","Este módulo requiere exactamente dos variables predictoras (para graficar la frontera).":"This module requires exactly two predictor variables (to plot the boundary).","Entrenando…":"Training…","Frontera de decisión de la red entrenada (puntos de entrenamiento).":"Decision boundary of the trained network (training points).","Entrenando… época {0} de {1}":"Training… epoch {0} of {1}","Pérdida (entropía cruzada) por época":"Loss (cross-entropy) per epoch","Época":"Epoch","Pérdida":"Loss","Arquitectura":"Architecture","Parámetros":"Parameters",", equivalente a una regresión logística/perceptrón":", equivalent to a logistic regression/perceptron","Sin capas ocultas solo se pueden separar clases linealmente: añada capas ocultas.":"Without hidden layers only linearly separable classes can be separated: add hidden layers.","La pérdida de entrenamiento sigue alta: aumente las épocas, la tasa de aprendizaje o el tamaño de la red.":"The training loss is still high: increase the epochs, the learning rate or the size of the network.","<b class=\"warn\">La pérdida de prueba supera claramente la de entrenamiento (sobreajuste).<\/b>":"<b class=\"warn\">The test loss clearly exceeds the training loss (overfitting).<\/b>","<p>La red {0} ({1} parámetros{2}) alcanza {3} % de exactitud en prueba tras {4} épocas. {5} {6} {7}<\/p>":"<p>The network {0} ({1} parameters{2}) reaches {3}% test accuracy after {4} epochs. {5} {6} {7}<\/p>","Minería de textos y web scraping":"Text mining and web scraping","Representa documentos con TF-IDF, mide cercanía entre textos (coseno, Jaccard, Levenshtein) y extrae datos de HTML.":"Represents documents with TF-IDF, measures closeness between texts (cosine, Jaccard, Levenshtein) and extracts data from HTML.","<p>Para analizar texto se convierte cada documento en un vector. Pasos: <b>tokenizar<\/b> (minúsculas, sin tildes ni signos), quitar <i>stopwords<\/i> y ponderar.<\/p>\n  <ul><li><b>TF-IDF:<\/b> tf(t,d)·idf(t), con idf(t) = ln[(1+N)/(1+df)] + 1. Da más peso a términos frecuentes en el documento pero poco comunes en la colección.<\/li><li><b>Similitud coseno:<\/b> cos(a,b) = a·b/(‖a‖‖b‖) ∈ [0,1].<\/li><li><b>Homologación de textos<\/b> (emparejar nombres escritos distinto): distancia de <b>Levenshtein<\/b> (ediciones mínimas), similitud de <b>Jaro–Winkler<\/b> y coeficiente de <b>Jaccard<\/b> sobre trigramas de caracteres.<\/li><li><b>Arquitectura de web scraping:<\/b> solicitud HTTP → descarga del HTML → análisis del DOM (selectores CSS/XPath) → extracción → limpieza → almacenamiento. Respete robots.txt y los términos de uso del sitio.<\/li><\/ul>":"<p>To analyze text, each document is converted into a vector. Steps: <b>tokenize<\/b> (lowercase, no accents or punctuation), remove <i>stopwords<\/i> and weight.<\/p>\n  <ul><li><b>TF-IDF:<\/b> tf(t,d)·idf(t), with idf(t) = ln[(1+N)/(1+df)] + 1. It gives more weight to terms that are frequent in the document but uncommon in the collection.<\/li><li><b>Cosine similarity:<\/b> cos(a,b) = a·b/(‖a‖‖b‖) ∈ [0,1].<\/li><li><b>Text matching<\/b> (pairing differently written names): <b>Levenshtein<\/b> distance (minimum edits), <b>Jaro–Winkler<\/b> similarity and the <b>Jaccard<\/b> coefficient over character trigrams.<\/li><li><b>Web scraping architecture:<\/b> HTTP request → HTML download → DOM parsing (CSS/XPath selectors) → extraction → cleaning → storage. Respect robots.txt and the site’s terms of use.<\/li><\/ul>","Documentos (uno por línea)":"Documents (one per line)","Eliminar stopwords":"Remove stopwords","Texto a homologar":"Text to match","Catálogo de candidatos (uno por línea)":"Candidate catalog (one per line)","HTML para extraer (scraping)":"HTML to extract (scraping)","Documentos":"Documents","Vocabulario":"Vocabulary","Tokens totales":"Total tokens","Similitud coseno entre documentos (TF-IDF)":"Cosine similarity between documents (TF-IDF)","Doc {0}":"Doc {0}","Documento":"Document","Términos más característicos (TF-IDF)":"Most characteristic terms (TF-IDF)","Pares de documentos más cercanos":"Closest document pairs","Coseno":"Cosine","Doc {0} ↔ Doc {1}":"Doc {0} ↔ Doc {1}","Homologación de «{0}»":"Matching of “{0}”","Candidato":"Candidate","Levenshtein":"Levenshtein","Similitud":"Similarity","Jaccard (trigramas)":"Jaccard (trigrams)","Extracción desde HTML (scraping)":"Extraction from HTML (scraping)","<p>Título (h1): <b>{0}<\/b><\/p>":"<p>Title (h1): <b>{0}<\/b><\/p>","Texto del enlace":"Link text","<b>Doc {0} y Doc {1}<\/b> (coseno {2}): comparten el tema aunque usen palabras distintas.":"<b>Doc {0} and Doc {1}<\/b> (cosine {2}): they share the topic even though they use different words.","<p>Los documentos más parecidos son {0} Para «{1}», el mejor candidato del catálogo es <b>{2}<\/b> (Jaro–Winkler {3}; {4} edición(es) tras normalizar). Se recomienda fijar un umbral (p. ej. Jaro–Winkler ≥ 0,90) y revisar manualmente los casos intermedios.<\/p>":"<p>The most similar documents are {0} For “{1}”, the best candidate in the catalog is <b>{2}<\/b> (Jaro–Winkler {3}; {4} edit(s) after normalizing). It is recommended to set a threshold (e.g. Jaro–Winkler ≥ 0.90) and manually review the intermediate cases.<\/p>","Sistemas de recomendación":"Recommender systems","Filtrado colaborativo basado en usuarios y en ítems con similitud coseno o de Pearson, y evaluación por validación dejando uno fuera.":"Collaborative filtering based on users and items with cosine or Pearson similarity, and leave-one-out validation.","<p>Un sistema de recomendación predice la preferencia de un usuario por ítems que no ha evaluado, usando la matriz de calificaciones R (usuarios × ítems, con muchos vacíos).<\/p>\n  <ul><li><b>Basado en usuarios:<\/b> r̂(u,i) = r̄ᵤ + Σ_v sim(u,v)(r_vi − r̄_v) / Σ|sim(u,v)| sobre los k vecinos más similares que calificaron i.<\/li><li><b>Basado en ítems:<\/b> r̂(u,i) = Σ_j sim(i,j)·r_uj / Σ|sim(i,j)| sobre los ítems j calificados por u y más parecidos a i. Suele ser más estable cuando hay más usuarios que ítems.<\/li><li><b>Similitud:<\/b> coseno o correlación de Pearson calculada sobre las calificaciones en común.<\/li><li><b>Evaluación:<\/b> se oculta cada calificación conocida, se predice y se calcula RMSE y MAE. Limitaciones: arranque en frío (usuarios o ítems nuevos) y dispersión.<\/li><\/ul>":"<p>A recommender system predicts a user’s preference for items they have not rated, using the rating matrix R (users × items, with many gaps).<\/p>\n  <ul><li><b>User-based:<\/b> r̂(u,i) = r̄ᵤ + Σ_v sim(u,v)(r_vi − r̄_v) / Σ|sim(u,v)| over the k most similar neighbors who rated i.<\/li><li><b>Item-based:<\/b> r̂(u,i) = Σ_j sim(i,j)·r_uj / Σ|sim(i,j)| over the items j rated by u that are most similar to i. It is usually more stable when there are more users than items.<\/li><li><b>Similarity:<\/b> cosine or Pearson correlation computed over the ratings in common.<\/li><li><b>Evaluation:<\/b> each known rating is hidden, predicted, and RMSE and MAE are computed. Limitations: cold start (new users or items) and sparsity.<\/li><\/ul>","Matriz de calificaciones (primera columna: usuario; celdas vacías = sin calificar)":"Rating matrix (first column: user; empty cells = unrated)","Basado en usuarios":"User-based","Basado en ítems":"Item-based","Vecinos k":"Neighbors k","Usuario a recomendar":"User to recommend for","N.º de recomendaciones":"Number of recommendations","Usuario \"{0}\" no encontrado. Disponibles: {1}":"User \"{0}\" not found. Available: {1}","Usuarios":"Users","Ítems":"Items","Dispersión":"Sparsity","RMSE (dejar uno fuera)":"RMSE (leave-one-out)","Recomendaciones para {0}":"Recommendations for {0}","Posición":"Rank","Ítem":"Item","Calificación prevista":"Predicted rating","Calificaciones conocidas del usuario":"User’s known ratings","Calificación":"Rating","<i class=\"mut\">sin calificar<\/i>":"<i class=\"mut\">unrated<\/i>","sin":"without","Similitud entre ítems":"Similarity between items","ítems":"items","de Pearson":"Pearson",", mejor que predecir siempre el promedio global (desv. estándar {0})":", better than always predicting the global average (standard deviation {0})",", sin superar a la predicción por promedio global: pruebe otro k o similitud":", without beating the global average prediction: try another k or similarity","<p>La matriz tiene {0} % de celdas vacías. El método basado en {1} con similitud {2} logra RMSE = {3}{4}. Para <b>{5}<\/b> se recomienda primero <b>{6}<\/b> (calificación prevista {7}).<\/p>":"<p>The matrix has {0}% empty cells. The {1}-based method with {2} similarity achieves RMSE = {3}{4}. For <b>{5}<\/b>, <b>{6}<\/b> is recommended first (predicted rating {7}).<\/p>","Deep Learning: redes convolucionales (CNN)":"Deep Learning: convolutional networks (CNN)","Aplique convoluciones, ReLU y pooling sobre una imagen y calcule dimensiones, parámetros y operaciones de una arquitectura como AlexNet.":"Apply convolutions, ReLU and pooling to an image and compute dimensions, parameters and operations of an architecture such as AlexNet.","<p>Una red convolucional procesa imágenes con filtros pequeños que se desplazan por la imagen compartiendo pesos, lo que reduce los parámetros y captura patrones locales (bordes, texturas, formas).<\/p>\n  <ul><li><b>Convolución:<\/b> (I∗K)(i,j) = Σₐ Σ_b K(a,b)·I(i·s+a−p, j·s+b−p). Tamaño de salida: ⌊(n + 2p − k)/s⌋ + 1, con tamaño de entrada n, filtro k, relleno p y paso s.<\/li><li><b>ReLU:<\/b> max(0,x) introduce no linealidad. <b>Max-pooling:<\/b> conserva el máximo de cada ventana y reduce la resolución.<\/li><li><b>Parámetros:<\/b> capa convolucional k·k·C_in·F + F; capa densa n_in·n_out + n_out. <b>Operaciones<\/b> (MAC) de una convolución: H_out·W_out·k²·C_in·F.<\/li><li><b>AlexNet<\/b> (2012): 5 capas convolucionales, 3 de pooling y 3 densas, ReLU, dropout y aprendizaje en GPU; ganó ImageNet con una gran ventaja y popularizó el aprendizaje profundo en visión.<\/li><\/ul>":"<p>A convolutional network processes images with small filters that slide across the image sharing weights, which reduces the parameters and captures local patterns (edges, textures, shapes).<\/p>\n  <ul><li><b>Convolution:<\/b> (I∗K)(i,j) = Σₐ Σ_b K(a,b)·I(i·s+a−p, j·s+b−p). Output size: ⌊(n + 2p − k)/s⌋ + 1, with input size n, filter k, padding p and stride s.<\/li><li><b>ReLU:<\/b> max(0,x) introduces nonlinearity. <b>Max-pooling:<\/b> keeps the maximum of each window and reduces the resolution.<\/li><li><b>Parameters:<\/b> convolutional layer k·k·C_in·F + F; dense layer n_in·n_out + n_out. <b>Operations<\/b> (MAC) of a convolution: H_out·W_out·k²·C_in·F.<\/li><li><b>AlexNet<\/b> (2012): 5 convolutional layers, 3 pooling layers and 3 dense layers, ReLU, dropout and GPU training; it won ImageNet by a wide margin and popularized deep learning in vision.<\/li><\/ul>","Imagen de ejemplo (10×10)":"Example image (10×10)","Filtro 3×3":"3×3 filter","Paso (stride)":"Stride","Relleno (padding)":"Padding","Entrada de la arquitectura (alto, ancho, canales)":"Architecture input (height, width, channels)","Capas (una por línea): conv,filtros,k,paso,relleno · pool,k,paso · fc,neuronas":"Layers (one per line): conv,filters,k,stride,padding · pool,k,stride · fc,neurons","Convolución, ReLU y max-pooling sobre la imagen":"Convolution, ReLU and max-pooling on the image","Entrada":"Input","Mapa de características":"Feature map","Tras max-pool 2×2":"After 2×2 max-pool","Imagen":"Image","Filtro":"Filter","Mapa (convolución)":"Map (convolution)","Tras ReLU":"After ReLU","Tras max-pool":"After max-pool","La entrada debe tener tres números: alto, ancho, canales.":"The input must have three numbers: height, width, channels.","La capa {0} reduce la imagen a tamaño no válido.":"Layer {0} reduces the image to an invalid size.","Conv {0}×{1}, {2} filtros, paso {3}, relleno {4}":"Conv {0}×{1}, {2} filters, stride {3}, padding {4}","La capa {0} (pool) reduce la imagen a tamaño no válido.":"Layer {0} (pool) reduces the image to an invalid size.","Max-pool {0}×{1}, paso {2}":"Max-pool {0}×{1}, stride {2}"," (tras aplanar ":" (after flattening ","Densa {0}{1}":"Dense {0}{1}","Tipo de capa desconocido en la línea {0}: \"{1}\". Use conv, pool o fc.":"Unknown layer type on line {0}: \"{1}\". Use conv, pool or fc.","Dimensiones, parámetros y operaciones por capa":"Dimensions, parameters and operations per layer","Capa":"Layer","Forma de salida":"Output shape","MAC (multiplicaciones-acumulaciones)":"MAC (multiply-accumulate)","Parámetros por capa (millones)":"Parameters per layer (millions)","Millones":"Millions","Azul: capas convolucionales. Naranja: capas densas.":"Blue: convolutional layers. Orange: dense layers.","<p>El filtro <b>{0}<\/b> responde donde la imagen tiene el patrón que detecta; tras ReLU solo se conservan las activaciones positivas y el pooling resume cada ventana 2×2. La arquitectura indicada tiene <b>{1} millones de parámetros<\/b> y requiere {2} mil millones de MAC por imagen. Las capas densas concentran el {3} % de los parámetros, mientras que las convolucionales concentran casi todo el cómputo: por eso se comparten pesos en las primeras capas.<\/p>":"<p>The filter <b>{0}<\/b> responds where the image has the pattern it detects; after ReLU only the positive activations are kept and pooling summarizes each 2×2 window. The indicated architecture has <b>{1} million parameters<\/b> and requires {2} billion MACs per image. The dense layers hold {3}% of the parameters, while the convolutional ones concentrate almost all the computation: that is why weights are shared in the first layers.<\/p>","la regresión lineal estima la relación entre variables y la regresión logística estima la probabilidad de un evento\nel modelo de lenguaje predice la siguiente palabra y el modelo estima la probabilidad de cada palabra\nla red neuronal aprende patrones y la red neuronal ajusta sus pesos con retropropagación\nel modelo aprende de los datos y el modelo usa los datos para predecir el resultado\nlos datos de entrenamiento definen lo que el modelo aprende y el modelo generaliza a datos nuevos":"linear regression estimates the relationship between variables and logistic regression estimates the probability of an event\nthe language model predicts the next word and the model estimates the probability of each word\nthe neural network learns patterns and the neural network adjusts its weights with backpropagation\nthe model learns from the data and the model uses the data to predict the result\nthe training data define what the model learns and the model generalizes to new data","IA generativa y modelos de lenguaje (LLM)":"Generative AI and large language models (LLM)","Perspectiva estadística de los LLM: muestreo con temperatura, modelo de n-gramas y perplejidad, ventana de contexto y construcción de prompts.":"Statistical perspective on LLMs: temperature sampling, n-gram model and perplexity, context window and prompt construction.","<p>Un modelo de lenguaje asigna probabilidades a secuencias de tokens: P(w₁…w_T) = Π P(wₜ | w₁…wₜ₋₁). Un <b>LLM<\/b> estima estas probabilidades condicionales con una red neuronal (Transformer) de miles de millones de parámetros, entrenada para minimizar la entropía cruzada sobre un corpus muy grande. Es un modelo <b>generativo<\/b>: produce texto muestreando de la distribución predicha.<\/p>\n  <ul><li><b>Softmax con temperatura:<\/b> pᵢ = exp(zᵢ/T)/Σexp(zⱼ/T). T baja concentra la masa en el token más probable (respuestas deterministas); T alta aplana la distribución (más diversidad y más errores). <b>Top-k<\/b> y <b>top-p<\/b> (núcleo) truncan la cola antes de muestrear.<\/li><li><b>Perplejidad:<\/b> PPL = exp(−(1/T)Σ ln P(wₜ|contexto)); es el «factor de ramificación» efectivo: menor es mejor.<\/li><li><b>Tamaño muestral y ventana de contexto:<\/b> la calidad depende de la cantidad y diversidad de datos de entrenamiento; la ventana de contexto limita cuántos tokens (prompt + respuesta) caben en una consulta.<\/li><li><b>Ingeniería de prompts:<\/b> rol, contexto, tarea, formato de salida, restricciones y ejemplos mejoran la respuesta.<\/li><li><b>Riesgos y límites:<\/b> alucinaciones (texto plausible pero falso), sesgos heredados de los datos, fuga de información confidencial, vulnerabilidad a inyección de prompts y ausencia de garantías de exactitud: verifique los resultados críticos.<\/li><\/ul>":"<p>A language model assigns probabilities to token sequences: P(w₁…w_T) = Π P(wₜ | w₁…wₜ₋₁). An <b>LLM<\/b> estimates these conditional probabilities with a neural network (Transformer) of billions of parameters, trained to minimize cross-entropy on a very large corpus. It is a <b>generative<\/b> model: it produces text by sampling from the predicted distribution.<\/p>\n  <ul><li><b>Softmax with temperature:<\/b> pᵢ = exp(zᵢ/T)/Σexp(zⱼ/T). A low T concentrates the mass on the most probable token (deterministic answers); a high T flattens the distribution (more diversity and more errors). <b>Top-k<\/b> and <b>top-p<\/b> (nucleus) truncate the tail before sampling.<\/li><li><b>Perplexity:<\/b> PPL = exp(−(1/T)Σ ln P(wₜ|context)); it is the effective “branching factor”: lower is better.<\/li><li><b>Sample size and context window:<\/b> quality depends on the amount and diversity of training data; the context window limits how many tokens (prompt + response) fit in a query.<\/li><li><b>Prompt engineering:<\/b> role, context, task, output format, constraints and examples improve the response.<\/li><li><b>Risks and limits:<\/b> hallucinations (plausible but false text), biases inherited from the data, leakage of confidential information, vulnerability to prompt injection and no guarantee of accuracy: verify critical results.<\/li><\/ul>","Muestreo: temperatura, top-k y top-p":"Sampling: temperature, top-k and top-p","Modelo de bigramas y perplejidad":"Bigram model and perplexity","Ventana de contexto y costo":"Context window and cost","Constructor de prompts":"Prompt builder","Oportunidades y riesgos de un caso de uso":"Opportunities and risks of a use case","Muestreo: token,puntaje (logit)":"Sampling: token,score (logit)","estadística,3.2\nmodelo,2.8\ndatos,2.1\nregresión,1.9\nredes,1.2\npizza,-0.5\nluna,-1.4":"statistics,3.2\nmodel,2.8\ndata,2.1\nregression,1.9\nnetworks,1.2\npizza,-0.5\nmoon,-1.4","Temperatura T":"Temperature T","Top-k (0 = sin límite)":"Top-k (0 = no limit)","Top-p":"Top-p","Bigramas: corpus de entrenamiento":"Bigrams: training corpus","Bigramas: palabra de contexto":"Bigrams: context word","el modelo":"the model","Bigramas: frase de prueba":"Bigrams: test sentence","el modelo aprende de los datos":"the model learns from the data","Suavizado de Laplace α":"Laplace smoothing α","Contexto: palabras del prompt":"Context: prompt words","Context cal committee.","Prompt: formato de salida":"Prompt: output format","Resumen de 5 viñetas y una recomendación final":"Summary in 5 bullets and a final recommendation","Prompt: restricciones":"Prompt: constraints","Sin jerga estadística; indica los supuestos y las limitaciones":"No statistical jargon; state the assumptions and limitations","Prompt: ejemplo de salida deseada":"Prompt: example of desired output","• El consumo sube 3,2 kWh por cada unidad adicional de producción.":"• Consumption rises 3.2 kWh for each additional unit of production.","Ingrese al menos dos tokens con su puntaje.":"Enter at least two tokens with their score.","Entropía con T = 1":"Entropy at T = 1","Entropía con T = {0}":"Entropy at T = {0}","Tokens que sobreviven":"Surviving tokens","Token más probable":"Most probable token","Distribución de probabilidad":"Probability distribution","Token":"Token","Logit":"Logit","P tras top-k/top-p":"P after top-k/top-p","Frecuencia en {0} muestras":"Frequency in {0} samples","Probabilidad final de cada token (%)":"Final probability of each token (%)","la distribución se concentra y las respuestas serán más deterministas y repetibles":"the distribution concentrates and the answers will be more deterministic and repeatable","la distribución se aplana y habrá más diversidad (y más riesgo de tokens poco pertinentes)":"the distribution flattens and there will be more diversity (and more risk of irrelevant tokens)","no se modifica la distribución original":"the original distribution is not modified","<p>Con T = {0} la entropía pasa de {1} a {2} bits: {3}. Tras aplicar top-k/top-p quedan {4} candidato(s) que acumulan toda la probabilidad. En {5} muestras, «{6}» se eligió {7} % de las veces (teórico {8} %).<\/p>":"<p>With T = {0} the entropy goes from {1} to {2} bits: {3}. After applying top-k/top-p, {4} candidate(s) remain, accumulating all the probability. In {5} samples, “{6}” was chosen {7}% of the time (theoretical {8}%).<\/p>","Bigramas distintos":"Distin id not converge","El vector de la función objetivo debe tener números separados por comas.":"The objective function vector must have comma-separated numbers.","Restricción {0}: use el formato «coeficientes; <=; límite».":"Constraint {0}: use the format “coefficients; <=; limit”.","Restricción {0}: debe tener {1} coeficientes.":"Constraint {0}: it must have {1} coefficients.","Restricción {0}: el operador debe ser <=, >= o =.":"Constraint {0}: the operator must be <=, >= or =.","Restricción {0}: límite no numérico.":"Constraint {0}: non-numeric limit.","Ingrese al menos una restricción.":"Enter at least one constraint.","El mapa debe tener una «S» (inicio) y una «G» (meta).":"The map must have an “S” (start) and a “G” (goal).","Valparaíso":"Valparaíso","Puerto Montt":"Puerto Montt","Proyecto {0}":"Project {0}","Metaheurísticas: escalada, recocido simulado y algoritmo genético":"Metaheuristics: hill climbing, simulated annealing and genetic algorithm","Resuelve problemas combinatorios (mochila y viajante) con tres metaheurísticas, las repite con distintas semillas y las compara con el óptimo exacto.":"Solves combinatorial problems (knapsack and traveling salesman) with three metaheuristics, repeats them with different seeds and compares them with the exact optimum.","<p>Una <b>metaheurística<\/b> explora un espacio de soluciones demasiado grande para enumerarlo, aceptando que puede no hallar el óptimo. Por eso se evalúa repitiendo el método con distintas semillas y comparando con una referencia.<\/p>\n  <ul><li><b>Escalada con reinicios:<\/b> acepta un vecino si no empeora; al estancarse reinicia desde otra solución al azar.<\/li><li><b>Recocido simulado:<\/b> acepta empeoramientos con probabilidad e<sup>−Δ/T<\/sup>; la temperatura T baja de forma geométrica, de modo que al inicio explora y al final refina.<\/li><li><b>Algoritmo genético:<\/b> población con selección por torneo, cruce (uniforme en la mochila; de orden, OX, en el viajante), mutación y elitismo.<\/li><li><b>Problemas:<\/b> <i>mochila 0/1<\/i> (maximizar valor con un presupuesto de costo; óptimo exacto por programación dinámica) y <i>viajante<\/i> (ruta cerrada más corta; óptimo exacto por Held–Karp hasta 16 ciudades).<\/li><li><b>Comparación justa:<\/b> todas las corridas usan el mismo presupuesto de evaluaciones de la función objetivo. Se informa la brecha respecto del óptimo y el porcentaje de corridas que lo alcanzan.<\/li><\/ul><p class=\"small\">Las distancias del ejemplo son en línea recta a partir de coordenadas aproximadas, no distancias por carretera.<\/p>":"<p>A <b>metaheuristic<\/b> explores a solution space too large to enumerate, accepting that it may not find the optimum. For this reason it is evaluated by repeating the method with different seeds and comparing against a reference.<\/p>\n  <ul><li><b>Hill climbing with restarts:<\/b> accepts a neighbor if it does not worsen; when stuck, it restarts from another random solution.<\/li><li><b>Simulated annealing:<\/b> accepts worsenings with probability e<sup>−Δ/T<\/sup>; the temperature T decreases geometrically, so that it explores at the start and refines at the end.<\/li><li><b>Genetic algorithm:<\/b> population with tournament selection, crossover (uniform in the knapsack; order crossover, OX, in the traveling salesman), mutation and elitism.<\/li><li><b>Problems:<\/b> <i>0/1 knapsack<\/i> (maximize value with a cost budget; exact optimum by dynamic programming) and <i>traveling salesman<\/i> (shortest closed route; exact optimum by Held–Karp up to 16 cities).<\/li><li><b>Fair comparison:<\/b> all runs use the same budget of objective function evaluations. The gap to the optimum and the percentage of runs that reach it are reported.<\/li><\/ul><p class=\"small\">The example distances are straight-line from approximate coordinates, not road distances.<\/p>","Problema":"Problem","Mochila 0/1 (selección de proyectos con presupuesto)":"0/1 knapsack (project selection with a budget)","Viajante (ruta cerrada más corta)":"Traveling salesman (shortest closed route)","Datos: proyectos (nombre, valor, costo) o ciudades (nombre, latitud, longitud)":"Data: projects (name, value, cost) or cities (name, latitude, longitude)","Mochila: presupuesto disponible (0 = 40 % del costo total)":"Knapsack: available budget (0 = 40% of total cost)","Presupuesto de evaluaciones por corrida":"Evaluation budget per run","Corridas por método (semillas distintas)":"Runs per method (different seeds)","Semilla base":"Base seed","Se necesitan dos columnas numéricas: valor y costo.":"Two numeric columns are needed: value and cost.","Hay valores no numéricos en valor o costo.":"There are non-numeric values in value or cost.","Voraz por valor/costo":"Greedy by value/cost","Se necesitan columnas numéricas de latitud y longitud.":"Numeric latitude and longitude columns are needed.","Ingrese al menos 5 ciudades.":"Enter at least 5 cities.","Vecino más cercano (mejor inicio)":"Nearest neighbor (best start)","longitud (km)":"longitude (km)","Escalada con reinicios":"Hill climbing with restarts","Recocido simulado":"Simulated annealing","Algoritmo genético":"Genetic algorithm","Referencia":"Reference","Óptimo exacto":"Exact optimum","Mejor encontrada":"Best found","{0} % del óptimo":"{0}% of the optimum","Evaluaciones por corrida":"Evaluations per run","Corridas por método":"Runs per method","Resultados de {0} corridas por método ({1})":"Results of {0} runs per method ({1})","Mejor":"Best","Peor":"Worst","Brecha media":"Mean gap","Corridas en el óptimo":"Runs at the optimum","Corridas en la mejor conocida":"Runs at the best known","Convergencia media ({0})":"Mean convergence ({0})","Evaluaciones de la función objetivo":"Objective function evaluations","Mejor ruta encontrada: {0} km":"Best route found: {0} km","Este-oeste (km)":"East-west (km)","Norte-sur (km)":"North-south (km)","Orden de visita: ":"Visiting order: ","<p class=\"small\"><b>Mejor selección encontrada<\/b> ({0} de {1}; costo {2} de {3}; valor {4}): {5}.<\/p>":"<p class=\"small\"><b>Best selection found<\/b> ({0} of {1}; cost {2} of {3}; value {4}): {5}.<\/p>","del óptimo exacto":"of the exact optimum","de la mejor solución conocida":"of the best known solution","el óptimo":"the optimum","esa solución":"that solution","La variación entre corridas es apreciable: no confíe en una sola ejecución y repita con varias semillas.":"The variation between runs is appreciable: do not rely on a single execution and repeat with several seeds.","La variación entre corridas es pequeña, lo que da confianza en la repetibilidad.":"The variation between runs is small, which gives confidence in repeatability.","La mejor solución supera a la heurística constructiva ({0}).":"The best solution beats the constructive heuristic ({0}).","Ninguna metaheurística superó a la heurística constructiva ({0}): con este presupuesto no justifican su complejidad.":"No metaheuristic beat the constructive heuristic ({0}): with this budget they do not justify their complexity."," Como el problema es demasiado grande para el cálculo exacto, la referencia es la mejor solución encontrada y la brecha es solo relativa a ella.":" Since the problem is too large for exact computation, the reference is the best solution found and the gap is only relative to it.","<p>Con el mismo presupuesto de {0} evaluaciones, el método con menor brecha media fue <b>{1}<\/b> ({2} % por encima {3}; alcanzó {4} en {5} % de las corridas). {6} {7}{8}<\/p><p class=\"small\">Una metaheurística no garantiza el óptimo; su calidad se demuestra con repeticiones y con una referencia, como aquí.<\/p>":"<p>With the same budget of {0} evaluations, the method with the lowest mean gap was <b>{1}<\/b> ({2}% above {3}; it reached {4} in {5}% of the runs). {6} {7}{8}<\/p><p class=\"small\">A metaheuristic does not guarantee the optimum; its quality is demonstrated with repetitions and a reference, as here.<\/p>","Restricciones y optimización lineal: simplex y satisfacción de restricciones":"Linear constraints and optimization: simplex and constraint satisfaction","Optimización lineal con precios sombra y restricciones ligadoras (método simplex) y satisfacción de restricciones con búsqueda inteligente (coloreo de grafos y N reinas).":"Linear optimization with shadow prices and binding constraints (simplex method) and constraint satisfaction with intelligent search (graph coloring and N-queens).","<p><b>Programación lineal.<\/b> Maximiza o minimiza c·x sujeto a restricciones lineales y x ≥ 0. La solución óptima, si existe, está en un vértice de la región factible; el método simplex recorre vértices mejorando el objetivo. Se resuelve con penalización Big-M para restricciones ≥ y =.<\/p><ul><li><b>Restricción ligadora:<\/b> se cumple con igualdad en el óptimo; es el recurso que limita el resultado.<\/li><li><b>Precio sombra:<\/b> cuánto cambia el objetivo por una unidad más del límite de esa restricción (se calcula resolviendo de nuevo con el límite aumentado). Una restricción no ligadora tiene precio sombra cero.<\/li><li>Con dos variables se grafica la región factible, la recta del objetivo y el óptimo.<\/li><\/ul>\n  <p><b>Satisfacción de restricciones (CSP).<\/b> Se asignan valores a variables respetando restricciones. La <i>búsqueda con retroceso<\/i> prueba asignaciones y retrocede al fallar; mejora mucho con <b>MRV<\/b> (elegir la variable con menos valores posibles) y <b>comprobación hacia adelante<\/b> (podar los valores que quedan imposibles). Se compara el número de nodos explorados con y sin esas heurísticas.<\/p><ul><li><b>Coloreo de grafos:<\/b> asigna «colores» (p. ej., bloques horarios) de modo que elementos conectados (evaluaciones que comparten alumnos) no coincidan. El menor número de colores que funciona está demostrado óptimo porque con uno menos la búsqueda exhaustiva no encuentra solución.<\/li><li><b>N reinas:<\/b> se cuentan las soluciones y se contrastan con los valores conocidos.<\/li><\/ul>":"<p><b>Linear programming.<\/b> Maximizes or minimizes c·x subject to linear constraints and x ≥ 0. The optimal solution, if it exists, lies at a vertex of the feasible region; the simplex method traverses vertices improving the objective. It is solved with the Big-M penalty for ≥ and = constraints.<\/p><ul><li><b>Binding constraint:<\/b> it holds with equality at the optimum; it is the resource that limits the result.<\/li><li><b>Shadow price:<\/b> how much the objective changes per additional unit of that constraint’s limit (computed by solving again with the increased limit). A non-binding constraint has a shadow price of zero.<\/li><li>With two variables, the feasible region, the objective line and the optimum are plotted.<\/li><\/ul>\n  <p><b>Constraint satisfaction (CSP).<\/b> Values are assigned to variables respecting constraints. <i>Backtracking search<\/i> tries assignments and backs up on failure; it improves greatly with <b>MRV<\/b> (choose the variable with the fewest possible values) and <b>forward checking<\/b> (prune the values that become impossible). The number of nodes explored with and without these heuristics is compared.<\/p><ul><li><b>Graph coloring:<\/b> assigns “colors” (e.g., time slots) so that connected elements (exams that share students) do not coincide. The smallest number of colors that works is proven optimal because with one fewer the exhaustive search finds no solution.<\/li><li><b>N-queens:<\/b> solutions are counted and compared with the known values.<\/li><\/ul>","Optimización lineal (simplex)":"Linear optimization (simplex)","Restricciones: coloreo de grafos y N reinas":"Constraints: graph coloring and N-queens","LP: objetivo":"LP: objective","Maximizar":"Maximize","Minimizar":"Minimize","LP: nombres de las variables":"LP: variable names","Producto A, Producto B":"Product A, Product B","LP: coeficientes de la función objetivo":"LP: objective function coefficients","LP: restricciones (coeficientes; operador; límite; nombre)":"LP: constraints (coefficient
