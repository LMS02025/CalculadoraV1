<title>Laboratorio de Data Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="appcss">
/* Diseño: cuaderno de laboratorio. Barra superior fija, menú lateral por familias de métodos, y un área de trabajo de una columna (reseña → datos → resultados). */
:root{
  --bg:#edf0f6;--panel:#ffffff;--fg:#121c32;--mut:#56627a;--line:#d5dce8;--soft:#f2f5fa;
  --ac:#1b4fd6;--acfg:#ffffff;
  --c1:#0072b2;--c2:#d98e00;--c3:#008a64;--c4:#c8501a;--c5:#8a94a6;--c6:#b8609a;
  --good:#0a7d4f;--bad:#c62f2f;--warn:#a35f00;
  --disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --sans:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b111e;--panel:#121a2b;--fg:#e6ebf6;--mut:#9aa6be;--line:#25314a;--soft:#18223a;
  --ac:#7ca4ff;--acfg:#0b111e;
  --c1:#56b4e9;--c2:#f0b429;--c3:#3dccA0;--c4:#ff8a5b;--c5:#9aa5ba;--c6:#e59ac7;
  --good:#3dcca0;--bad:#ff7a7a;--warn:#f0b429;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b111e;--panel:#121a2b;--fg:#e6ebf6;--mut:#9aa6be;--line:#25314a;--soft:#18223a;
  --ac:#7ca4ff;--acfg:#0b111e;
  --c1:#56b4e9;--c2:#f0b429;--c3:#3dcca0;--c4:#ff8a5b;--c5:#9aa5ba;--c6:#e59ac7;
  --good:#3dcca0;--bad:#ff7a7a;--warn:#f0b429;color-scheme:dark}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:3px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font:700 1.02rem/1.1 var(--disp);min-width:0}
.brand svg{flex:none;color:var(--ac)}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.menu{display:none}

.app{display:grid;grid-template-columns:276px minmax(0,1fr);align-items:start}
#nav{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));max-height:calc(100dvh - 56px);overflow-y:auto;padding:10px 12px 40px 16px;border-right:1px solid var(--line)}
.ng{font:600 .68rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:16px 10px 4px}
.ni{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 10px;border-radius:5px;color:var(--fg);text-decoration:none;font-size:.86rem;line-height:1.3}
.ni small{font:.66rem var(--mono);color:var(--mut);white-space:nowrap}
.ni:hover{background:var(--soft)}
.ni.on{background:var(--ac);color:var(--acfg)}.ni.on small{color:inherit;opacity:.8}
.badge{background:var(--c4);color:#fff;border-radius:10px;padding:0 7px;font:600 .7rem var(--mono);margin-left:6px}
main{min-width:0;padding:22px clamp(16px,3vw,40px) 80px;max-width:1080px;width:100%}
.mod{display:flex;flex-direction:column;gap:0}

.mh{display:grid;gap:6px;margin:0 0 18px}
.mh h2{font:700 clamp(1.5rem,3.2vw,2.1rem)/1.12 var(--disp);margin:0;text-wrap:balance}
.eyebrow{font:600 .72rem var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ac);margin:0 0 4px}
.lead{color:var(--mut);margin:0;max-width:70ch;font-size:1rem}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 16px;min-width:0}
.panel h3{font:600 .95rem var(--sans);margin:0 0 12px}
.panel.note{background:var(--soft)}
details.panel>summary{cursor:pointer;font:600 .95rem var(--sans);list-style:none;display:flex;align-items:center;gap:8px}
details.panel>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s}
details[open].panel>summary::before{transform:rotate(45deg)}
details.panel>summary::-webkit-details-marker{display:none}
.revb{margin-top:10px;max-width:78ch;line-height:1.6}
.revb ul{padding-left:1.2em;display:grid;gap:6px}
details.code pre{margin:10px 0 0;font:12px/1.55 var(--mono);background:var(--soft);padding:12px;border-radius:6px;overflow-x:auto;white-space:pre}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}.fld.wide{grid-column:1/-1}
.fld label{font:600 .78rem var(--sans);color:var(--mut)}
.hint{font-size:.74rem;color:var(--mut)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;font-size:.9rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
textarea{resize:vertical;line-height:1.45}textarea.mono{font:12.5px/1.45 var(--mono)}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.fld.chk{flex-direction:row;align-items:center;gap:8px}.fld.chk label{font-size:.88rem;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:.82rem var(--sans)!important;color:var(--fg)!important;padding:3px 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}

.btn{font:600 .85rem var(--sans);padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:8px}

.hero{padding:10px 0 26px;max-width:760px}
.hero h1{font:700 clamp(2rem,5.5vw,3.3rem)/1.04 var(--disp);margin:6px 0 14px;text-wrap:balance}
.hero .row{margin-top:18px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-bottom:0}
.steps{padding-left:1.2em;display:grid;gap:8px;margin:0}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0;font-size:.9rem}
.facts dt{color:var(--mut)}.facts dd{margin:0}
.tag{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:12px;font-size:.76rem;text-decoration:none;white-space:nowrap;margin:1px 2px 1px 0;font-family:var(--sans)}
.tag:hover{border-color:var(--ac)}

.rsec{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--bg);display:grid;gap:8px}
.rsec-h{display:flex;gap:8px;align-items:center}.rsec-h input{flex:1;font-weight:600}
.idx{font:600 .8rem var(--mono);color:var(--acfg);background:var(--ac);border-radius:4px;min-width:1.9em;text-align:center;padding:2px 0}
h3.pv{font:600 .95rem var(--sans);margin:22px 0 10px}
.preview{overflow-x:auto;padding:16px 8px;background:var(--soft);border:1px solid var(--line);border-radius:8px}
.preview .rpt{min-width:0}

@media (max-width:919px){
  .app{grid-template-columns:minmax(0,1fr)}
  .menu{display:inline-flex}
  #nav{position:static;max-height:none;display:none;border-right:0;border-bottom:1px solid var(--line);padding:6px 16px 16px}
  #nav.open{display:block}
  .top{flex-wrap:nowrap}
}
@media (max-width:520px){.brand span{font-size:.92rem}.kpi b{font-size:1.05rem}.panel{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>
<style id="repcss">
/* Contenido de resultados + informe. Solo usa tokens (var) para servir también al archivo exportado. */
.res{min-width:0}
.res h4,.rpt h4{font:600 .95rem/1.3 var(--sans);margin:1.4em 0 .5em;color:var(--fg)}
.res p,.rpt p{margin:.5em 0;line-height:1.55}
.res .small,.small{font-size:.82rem;color:var(--mut)}
.res code,.revb code,.rpt code{font-family:var(--mono);font-size:.86em;background:var(--soft);padding:.05em .35em;border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:.4em 0 1em}
.kpi{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:0}
.kpi span{font-size:.74rem;letter-spacing:.03em;text-transform:uppercase;color:var(--mut)}
.kpi b{font:600 1.18rem/1.2 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi i{font-style:normal;font-size:.75rem;color:var(--mut)}
.tw{overflow-x:auto;max-width:100%;margin:.4em 0 1em}
table.t{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
table.t th{font-weight:600;font-size:.74rem;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);text-align:right;padding:6px 10px;border-bottom:2px solid var(--fg);white-space:nowrap}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:.82rem;vertical-align:top}
table.t th.l,table.t td.l{text-align:left;font-family:var(--sans);font-size:.84rem}
table.t tr.tot td{border-top:2px solid var(--fg);font-weight:600}
table.t tbody tr:last-child td{border-bottom:1px solid var(--line)}
.interp{margin:1.2em 0;padding:12px 16px;background:var(--soft);border-left:4px solid var(--ac);border-radius:0 6px 6px 0}
.interp strong{display:block;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);margin-bottom:2px}
.interp p{margin:.35em 0}
.fig{margin:.6em 0 1em;min-width:0}
.fig figcaption{font-size:.78rem;color:var(--mut);margin-top:2px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.small-chart{max-width:340px}
.gridfig{display:flex;flex-wrap:wrap;gap:14px;margin:.5em 0 1em}
.gridfig svg{flex:0 1 auto;min-width:0}
.chart .tx{fill:var(--mut);font:11px var(--mono)}
.chart .hv{fill:var(--fg);font-size:10px}
.chart .tt{fill:var(--fg);font:600 12.5px var(--sans)}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--mut);stroke-width:1.2}
.chart .ref{stroke:var(--c4);stroke-width:1.2;stroke-dasharray:4 3}
.chart .ln{stroke-linejoin:round;stroke-linecap:round}
.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}.f5{fill:var(--c5)}.f6{fill:var(--c6)}
.s1{stroke:var(--c1)}.s2{stroke:var(--c2)}.s3{stroke:var(--c3)}.s4{stroke:var(--c4)}.s5{stroke:var(--c5)}.s6{stroke:var(--c6)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--mut);margin:.2em 0 .8em}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lg i.f1{background:var(--c1)}.lg i.f2{background:var(--c2)}.lg i.f3{background:var(--c3)}.lg i.f4{background:var(--c4)}.lg i.f5{background:var(--c5)}.lg i.f6{background:var(--c6)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.grid2>*{min-width:0}
canvas.cv,img.cv{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;display:block;background:var(--panel)}
pre.json{font:12px/1.5 var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.err{padding:12px 16px;border:1px solid var(--bad);border-radius:6px;color:var(--bad);background:var(--soft)}
.eq{font-family:var(--mono);text-align:center;padding:8px;background:var(--soft);border-radius:6px;overflow-x:auto}

/* Documento del informe */
.rpt{--bg:#fff;--panel:#fff;--fg:#14203a;--mut:#56627a;--line:#d8dee9;--soft:#f1f4f9;--ac:#1b4fd6;--c1:#0072b2;--c2:#d98e00;--c3:#008a64;--c4:#c8501a;--c5:#8a94a6;--c6:#b8609a;--good:#0a7d4f;--bad:#c62f2f;--warn:#a35f00;
  background:#fff;color:#14203a;font:15px/1.55 var(--sans);max-width:880px;margin:0 auto;padding:56px clamp(20px,6vw,64px);border:1px solid #d8dee9;border-radius:4px;box-shadow:0 8px 30px rgba(10,20,40,.10)}
.rpt .cover{padding:36px 0 30px;border-bottom:3px solid #14203a;margin-bottom:28px}
.rpt .cover .org{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#56627a;margin:0 0 18px}
.rpt .cover h1{font:700 clamp(1.7rem,4.6vw,2.5rem)/1.1 var(--disp);margin:0 0 10px;text-wrap:balance;color:#14203a}
.rpt .cover .sub{font-size:1.1rem;color:#56627a;margin:0 0 22px}
.rpt .cover dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 18px;margin:0;font-size:.9rem}
.rpt .cover dt{color:#56627a}.rpt .cover dd{margin:0;font-weight:500}
.rpt .toc{margin:0 0 30px;padding:16px 20px;background:#f1f4f9;border-radius:4px}
.rpt h2{font:700 1.35rem/1.25 var(--disp);margin:0 0 .6em;text-wrap:balance;color:#14203a;display:flex;gap:12px;align-items:baseline}
.rpt h2 .n{font:600 .9rem var(--mono);color:#fff;background:#1b4fd6;min-width:1.9em;text-align:center;border-radius:3px;padding:.12em .3em}
.rpt .toc ol{margin:.3em 0 0;padding-left:1.4em;columns:2;column-gap:32px}
.rpt .toc h2{font-size:1rem}
.rpt h3{font:600 1.05rem/1.3 var(--sans);margin:1.6em 0 .4em}
.rpt .rs{margin:0 0 36px;padding-top:6px;border-top:1px solid #d8dee9}
.rpt .rs:first-of-type{border-top:0}
.rpt .prm{font:12px/1.5 var(--mono);color:#56627a;background:#f1f4f9;padding:6px 10px;border-radius:3px;overflow-wrap:anywhere}
.rpt .analyst{margin-top:14px;padding:10px 16px;border:1px dashed #8a94a6;border-radius:4px}
.rpt .analyst strong{display:block;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:#56627a}
.rpt .annex .revb{font-size:.9rem;color:#14203a}
.rpt .rfoot{margin-top:40px;padding-top:12px;border-top:1px solid #d8dee9;font-size:.78rem;color:#56627a}
.rpt table.t th{border-bottom-color:#14203a}.rpt table.t tr.tot td{border-top-color:#14203a}
@media (max-width:600px){.rpt .toc ol{columns:1}.rpt{padding:32px 18px}}
@media print{body{background:#fff!important;padding:0!important}.rpt{box-shadow:none;border:0;max-width:none;padding:0}.rpt .rs{break-inside:auto}.fig,.kpi,table.t tr,.interp{break-inside:avoid}}

</style>

<script>
/* ===== Núcleo numérico ===== */
const L = (function () {
  const S = {};
  /* ---------- utilidades ---------- */
  S.sum = a => { let s = 0; for (const v of a) s += v; return s; };
  S.mean = a => S.sum(a) / a.length;
  S.variance = (a, ddof = 1) => { const m = S.mean(a); let s = 0; for (const v of a) s += (v - m) ** 2; return s / (a.length - ddof); };
  S.sd = (a, ddof = 1) => Math.sqrt(S.variance(a, ddof));
  S.sorted = a => Float64Array.from(a).sort();
  S.quantile = (a, p, sorted) => {
    const s = sorted || S.sorted(a); const n = s.length; if (n === 1) return s[0];
    const h = (n - 1) * p, lo = Math.floor(h), hi = Math.ceil(h); return s[lo] + (h - lo) * (s[hi] - s[lo]);
  };
  S.median = a => S.quantile(a, 0.5);
  S.cov = (x, y) => { const mx = S.mean(x), my = S.mean(y); let s = 0; for (let i = 0; i < x.length; i++) s += (x[i] - mx) * (y[i] - my); return s / (x.length - 1); };
  S.corr = (x, y) => S.cov(x, y) / (S.sd(x) * S.sd(y));
  S.range = a => { let lo = Infinity, hi = -Infinity; for (const v of a) { if (v < lo) lo = v; if (v > hi) hi = v; } return [lo, hi]; };
  S.rank = a => {
    const idx = a.map((v, i) => [v, i]).sort((p, q) => p[0] - q[0]); const r = new Array(a.length);
    let i = 0; while (i < idx.length) { let j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++; const rk = (i + j) / 2 + 1; for (let k = i; k <= j; k++) r[idx[k][1]] = rk; i = j + 1; }
    return r;
  };
  S.rng = seed => { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  S.randn = rnd => { let u = 0, v = 0; while (u === 0) u = rnd(); v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  S.shuffle = (a, rnd) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- funciones especiales y distribuciones ---------- */
  const G = [676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  function gammaln(x) {
    if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - gammaln(1 - x);
    x -= 1; let a = 0.99999999999980993; const t = x + 7.5;
    for (let i = 0; i < 8; i++) a += G[i] / (x + i + 1);
    return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
  }
  function betacf(a, b, x) {
    const FP = 1e-300; let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap; if (Math.abs(d) < FP) d = FP; d = 1 / d; let h = d;
    for (let m = 1; m <= 300; m++) {
      const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < FP) d = FP; c = 1 + aa / c; if (Math.abs(c) < FP) c = FP; d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < FP) d = FP; c = 1 + aa / c; if (Math.abs(c) < FP) c = FP; d = 1 / d; const del = d * c; h *= del;
      if (Math.abs(del - 1) < 3e-16) break;
    }
    return h;

/* ===== diseño de matriz con variables categóricas ===== */
function design(tb, ycol, xnames, opt = {}) {
  const yc = tb.cols.find(c => c.name === ycol); if (!yc || !yc.num) throw new Error('La variable respuesta debe ser numérica.');
  const xs = xnames.filter(n => n !== ycol).map(n => tb.cols.find(c => c.name === n)).filter(Boolean); if (!xs.length) throw new Error('Seleccione al menos una variable explicativa.');
  const keep = []; for (let i = 0; i < tb.n; i++) if (!isNaN(yc.v[i]) && xs.every(c => c.num ? !isNaN(c.v[i]) : c.raw[i] !== '')) keep.push(i);
  const names = [], colsData = [], groups = [];
  xs.forEach((c, gi) => { if (c.num) { names.push(c.name); colsData.push(keep.map(i => c.v[i])); groups.push(gi + 1); } else { const lv = [...new Set(keep.map(i => c.raw[i]))].sort(); lv.slice(1).forEach(l => { names.push(`${c.name}[${l}]`); colsData.push(keep.map(i => (c.raw[i] === l ? 1 : 0))); groups.push(gi + 1); }); } });
  const X = keep.map((_, r) => colsData.map(cd => cd[r]));
  return { X, y: keep.map(i => yc.v[i]), names, groups, n: keep.length, dropped: tb.n - keep.length, yname: ycol, idx: keep, xs };
}
const olsFit = (D, intercept = true) => L.ols(intercept ? L.withIntercept(D.X) : D.X, D.y, { intercept });
const coefTable = (m, names, ci = 0.95, intercept = true) => { const tq = L.tppf(0.5 + ci / 2, m.df), nm = intercept ? ['(Intercepto)', ...names] : names; return tbl(['Término', 'Coef.', 'Error est.', 't', 'p-valor', '', `IC ${Math.round(ci * 100)}%`], nm.map((n, j) => [esc(n), m.b[j], m.se[j], m.t[j], P(m.p[j]), sig(m.p[j]), `[${F(m.b[j] - tq * m.se[j], 3)}; ${F(m.b[j] + tq * m.se[j], 3)}]`]), {}); };
const fitStats = m => kpis([['R²', m.r2], ['R² ajustado', m.adj], ['Error estándar residual', m.sigma, `${m.df} g.l.`], ['F global', m.F, `p ${P(m.pF)}`], ['AIC', m.aic], ['BIC', m.bic]]);
const qqSVG = (res, title) => { const n = res.length, s = L.sorted(res), sd = L.sd(res), mu = L.mean(res), th = Array.from(s, (_, i) => L.normppf((i + .5) / n)), pts = th.map((t, i) => ({ x: t, y: (s[i] - mu) / sd })), lim = ext(th.concat(pts.map(p => p.y)), .06); return plot({ title, xlab: 'Cuantiles teóricos N(0,1)', ylab: 'Residuos estandarizados', xlim: lim, ylim: lim, h: 320 }, a => path(lim, lim, a.sx, a.sy, 2, 1.5, '5 4') + dots(pts, a.sx, a.sy)); };
const resPlot = (fit, res, title) => scatterSVG(fit, res, { title, xlab: 'Valores ajustados', ylab: 'Residuos', h: 300, lines: [{ x: ext(fit), y: [0, 0], c: 2, w: 1.5, dash: '5 4' }] });

reg({
  id: 'desc', group: 'Fundamentos', ref: 'Básico 1', title: 'Estadística descriptiva',
  lead: 'Resume una base de datos con medidas de tendencia central, dispersión y forma, e identifica el tipo de cada variable.',
  review: `<p>La estadística descriptiva condensa los datos sin inferir más allá de ellos. Primero se clasifica cada variable: <b>cuantitativa</b> (continua o discreta) o <b>cualitativa</b> (nominal u ordinal), porque de ello depende qué resumen y qué prueba son válidos.</p>
  <ul><li><b>Tendencia central:</b> media x̄ = Σxᵢ/n, mediana (percentil 50) y moda.</li><li><b>Dispersión:</b> varianza s² = Σ(xᵢ−x̄)²/(n−1), desviación estándar, rango intercuartil IQR = Q3−Q1, coeficiente de variación CV = s/|x̄|.</li><li><b>Forma:</b> asimetría g₁ = m₃/m₂^{3/2} y curtosis en exceso g₂ = m₄/m₂² − 3 (0 en una normal).</li><li><b>Valores atípicos (regla de Tukey):</b> fuera de [Q1 − 1,5·IQR ; Q3 + 1,5·IQR].</li></ul>
  <p>Una media muy distinta de la mediana, o una asimetría marcada, sugiere cola larga: conviene reportar mediana e IQR y considerar transformaciones (log).</p>`,
  code: `# Python\nimport pandas as pd\ndf = pd.read_csv("datos.csv")\ndf.describe(include="all")\ndf["tiempo_resp_ms"].skew(), df["tiempo_resp_ms"].kurt()\n# R\nsummary(df); library(moments); skewness(df$x); kurtosis(df$x)`,
  build() {
    const form = Form('desc', [{ k: 'data', t: 'data', label: 'Datos (CSV con encabezado; separador coma, punto y coma o tab)', sample: SAMPLES.tiempos, rows: 7 }, { k: 'col', t: 'col', from: 'data', label: 'Variable para los gráficos', def: 'first' }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data); let html = '';
        html += H4('Tipos de variables') + tbl(['Variable', 'Tipo', 'Válidos', 'Nulos', 'Únicos'], tb.cols.map(c => { const val = c.num ? c.v.filter(x => !isNaN(x)) : c.raw.filter(x => x !== ''); const uniq = new Set(val).size; const tipo = c.num ? (val.every(Number.isInteger) && uniq <= 10 ? 'Cuantitativa discreta' : 'Cuantitativa continua') : 'Cualitativa nominal'; return [esc(c.name), tipo, val.length, c.raw.length - val.length, uniq]; }));
        const nums = tb.cols.filter(c => c.num); if (nums.length) {
          const ds = nums.map(c => L.describe(c.v.filter(x => !isNaN(x))));
          html += H4('Estadísticos de las variables cuantitativas') + tbl(['Estadístico', ...nums.map(c => esc(c.name))], [['n', 'Media', 'Desv. estándar', 'CV', 'Mínimo', 'Q1', 'Mediana', 'Q3', 'Máximo', 'IQR', 'Asimetría', 'Curtosis (exceso)', 'Atípicos (Tukey)'].map((lab, i) => { const key = ['n', 'mean', 'sd', 'cv', 'min', 'q1', 'median', 'q3', 'max', 'iqr', 'skew', 'kurt'][i]; return [lab, ...ds.map(d => key ? d[key] : d.outliers.length)]; })][0]);
          const c = nums.find(c => c.name === v.col) || nums[0], vals = c.v.filter(x => !isNaN(x)), d = L.describe(vals);
          html += `<div class="grid2">${fig(histSVG(vals, { title: `Histograma de ${c.name}`, xlab: c.name, vlines: [{ x: d.mean, t: 'media', c: 4 }, { x: d.median, t: 'mediana', c: 3 }] }))}${fig(boxSVG([vals], [c.name], { title: `Diagrama de caja de ${c.name}`, ylab: c.name }), 'Línea gruesa: mediana. Puntos: atípicos según Tukey.')}</div>`;
          const asim = Math.abs(d.skew) < 0.5 ? 'aproximadamente simétrica' : d.skew > 0 ? 'asimétrica positiva (cola derecha)' : 'asimétrica negativa (cola izquierda)';
          html += interp(`<p><b>${esc(c.name)}</b>: n = ${d.n}, media ${F(d.mean, 3)}, mediana ${F(d.median, 3)}, desviación estándar ${F(d.sd, 3)} (CV ${F(d.cv * 100, 1)} %). La distribución es ${asim} (g₁ = ${F(d.skew, 2)}). ${d.outliers.length ? `Se detectan ${d.outliers.length} ${plural(d.outliers.length, 'valor atípico', 'valores atípicos')} según la regla de Tukey; revise si son errores de captura o casos reales.` : 'No se detectan atípicos según la regla de Tukey.'} ${Math.abs(d.mean - d.median) / d.sd > 0.2 ? 'La distancia entre media y mediana sugiere preferir la mediana como medida de resumen.' : ''}</p>`);
        }
        tb.cols.filter(c => !c.num).forEach(c => { const m = new Map(); c.raw.forEach(x => m.set(x, (m.get(x) || 0) + 1)); const rows = [...m.entries()].sort((a, b) => b[1] - a[1]); html += H4(`Frecuencias de ${esc(c.name)}`) + tbl(['Categoría', 'Frecuencia', 'Porcentaje'], rows.map(([k, n]) => [esc(k || '(vacío)'), n, F(100 * n / tb.n, 1) + ' %'])); });
        out.innerHTML = html;
      }
    };
  }
});

reg({
  id: 'test', group: 'Fundamentos', ref: 'Básico 2', title: 'Tests de hipótesis e intervalos de confianza',
  lead: 'Decisión estadística bajo incertidumbre: pruebas t, intervalos de confianza, intervalos de pronóstico y tamaño de muestra.',
  review: `<p>Un test contrasta H₀ contra H₁ usando un estadístico cuya distribución es conocida si H₀ es cierta. Se rechaza H₀ cuando el <b>p-valor</b> es menor que el nivel de significancia α (probabilidad de error tipo I).</p>
  <ul><li><b>t de una muestra:</b> t = (x̄ − μ₀)/(s/√n), con n−1 g.l.</li><li><b>t de Welch (varianzas distintas):</b> t = (x̄₁ − x̄₂)/√(s₁²/n₁ + s₂²/n₂), g.l. de Welch–Satterthwaite.</li><li><b>t pareada:</b> t de una muestra sobre las diferencias dᵢ.</li><li><b>IC para la media:</b> x̄ ± t₁₋α/₂ · s/√n.</li><li><b>Intervalo de pronóstico</b> para una nueva observación: x̄ ± t₁₋α/₂ · s·√(1 + 1/n). Es más ancho que el IC porque incluye la variabilidad individual.</li><li><b>Tamaño de efecto</b> d de Cohen = (x̄₁ − x̄₂)/sₚ.</li></ul>
  <p>Un p-valor pequeño indica evidencia contra H₀, no la magnitud del efecto: reporte siempre el intervalo y el tamaño de efecto.</p>`,
  code: `# Python\nfrom scipy import stats\nstats.ttest_1samp(x, popmean=100)\nstats.ttest_ind(a, b, equal_var=False)   # Welch\nstats.ttest_rel(antes, despues)\n# R\nt.test(x, mu = 100); t.test(a, b); t.test(antes, despues, paired = TRUE)`,
  build() {
    const form = Form('test', [
      { k: 'data', t: 'data', label: 'Datos', sample: SAMPLES.pares, rows: 6 },
      { k: 'kind', t: 'sel', label: 'Prueba', opts: [['one', 't de una muestra'], ['welch', 't de dos muestras independientes (Welch)'], ['pool', 't de dos muestras (varianzas iguales)'], ['pair', 't pareada']], val: 'pair' },
      { k: 'a', t: 'col', from: 'data', label: 'Variable A', def: 'first' }, { k: 'b', t: 'col', from: 'data', label: 'Variable B (si aplica)' },
      { k: 'mu', t: 'num', label: 'Valor de referencia μ₀', val: 50 }, { k: 'alt', t: 'sel', label: 'Hipótesis alternativa', opts: [['two', 'Distinta (bilateral)'], ['greater', 'Mayor'], ['less', 'Menor']] },
      { k: 'alpha', t: 'num', label: 'Nivel de significancia α', val: 0.05, min: 0.001, max: 0.5 }, { k: 'sd', t: 'num', label: 'Planificación: desviación esperada σ', val: 10 }, { k: 'delta', t: 'num', label: 'Planificación: diferencia a detectar δ', val: 4 }, { k: 'pow', t: 'num', label: 'Potencia deseada', val: 0.8, min: 0.5, max: 0.99 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), A = tb.cols.find(c => c.name === v.a), B = tb.cols.find(c => c.name === v.b); const a = A.v.filter(x => !isNaN(x)); let r, ic, lab, html = '', tcrit; const al = v.alpha;
        if (v.kind === 'one') { r = L.ttest1(a, v.mu, v.alt); tcrit = L.tppf(1 - al / 2, r.df); ic = [r.mean - tcrit * r.se, r.mean + tcrit * r.se]; lab = `μ de ${A.name}`; html += kpis([['Media muestral', r.mean], ['Error estándar', r.se], ['t', r.t], ['g.l.', r.df], ['p-valor', P(r.p)]]); }
        else if (v.kind === 'pair') { const d = []; for (let i = 0; i < tb.n; i++) if (!isNaN(A.v[i]) && !isNaN(B.v[i])) d.push(A.v[i] - B.v[i]); r = L.ttest1(d, 0, v.alt); tcrit = L.tppf(1 - al / 2, r.df); ic = [r.mean - tcrit * r.se, r.mean + tcrit * r.se]; lab = `diferencia media (${A.name} − ${B.name})`; html += kpis([['Diferencia media', r.mean], ['Desv. de diferencias', L.sd(d)], ['t', r.t], ['g.l.', r.df], ['p-valor', P(r.p)], ['d de Cohen', r.mean / L.sd(d)]]); }
        else { const b = B.v.filter(x => !isNaN(x)); r = L.ttest2(a, b, v.alt, v.kind === 'pool'); tcrit = L.tppf(1 - al / 2, r.df); ic = [r.diff - tcrit * r.se, r.diff + tcrit * r.se]; lab = `diferencia de medias (${A.name} − ${B.name})`; const ft = L.varFtest(a, b); html += kpis([['Media A', r.m1, `n = ${r.n1}`], ['Media B', r.m2, `n = ${r.n2}`], ['Diferencia', r.diff], ['t', r.t], ['g.l.', r.df], ['p-valor', P(r.p)], ['d de Cohen', r.d]]) + `<p class="small">Prueba F de igualdad de varianzas: F = ${F(ft.f, 3)}, p = ${P(ft.p)}.</p>`; }
        // curva t con región de rechazo
        const df = r.df, tc = tcrit, xs = [], ys = []; for (let i = 0; i <= 200; i++) { const x = -5 + 10 * i / 200; xs.push(x); ys.push(Math.exp(L.gammaln((df + 1) / 2) - L.gammaln(df / 2)) / Math.sqrt(df * Math.PI) * (1 + x * x / df) ** (-(df + 1) / 2)); }
        const svg = plot({ title: 'Distribución t bajo H₀', xlim: [-5, 5], ylim: [0, Math.max(...ys) * 1.15], xlab: 'Estadístico t', h: 280 }, a2 => { let rej = ''; const reg = (lo, hi) => { const px = [], py = []; xs.forEach((x, i) => { if (x >= lo && x <= hi) { px.push(x); py.push(ys[i]); } }); if (px.length) rej += `<polygon class="f4" fill-opacity=".35" points="${a2.sx(px[0])},${a2.sy(0)} ${px.map((x, i) => `${a2.sx(x)},${a2.sy(py[i])}`).join(' ')} ${a2.sx(px[px.length - 1])},${a2.sy(0)}"/>`; }; const tcAlt = v.alt === 'two' ? tc : L.tppf(1 - al, df); if (v.alt === 'two') { reg(-5, -tc); reg(tc, 5); } else if (v.alt === 'greater') reg(tcAlt, 5); else reg(-5, -tcAlt); return path(xs, ys, a2.sx, a2.sy, 1, 2) + rej + `<line class="ref" style="stroke:var(--c2)" x1="${a2.sx(Math.max(-5, Math.min(5, r.t)))}" x2="${a2.sx(Math.max(-5, Math.min(5, r.t)))}" y1="${a2.sy(0)}" y2="${a2.m.t}"/><text class="tx" x="${a2.sx(Math.max(-5, Math.min(5, r.t))) + 4}" y="${a2.m.t + 12}">t observado = ${F(r.t, 3)}</text>`; });
        html += fig(svg, 'Zona rosada: región de rechazo al nivel α. Línea vertical: valor observado.');
        const nA = a.length, mA = L.mean(a), sA = L.sd(a), tq = L.tppf(1 - al / 2, nA - 1);
        html += H4(`Intervalo de confianza del ${F((1 - al) * 100, 1)} %`) + `<p>${lab}: <b>[${F(ic[0], 4)} ; ${F(ic[1], 4)}]</b></p>`;
        html += H4(`Intervalo de pronóstico para ${A.name}`) + tbl(['Concepto', 'Límite inferior', 'Límite superior'], [['IC para la media', mA - tq * sA / Math.sqrt(nA), mA + tq * sA / Math.sqrt(nA)], ['Pronóstico de una nueva observación', mA - tq * sA * Math.sqrt(1 + 1 / nA), mA + tq * sA * Math.sqrt(1 + 1 / nA)]]);
        const zA = L.normppf(1 - al / 2), zB = L.normppf(v.pow), nPer = Math.ceil(2 * ((zA + zB) * v.sd / v.delta) ** 2), nOne = Math.ceil(((zA + zB) * v.sd / v.delta) ** 2);
        html += H4('Planificación del tamaño de muestra (aproximación normal)') + tbl(['Diseño', 'n requerido'], [['Una muestra / pareada', nOne], ['Dos muestras (por grupo)', nPer]]) + `<p class="small">Para detectar δ = ${F(v.delta)} con σ = ${F(v.sd)}, α = ${F(al, 3)} y potencia ${F(v.pow * 100, 0)} %.</p>`;
        html += interp(`<p>Con ${r.t === undefined ? '' : `t = ${F(r.t, 3)} y ${F(df, 1)} g.l.`} ${verdict(r.p, al)}. El intervalo de confianza para ${lab} es [${F(ic[0], 3)} ; ${F(ic[1], 3)}]${ic[0] > 0 || ic[1] < 0 ? ', que <b>no incluye el cero</b>' : ', que <b>incluye el cero</b>'}${v.kind === 'one' ? ` (se contrasta contra μ₀ = ${F(v.mu)})` : ''}. Un nuevo valor individual de ${esc(A.name)} caería, con ${F((1 - al) * 100, 0)} % de confianza, entre ${F(mA - tq * sA * Math.sqrt(1 + 1 / nA), 3)} y ${F(mA + tq * sA * Math.sqrt(1 + 1 / nA), 3)}.</p>`);
        out.innerHTML = html;
      }
    };
  }
});

reg({
  id: 'corr', group: 'Fundamentos', ref: 'Básico 3a', title: 'Correlación: Pearson, Spearman y Kendall',
  lead: 'Mide la asociación entre variables con tres coeficientes y sus pruebas de significancia.',
  review: `<p>La elección del coeficiente depende del tipo de relación y de los supuestos:</p>
  <ul><li><b>Pearson r</b> mide asociación <i>lineal</i>; supone variables continuas sin atípicos fuertes. Prueba: t = r√((n−2)/(1−r²)). IC por transformación de Fisher: tanh(atanh r ± z/√(n−3)).</li><li><b>Spearman ρ</b> es la correlación de Pearson sobre los rangos: detecta relaciones monótonas y resiste atípicos.</li><li><b>Kendall τ</b> cuenta pares concordantes y discordantes: τ = (C − D)/√((n₀−t_x)(n₀−t_y)); más robusto con muestras pequeñas y empates.</li></ul>
  <p>Correlación no implica causalidad; una correlación Pearson baja con Spearman alta indica relación no lineal pero monótona.</p>`,
  code: `# Python\nfrom scipy import stats\nstats.pearsonr(x, y); stats.spearmanr(x, y); stats.kendalltau(x, y)\ndf.corr(method="spearman")\n# R\ncor.test(x, y, method = "pearson")  # "spearman" | "kendall"`,
  build() {
    const form = Form('corr', [{ k: 'data', t: 'data', label: 'Datos', sample: SAMPLES.planta, rows: 7 }, { k: 'x', t: 'col', from: 'data', label: 'Variable X', def: 'produccion' }, { k: 'y', t: 'col', from: 'data', label: 'Variable Y', def: 'consumo_kwh' }, { k: 'm', t: 'sel', label: 'Método para la matriz', opts: [['p', 'Pearson'], ['s', 'Spearman'], ['k', 'Kendall']] }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), nums = tb.cols.filter(c => c.num), cx = nums.find(c => c.name === v.x), cy = nums.find(c => c.name === v.y), ok = []; for (let i = 0; i < tb.n; i++) if (!isNaN(cx.v[i]) && !isNaN(cy.v[i])) ok.push(i);
        const x = ok.map(i => cx.v[i]), y = ok.map(i => cy.v[i]), pe = L.pearsonTest(x, y), sp = L.spearmanTest(x, y), ke = L.kendallTest(x, y), m = L.ols(L.withIntercept(x.map(a => [a])), y);
        let html = tbl(['Coeficiente', 'Valor', 'p-valor', 'Lectura'], [['Pearson r', pe.r, P(pe.p), `IC 95 %: [${F(pe.lo, 3)} ; ${F(pe.hi, 3)}]`], ['Spearman ρ', sp.r, P(sp.p), 'Asociación monótona'], ['Kendall τ-b', ke.r, P(ke.p), `${ke.c} concordantes, ${ke.d} discordantes`]]);
        const xl = ext(x); html += fig(scatterSVG(x, y, { title: `${cy.name} vs ${cx.name}`, xlab: cx.name, ylab: cy.name, lines: [{ x: xl, y: xl.map(t => m.b[0] + m.b[1] * t), c: 2 }] }), `Recta de mínimos cuadrados: ŷ = ${F(m.b[0], 3)} + ${F(m.b[1], 3)}·x  (R² = ${F(m.r2, 3)}).`);
        const k = nums.length, fn = v.m === 'p' ? L.pearsonTest : v.m === 's' ? L.spearmanTest : L.kendallTest, M = nums.map(a => nums.map(b => { if (a === b) return 1; const idx = []; for (let i = 0; i < tb.n; i++) if (!isNaN(a.v[i]) && !isNaN(b.v[i])) idx.push(i); return fn(idx.map(i => a.v[i]), idx.map(i => b.v[i])).r; }));
        html += H4(`Matriz de correlación (${{ p: 'Pearson', s: 'Spearman', k: 'Kendall' }[v.m]})`) + fig(heatSVG(M, nums.map(c => c.name), nums.map(c => c.name)));
        const mag = a => { a = Math.abs(a); return a < .2 ? 'muy débil' : a < .4 ? 'débil' : a < .6 ? 'moderada' : a < .8 ? 'fuerte' : 'muy fuerte'; };
        html += interp(`<p>Entre <b>${esc(cx.name)}</b> y <b>${esc(cy.name)}</b> existe una asociación ${pe.r > 0 ? 'positiva' : 'negativa'} ${mag(pe.r)} (Pearson r = ${F(pe.r, 3)}; ${pe.p < 0.05 ? 'estadísticamente significativa' : 'no significativa'} al 5 %). ${Math.abs(sp.r) - Math.abs(pe.r) > 0.1 ? 'Spearman supera claramente a Pearson: la relación es monótona pero no lineal, o hay atípicos que afectan a r.' : 'Pearson y Spearman son similares: la relación es esencialmente lineal.'} El coeficiente de determinación simple es R² = ${F(pe.r ** 2, 3)}.</p>`);
        out.innerHTML = html;
      }
    };
  }
});

reg({
  id: 'slr', group: 'Fundamentos', ref: 'Básico 3b', title: 'Regresión lineal simple y normalidad',
  lead: 'Ajuste por mínimos cuadrados con una variable explicativa, bondad de ajuste, residuos y test de normalidad.',
  review: `<p>Modelo: yᵢ = β₀ + β₁xᵢ + εᵢ, con εᵢ ~ N(0, σ²). Estimadores MCO: β̂₁ = S_xy/S_xx, β̂₀ = ȳ − β̂₁x̄.</p>
  <ul><li><b>Bondad de ajuste:</b> R² = 1 − SCR/SCT; error estándar residual σ̂ = √(SCR/(n−2)); prueba F = CMR/CME (equivale a t² del coeficiente).</li><li><b>Intervalos en x₀:</b> para la <i>media</i> ŷ₀ ± t·σ̂√(1/n + (x₀−x̄)²/S_xx); para una <i>nueva observación</i> se suma 1 dentro de la raíz.</li><li><b>Normalidad de residuos:</b> gráfico Q–Q y prueba de Jarque–Bera: JB = n/6·(g₁² + g₂²/4) ~ χ²(2).</li><li><b>Diagnóstico:</b> el gráfico residuos vs ajustados no debe mostrar patrón ni embudo.</li></ul>`,
  code: `# Python\nimport statsmodels.api as sm\nm = sm.OLS(y, sm.add_constant(x)).fit(); print(m.summary())\nfrom scipy.stats import jarque_bera; jarque_bera(m.resid)\n# R\nm <- lm(y ~ x); summary(m); plot(m)`,
  build() {
    const form = Form('slr', [{ k: 'data', t: 'data', label: 'Datos', sample: SAMPLES.simple, rows: 6 }, { k: 'x', t: 'col', from: 'data', label: 'Variable explicativa X', def: 'first' }, { k: 'y', t: 'col', from: 'data', label: 'Variable respuesta Y' }, { k: 'x0', t: 'num', label: 'Valor x₀ para pronosticar', val: 30 }, { k: 'conf', t: 'num', label: 'Nivel de confianza', val: 0.95, min: 0.5, max: 0.999 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), D = design(tb, v.y, [v.x]), m = olsFit(D), x = D.X.map(r => r[0]), n = D.n, xm = L.mean(x), sxx = L.sum(x.map(t => (t - xm) ** 2)), tq = L.tppf(0.5 + v.conf / 2, m.df);
        const band = (t, pred) => m.sigma * Math.sqrt((pred ? 1 : 0) + 1 / n + (t - xm) ** 2 / sxx) * tq, xl = ext(x, .02), gx = Array.from({ length: 60 }, (_, i) => xl[0] + (xl[1] - xl[0]) * i / 59), fx = gx.map(t => m.b[0] + m.b[1] * t);
        const svg = plot({ title: `Ajuste: ${v.y} ~ ${v.x}`, xlab: v.x, ylab: v.y, xlim: xl, ylim: ext(D.y), legend: [{ name: 'Ajuste', c: 2 }, { name: 'Banda de pronóstico', c: 3 }] }, a => `<polygon class="f3" fill-opacity=".12" points="${gx.map((t, i) => `${a.sx(t)},${a.sy(fx[i] + band(t, true))}`).join(' ')} ${gx.map((t, i) => [a.sx(t), a.sy(fx[i] - band(t, true))]).reverse().map(p => p.join(',')).join(' ')}"/><polygon class="f2" fill-opacity=".2" points="${gx.map((t, i) => `${a.sx(t)},${a.sy(fx[i] + band(t, false))}`).join(' ')} ${gx.map((t, i) => [a.sx(t), a.sy(fx[i] - band(t, false))]).reverse().map(p => p.join(',')).join(' ')}"/>` + path(gx, fx, a.sx, a.sy, 2, 2.2) + dots(x.map((t, i) => ({ x: t, y: D.y[i] })), a.sx, a.sy));
        const jb = L.describe(m.res), jbp = L.chi2sf(jb.jb, 2), y0 = m.b[0] + m.b[1] * v.x0;
        let html = fitStats(m) + H4('Coeficientes') + coefTable(m, [v.x], v.conf) + H4('Tabla ANOVA de la regresión') + tbl(['Fuente', 'g.l.', 'Suma de cuadrados', 'Cuadrado medio', 'F', 'p-valor'], [['Regresión', 1, m.tss - m.rss, m.tss - m.rss, m.F, P(m.pF)], ['Residual', m.df, m.rss, m.s2, '', ''], ['Total', n - 1, m.tss, '', '', '']]);
        html += fig(svg, 'Banda interior: intervalo de confianza de la media. Banda exterior: intervalo de pronóstico de una observación nueva.') + `<div class="grid2">${fig(resPlot(m.fit, m.res, 'Residuos vs ajustados'))}${fig(qqSVG(m.res, 'Gráfico Q–Q de los residuos'))}</div>`;
        html += H4('Pronóstico en x₀') + tbl(['x₀', 'Pronóstico ŷ₀', `IC media ${F(v.conf * 100, 0)} %`, `Intervalo de pronóstico ${F(v.conf * 100, 0)} %`], [[v.x0, y0, `[${F(y0 - band(v.x0, false), 3)} ; ${F(y0 + band(v.x0, false), 3)}]`, `[${F(y0 - band(v.x0, true), 3)} ; ${F(y0 + band(v.x0, true), 3)}]`]]);
        html += H4('Normalidad de los residuos') + `<p>Jarque–Bera = ${F(jb.jb, 3)} (asimetría ${F(jb.skew, 2)}, curtosis exceso ${F(jb.kurt, 2)}); p = ${P(jbp)} → ${jbp < 0.05 ? '<b class="bad">se rechaza normalidad</b>' : '<b class="good">no se rechaza normalidad</b>'}.</p>`;
        html += interp(`<p>Por cada unidad adicional de <b>${esc(v.x)}</b>, ${esc(v.y)} varía en promedio <b>${F(m.b[1], 3)}</b> unidades (IC ${F(v.conf * 100, 0)} %: ${F(m.b[1] - tq * m.se[1], 3)} a ${F(m.b[1] + tq * m.se[1], 3)}; p ${P(m.p[1])}). El modelo explica el ${F(m.r2 * 100, 1)} % de la variabilidad. ${jbp < 0.05 ? 'Los residuos se alejan de la normalidad: los intervalos deben interpretarse con cautela.' : 'Los residuos son compatibles con normalidad, por lo que los intervalos son confiables.'}</p>`);
        out.innerHTML = html;
      }
    };
  }
});

reg({
  id: 'anova', group: 'Fundamentos', ref: 'Básico 3c', title: 'ANOVA de uno y dos factores',
  lead: 'Compara medias entre grupos, calcula la razón de correlación η² y las comparaciones múltiples de Tukey.',
  review: `<p>El análisis de varianza descompone la variabilidad total: SCT = SCE (entre grupos) + SCD (dentro). Con k grupos y N observaciones:</p>
  <ul><li><b>Una vía:</b> F = [SCE/(k−1)] / [SCD/(N−k)] ~ F(k−1, N−k) bajo H₀: todas las medias iguales.</li><li><b>Razón de correlación:</b> η² = SCE/SCT, proporción de variabilidad explicada por el factor (ω² corrige el sesgo).</li><li><b>Dos vías:</b> efectos principales A y B e interacción A×B, calculados por sumas de cuadrados secuenciales (tipo I; coinciden con tipo III en diseños balanceados).</li><li><b>Supuestos:</b> normalidad de residuos, independencia y homogeneidad de varianzas (Levene/Brown–Forsythe).</li><li><b>Tukey HSD:</b> compara todos los pares controlando el error global: |x̄ᵢ − x̄ⱼ| > q·√(CMD/2·(1/nᵢ+1/nⱼ)).</li></ul>`,
  code: `# Python\nimport statsmodels.api as sm, statsmodels.formula.api as smf\nm = smf.ols("y ~ C(a) * C(b)", df).fit(); sm.stats.anova_lm(m, typ=2)\nfrom statsmodels.stats.multicomp import pairwise_tukeyhsd\n# R\nsummary(aov(y ~ a * b)); TukeyHSD(aov(y ~ a))`,
  build() {
    const form = Form('anova', [{ k: 'mode', t: 'sel', label: 'Diseño', opts: [['one', 'Una vía'], ['two', 'Dos vías con interacción']], val: 'one' }, { k: 'data', t: 'data', label: 'Datos en formato largo (una fila por observación)', sample: SAMPLES.anova1, rows: 7, hint: 'Una vía: grupo,valor. Dos vías: factorA,factorB,valor.' }, { k: 'f1', t: 'col', from: 'data', any: true, label: 'Factor A (grupo)', def: 'first' }, { k: 'f2', t: 'col', from: 'data', any: true, label: 'Factor B (solo dos vías)', def: 'first' }, { k: 'y', t: 'col', from: 'data', label: 'Variable respuesta' }]);
    const ex = h('div', { class: 'row' }, h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { const t = $('#anova-data'); t.value = SAMPLES.anova2(); t.dispatchEvent(new Event('input')); $('#anova-mode').value = 'two'; setTimeout(() => { $('#anova-f1').value = 'turno'; $('#anova-f2').value = 'linea'; $('#anova-y').value = 'unidades'; }, 400); } }, 'Cargar ejemplo de dos vías'));
    return {
      form, extra: [ex], run(out, v) {
        const tb = L.parseTable(v.data), yc = tb.cols.find(c => c.name === v.y), f1 = tb.cols.find(c => c.name === v.f1); let html = '';
        if (v.mode === 'one') {
          const lv = [...new Set(f1.raw)].filter(Boolean).sort(), gs = lv.map(l => f1.raw.map((r, i) => r === l ? yc.v[i] : null).filter(x => x !== null && !isNaN(x))), a = L.anova1(gs);
          html += kpis([['F', a.F, `${a.dfb} y ${a.dfw} g.l.`], ['p-valor', P(a.p)], ['η² (razón de correlación)', a.eta2], ['ω²', a.omega2], ['Levene (B–F)', P(a.levene.p), 'p-valor']]);
          html += H4('Tabla ANOVA') + tbl(['Fuente', 'g.l.', 'Suma de cuadrados', 'Cuadrado medio', 'F', 'p-valor'], [['Entre grupos', a.dfb, a.ssb, a.msb, a.F, P(a.p)], ['Dentro de grupos', a.dfw, a.ssw, a.msw, '', ''], ['Total', a.N - 1, a.ssb + a.ssw, '', '', '']]);
          html += H4('Estadísticos por grupo') + tbl(['Grupo', 'n', 'Media', 'Desv. est.', 'IC 95 % de la media'], lv.map((l, i) => { const g = a.info[i], t = L.tppf(.975, g.n - 1) * g.sd / Math.sqrt(g.n); return [esc(l), g.n, g.mean, g.sd, `[${F(g.mean - t, 3)} ; ${F(g.mean + t, 3)}]`]; }));
          html += fig(boxSVG(gs, lv, { title: `${v.y} por ${v.f1}`, ylab: v.y }));
          if (a.k > 2) { const q = L.qtukey(.95, a.k, a.dfw); const rows = []; for (let i = 0; i < a.k; i++) for (let j = i + 1; j < a.k; j++) { const d = a.info[i].mean - a.info[j].mean, hsd = q * Math.sqrt(a.msw / 2 * (1 / a.info[i].n + 1 / a.info[j].n)); rows.push({ cells: [`${esc(lv[i])} − ${esc(lv[j])}`, d, `[${F(d - hsd, 3)} ; ${F(d + hsd, 3)}]`, Math.abs(d) > hsd ? '<b class="bad">Diferencia significativa</b>' : 'No significativa'] }); } html += H4(`Comparaciones múltiples de Tukey (q = ${F(q, 3)})`) + tbl(['Par', 'Diferencia', 'IC 95 % simultáneo', 'Decisión'], rows); }
          html += interp(`<p>El factor <b>${esc(v.f1)}</b> ${a.p < 0.05 ? 'tiene efecto significativo' : 'no tiene efecto significativo'} sobre ${esc(v.y)} (F(${a.dfb}, ${a.dfw}) = ${F(a.F, 3)}; p = ${P(a.p)}). Explica el ${F(a.eta2 * 100, 1)} % de la variabilidad (η²). ${a.levene.p < 0.05 ? 'La prueba de Levene sugiere varianzas desiguales: considere ANOVA de Welch.' : 'La homogeneidad de varianzas es aceptable.'}</p>`);
        } else {
          const f2 = tb.cols.find(c => c.name === v.f2), keep = []; for (let i = 0; i < tb.n; i++) if (!isNaN(yc.v[i]) && f1.raw[i] !== '' && f2.raw[i] !== '') keep.push(i);
          const y = keep.map(i => yc.v[i]), la = [...new Set(keep.map(i => f1.raw[i]))].sort(), lb = [...new Set(keep.map(i => f2.raw[i]))].sort(), dum = (col, lv) => keep.map(i => lv.slice(1).map(l => col.raw[i] === l ? 1 : 0));
          const A = dum(f1, la), B = dum(f2, lb), AB = A.map((ra, i) => ra.flatMap(x => B[i].map(z => x * z))), rss = X => L.ols(X, y).rss, ones = y.map(() => [1]);
          const cat = (...parts) => ones.map((o, i) => [1, ...parts.flatMap(p => p[i])]), r0 = L.sum(y.map(t => (t - L.mean(y)) ** 2)), rA = rss(cat(A)), rAB_ = rss(cat(A, B)), rF = rss(cat(A, B, AB)), N = y.length;
          const dfA = la.length - 1, dfB = lb.length - 1, dfI = dfA * dfB, dfE = N - la.length * lb.length, msE = rF / dfE; const rows = [['A: ' + esc(v.f1), dfA, r0 - rA, (r0 - rA) / dfA], ['B: ' + esc(v.f2), dfB, rA - rAB_, (rA - rAB_) / dfB], ['Interacción A×B', dfI, rAB_ - rF, (rAB_ - rF) / dfI]].map(r => { const F_ = r[3] / msE, p = L.fsf(F_, r[1], dfE); return { cells: [r[0], r[1], r[2], r[3], F_, P(p), sig(p)], p }; });
          html += H4('Tabla ANOVA de dos vías') + tbl(['Fuente', 'g.l.', 'Suma de cuadrados', 'Cuadrado medio', 'F', 'p-valor', ''], [...rows.map(r => r.cells), ['Residual', dfE, rF, msE, '', '', ''], ['Total', N - 1, r0, '', '', '', '']]);
          const means = la.map(a => lb.map(b => { const g = keep.filter(i => f1.raw[i] === a && f2.raw[i] === b).map(i => yc.v[i]); return g.length ? L.mean(g) : NaN; }));
          html += H4('Medias por celda') + tbl([esc(v.f1) + ' \\ ' + esc(v.f2), ...lb.map(esc)], la.map((a, i) => [esc(a), ...means[i]]));
          const allm = means.flat(); html += fig(lineSVG(lb.map((b, j) => ({ name: b, x: la.map((_, i) => i), y: la.map((_, i) => means[i][j]), dots: true })), { title: 'Gráfico de interacción', xlab: `${v.f1} (${la.join(' · ')})`, ylab: `Media de ${v.y}`, xticks: la.map((_, i) => i), xfmt: i => la[i] || '', xlim: [-0.2, la.length - 0.8], ylim: ext(allm, .15) }), 'Rectas no paralelas indican interacción.');
          const sg = rows.filter(r => r.p < 0.05).map(r => r.cells[0]);
          html += interp(`<p>${sg.length ? `Son significativos al 5 %: ${sg.join(', ')}.` : 'Ningún término resulta significativo al 5 %.'} ${rows[2].p < 0.05 ? 'Existe <b>interacción</b>: el efecto de un factor depende del nivel del otro, por lo que los efectos principales deben interpretarse con cuidado (revise el gráfico de interacción).' : 'No hay evidencia de interacción: los efectos de los factores son aditivos.'}</p>`);
        }
        out.innerHTML = html;
      }
    };
  }
});

reg({
  id: 'pca', group: 'Fundamentos', ref: 'Básico 4', title: 'Análisis de componentes principales (ACP)',
  lead: 'Reduce la dimensión conservando la mayor varianza posible y revela la estructura de las variables.',
  review: `<p>El ACP busca combinaciones lineales ortogonales de las variables, Zₖ = Xv_k, que maximizan la varianza. Los vectores v_k son los <b>vectores propios</b> de la matriz de covarianzas (o de correlaciones si se estandariza) y los <b>valores propios</b> λ_k son las varianzas de cada componente.</p>
  <ul><li><b>Varianza explicada:</b> λ_k/Σλ. Se retienen componentes según el criterio de Kaiser (λ &gt; 1 con variables estandarizadas), el gráfico de sedimentación o un 80–90 % acumulado.</li><li><b>Cargas</b> (loadings): peso de cada variable en el componente; las variables con cargas altas definen su significado.</li><li><b>Estandarice</b> cuando las variables tienen escalas distintas.</li></ul>`,
  code: `# Python\nfrom sklearn.decomposition import PCA\nfrom sklearn.preprocessing import StandardScaler\nZ = StandardScaler().fit_transform(X); p = PCA().fit(Z); p.explained_variance_ratio_\n# R\nprcomp(X, scale. = TRUE); summary(prcomp(X, scale. = TRUE))`,
  build() {
    const form = Form('pca', [{ k: 'data', t: 'data', label: 'Datos numéricos', sample: SAMPLES.multi, rows: 7 }, { k: 'cols', t: 'cols', from: 'data', label: 'Variables incluidas' }, { k: 'sc', t: 'check', label: 'Estandarizar (usar matriz de correlaciones)', val: true }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), cs = v.cols.map(n => tb.cols.find(c => c.name === n)).filter(c => c && c.num); if (cs.length < 2) throw new Error('Seleccione al menos dos variables numéricas.');
        const rows = []; for (let i = 0; i < tb.n; i++) if (cs.every(c => !isNaN(c.v[i]))) rows.push(cs.map(c => c.v[i])); const pc = L.pca(rows, v.sc), p = cs.length, kaiser = pc.values.filter(l => l > 1).length;
        let html = kpis([['Observaciones', rows.length], ['Variables', p], ['PC con λ > 1 (Kaiser)', v.sc ? kaiser : '—'], ['Varianza en PC1+PC2', `${F((pc.cum[Math.min(1, p - 1)]) * 100, 1)} %`]]);
        html += H4('Valores propios y varianza explicada') + tbl(['Componente', 'Valor propio', '% varianza', '% acumulado'], pc.values.map((l, i) => [`PC${i + 1}`, l, F(pc.ratio[i] * 100, 2), F(pc.cum[i] * 100, 2)]));
        html += fig(barSVG(pc.values.map((_, i) => `PC${i + 1}`), pc.values, { title: 'Gráfico de sedimentación', ylab: 'Valor propio', hline: v.sc ? [{ y: 1, t: 'λ = 1 (Kaiser)' }] : [] }));
        html += H4('Cargas de las variables') + tbl(['Variable', ...pc.vecs.slice(0, Math.min(4, p)).map((_, i) => `PC${i + 1}`)], cs.map((c, j) => [esc(c.name), ...pc.vecs.slice(0, Math.min(4, p)).map(vv => vv[j])]));
        const sx = pc.scores.map(s => s[0]), sy = pc.scores.map(s => s[1]), xl = ext(sx, .1), yl = ext(sy, .1), scl = Math.min(xl[1] - xl[0], yl[1] - yl[0]) * .4;

const regForm = (mod, sample = SAMPLES.planta, y = 'consumo_kwh') => Form(mod, [{ k: 'data', t: 'data', label: 'Datos', sample, rows: 7 }, { k: 'y', t: 'col', from: 'data', label: 'Variable respuesta', def: y }, { k: 'x', t: 'cols', from: 'data', any: true, label: 'Variables explicativas (las no numéricas se codifican como indicadoras)' }]);

reg({
  id: 'mlr', group: 'Modelos lineales', ref: 'Avanzado 1a', title: 'Regresión lineal múltiple y predicción',
  lead: 'Estimación MCO con varias variables, variables categóricas, diagnóstico de bondad y predicción para casos reales o hipotéticos.',
  review: `<p>Modelo: y = Xβ + ε, con estimador MCO β̂ = (XᵀX)⁻¹Xᵀy y Var(β̂) = σ̂²(XᵀX)⁻¹.</p>
  <ul><li><b>Prueba t</b> de cada coeficiente (H₀: βⱼ = 0) y <b>prueba F</b> global (H₀: todos los βⱼ = 0 salvo el intercepto).</li><li><b>R² ajustado</b> penaliza variables inútiles: 1 − (1−R²)(n−1)/(n−k).</li><li><b>Variables categóricas:</b> con m categorías se crean m−1 indicadoras; cada coeficiente mide la diferencia respecto de la categoría de referencia (la primera en orden alfabético).</li><li><b>Predicción:</b> para un <i>individuo hipotético</i> x₀ se calcula ŷ₀ = x₀ᵀβ̂; el intervalo de la media usa σ̂√(x₀ᵀ(XᵀX)⁻¹x₀) y el de una observación nueva σ̂√(1 + x₀ᵀ(XᵀX)⁻¹x₀). Para un <i>individuo real</i> se usa su fila en la base.</li><li><b>Multicolinealidad:</b> VIFⱼ = 1/(1−Rⱼ²); valores sobre 5–10 son preocupantes.</li></ul>`,
  code: `# Python\nimport statsmodels.formula.api as smf\nm = smf.ols("consumo_kwh ~ produccion + temperatura + C(turno)", df).fit(); print(m.summary())\nm.get_prediction(nuevo).summary_frame(alpha=0.05)\n# R\nm <- lm(consumo_kwh ~ ., data = df); summary(m); predict(m, nuevo, interval = "prediction")`,
  build() {
    const form = Form('mlr', [{ k: 'data', t: 'data', label: 'Datos', sample: SAMPLES.planta, rows: 7 }, { k: 'y', t: 'col', from: 'data', label: 'Variable respuesta', def: 'consumo_kwh' }, { k: 'x', t: 'cols', from: 'data', any: true, label: 'Variables explicativas (las no numéricas se codifican como indicadoras)' }, { k: 'hyp', t: 'text', label: 'Individuo hipotético (nombre=valor, separado por comas)', val: 'produccion=80, temperatura=25, horas_op=18, mantenciones=1, turno=noche', hint: 'Para categóricas escriba el nivel.' }, { k: 'real', t: 'num', label: 'Individuo real: n.º de fila', val: 5, min: 1 }, { k: 'conf', t: 'num', label: 'Nivel de confianza', val: 0.95, min: 0.5, max: 0.999 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), D = design(tb, v.y, v.x), m = olsFit(D), k = m.k, tq = L.tppf(.5 + v.conf / 2, m.df);
        const vif = D.X[0].length > 1 ? D.names.map((_, j) => { const others = D.X.map(r => r.filter((_, c) => c !== j)); const mm = L.ols(L.withIntercept(others), D.X.map(r => r[j])); return 1 / (1 - mm.r2); }) : [];
        let html = kpis([['Observaciones', D.n, D.dropped ? `${D.dropped} excluidas por vacíos` : '']]) + fitStats(m) + H4('Coeficientes estimados') + coefTable(m, D.names, v.conf);
        if (vif.length) html += H4('Factores de inflación de la varianza (VIF)') + tbl(['Variable', 'VIF', 'Diagnóstico'], D.names.map((n, j) => [esc(n), vif[j], vif[j] > 10 ? '<b class="bad">Colinealidad severa</b>' : vif[j] > 5 ? '<b class="warn">Colinealidad moderada</b>' : 'Aceptable']));
        html += `<div class="grid2">${fig(scatterSVG(m.fit, D.y, { title: 'Observado vs ajustado', xlab: 'Ajustado', ylab: 'Observado', h: 300, lines: [{ x: ext(m.fit), y: ext(m.fit), c: 2, dash: '5 4' }] }))}${fig(resPlot(m.fit, m.res, 'Residuos vs ajustados'))}</div>`;
        const predRow = (x, lab) => { const xr = [1, ...x], yh = xr.reduce((s, a, j) => s + a * m.b[j], 0), q = L.M.mulv(m.XtXi, xr).reduce((s, a, j) => s + a * xr[j], 0), sm = m.sigma * Math.sqrt(q) * tq, sp = m.sigma * Math.sqrt(1 + q) * tq; return [lab, yh, `[${F(yh - sm, 3)} ; ${F(yh + sm, 3)}]`, `[${F(yh - sp, 3)} ; ${F(yh + sp, 3)}]`]; };
        const prow = []; try {
          const kv = Object.fromEntries(v.hyp.split(',').map(s => s.split('=').map(t => t.trim())).filter(a => a.length === 2)), xh = []; D.xs.forEach(c => { if (c.num) xh.push(num(kv[c.name] ?? L.mean(c.v.filter(x => !isNaN(x))))); else { const lv = [...new Set(c.raw)].filter(Boolean).sort(); lv.slice(1).forEach(l => xh.push((kv[c.name] ?? lv[0]) === l ? 1 : 0)); } });
          prow.push(predRow(xh, 'Individuo hipotético'));
        } catch (e) { }
        const ri = Math.min(Math.max(1, Math.round(v.real)), D.n) - 1; prow.push(predRow(D.X[ri], `Individuo real (fila ${ri + 1})`).concat([])); prow[prow.length - 1][1] = prow[prow.length - 1][1];
        html += H4('Predicciones') + tbl(['Caso', 'Pronóstico', `IC de la media ${F(v.conf * 100, 0)} %`, `Intervalo de pronóstico ${F(v.conf * 100, 0)} %`], prow) + `<p class="small">Fila ${ri + 1}: valor observado = ${F(D.y[ri], 3)}; residuo = ${F(m.res[ri], 3)}.</p>`;
        const sigv = D.names.filter((_, j) => m.p[j + 1] < 0.05);
        html += interp(`<p>El modelo es ${m.pF < 0.05 ? '<b>globalmente significativo</b>' : 'no significativo'} (F = ${F(m.F, 2)}; p ${P(m.pF)}) y explica el ${F(m.r2 * 100, 1)} % de la variabilidad de <b>${esc(v.y)}</b> (R² ajustado ${F(m.adj, 3)}). Con error típico de ${F(m.sigma, 3)}, ${sigv.length ? `son significativas al 5 %: ${sigv.map(esc).join(', ')}.` : 'ninguna variable explicativa es significativa al 5 %.'} ${vif.some(x => x > 10) ? 'Existen variables con VIF superior a 10: revise la sección de colinealidad y regularización.' : ''}</p>`);
        out.innerHTML = html;
      }
    };
  }
});

reg({
  id: 'sel', group: 'Modelos lineales', ref: 'Avanzado 1b', title: 'Selección de variables',
  lead: 'Elige el subconjunto de variables con criterios de información y algoritmos forward, backward y stepwise.',
  review: `<p>Más variables siempre reducen el error de entrenamiento, pero no necesariamente el de predicción. Los criterios de información penalizan la complejidad:</p>
  <ul><li><b>AIC</b> = n·ln(SCR/n) + 2p &nbsp;·&nbsp; <b>BIC</b> = n·ln(SCR/n) + p·ln n (más exigente) &nbsp;·&nbsp; <b>Cp de Mallows</b> = SCR_p/σ̂²_completo − n + 2p.</li><li><b>Forward:</b> parte sin variables y agrega la que más mejora el criterio. <b>Backward:</b> parte del modelo completo y elimina la menos útil. <b>Stepwise:</b> combina ambos movimientos.</li><li><b>Mejor subconjunto:</b> evalúa las 2ᵖ combinaciones (viable hasta unas 12 variables).</li></ul>
  <p>Estos procedimientos son voraces: no garantizan el óptimo global y los p-valores posteriores quedan optimistas. Valide con datos nuevos.</p>`,
  code: `# Python\nfrom mlxtend.feature_selection import SequentialFeatureSelector as SFS\n# R\nstep(lm(y ~ ., df), direction = "both", k = log(nrow(df)))  # BIC`,
  build() {
    const form = Form('sel', [{ k: 'data', t: 'data', label: 'Datos', sample: SAMPLES.planta, rows: 7 }, { k: 'y', t: 'col', from: 'data', label: 'Variable respuesta', def: 'consumo_kwh' }, { k: 'x', t: 'cols', from: 'data', label: 'Candidatas (numéricas)' }, { k: 'crit', t: 'sel', label: 'Criterio', opts: [['aic', 'AIC'], ['bic', 'BIC']] }, { k: 'dir', t: 'sel', label: 'Algoritmo', opts: [['both', 'Stepwise (ambos sentidos)'], ['forward', 'Forward'], ['backward', 'Backward']] }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), D = design(tb, v.y, v.x), p = D.names.length, n = D.n, pen = v.crit === 'aic' ? 2 : Math.log(n);
        const crit = set => { if (!set.length) { const rss = L.sum(D.y.map(t => (t - L.mean(D.y)) ** 2)); return n * Math.log(rss / n) + pen * 1; } const X = D.X.map(r => set.map(j => r[j])); const m = L.ols(L.withIntercept(X), D.y); return n * Math.log(m.rss / n) + pen * (set.length + 1); };
        let cur = v.dir === 'backward' ? [...Array(p).keys()] : [], best = crit(cur); const steps = [{ act: 'Inicio', set: cur.slice(), c: best }];
        for (let it = 0; it < 4 * p; it++) {
          let cand = null; if (v.dir !== 'backward') for (let j = 0; j < p; j++) if (!cur.includes(j)) { const s = [...cur, j], c = crit(s); if (c < best - 1e-9 && (!cand || c < cand.c)) cand = { act: `+ ${D.names[j]}`, set: s, c }; }
          if (v.dir !== 'forward') for (const j of cur) { const s = cur.filter(t => t !== j), c = crit(s); if (c < best - 1e-9 && (!cand || c < cand.c)) cand = { act: `− ${D.names[j]}`, set: s, c }; }
          if (!cand) break; cur = cand.set; best = cand.c; steps.push(cand);
        }
        const fin = L.ols(L.withIntercept(D.X.map(r => cur.map(j => r[j]))), D.y); let html = H4('Trayectoria del algoritmo') + tbl(['Paso', 'Movimiento', 'Variables en el modelo', v.crit.toUpperCase()], steps.map((s, i) => [i, esc(s.act), esc(s.set.map(j => D.names[j]).join(', ') || '(solo intercepto)'), s.c]));
        html += H4('Modelo final') + kpis([['Variables', cur.length], ['R²', fin.r2], ['R² ajustado', fin.adj], [v.crit.toUpperCase(), best]]) + coefTable(fin, cur.map(j => D.names[j]));
        if (p <= 11) { const all = []; for (let mask = 1; mask < (1 << p); mask++) { const s = []; for (let j = 0; j < p; j++) if (mask >> j & 1) s.push(j); const m = L.ols(L.withIntercept(D.X.map(r => s.map(j => r[j]))), D.y); all.push({ s, rss: m.rss, r2a: m.adj, bic: n * Math.log(m.rss / n) + Math.log(n) * (s.length + 1), aic: n * Math.log(m.rss / n) + 2 * (s.length + 1), k: s.length }); } const full = all.find(a => a.k === p), s2 = full.rss / (n - p - 1); all.forEach(a => a.cp = a.rss / s2 - n + 2 * (a.k + 1)); all.sort((a, b) => a[v.crit] - b[v.crit]);
          html += H4(`Mejor subconjunto: 8 mejores de ${all.length} modelos`) + tbl(['Variables', 'k', 'R² ajust.', 'AIC', 'BIC', 'Cp'], all.slice(0, 8).map(a => [esc(a.s.map(j => D.names[j]).join(', ')), a.k, a.r2a, a.aic, a.bic, a.cp])); const bk = []; for (let k = 1; k <= p; k++) { const b = all.filter(a => a.k === k).sort((x, y) => x.bic - y.bic)[0]; bk.push(b.bic); } html += fig(lineSVG([{ name: 'BIC del mejor modelo de tamaño k', x: bk.map((_, i) => i + 1), y: bk, dots: true }], { title: 'BIC según el número de variables', xlab: 'Número de variables', ylab: 'BIC', xticks: bk.map((_, i) => i + 1) }));
        }
        const dropped = D.names.filter((_, j) => !cur.includes(j));
        html += interp(`<p>El algoritmo <b>${v.dir}</b> con criterio ${v.crit.toUpperCase()} retiene ${cur.length} de ${p} variables: <b>${esc(cur.map(j => D.names[j]).join(', ') || 'ninguna')}</b>.${dropped.length ? ` Se descartan ${esc(dropped.join(', '))}, que no mejoran el equilibrio entre ajuste y complejidad.` : ''} El modelo reducido logra R² ajustado = ${F(fin.adj, 3)}.</p>`);
        out.innerHTML = html;
      }
    };
  }
});

reg({
  id: 'reg', group: 'Modelos lineales', ref: 'Avanzado 1c', title: 'Colinealidad: Ridge, LASSO, PCR y PLS',
  lead: 'Compara regresión Ridge, LASSO, LASSO por grupos, regresión por componentes principales y PLS con validación cruzada.',
  review: `<p>Cuando las variables están muy correlacionadas, MCO tiene varianza alta. Las soluciones sacrifican algo de sesgo para reducir la varianza:</p>
  <ul><li><b>Ridge:</b> minimiza SCR + λΣβⱼ². Encoge los coeficientes sin anularlos; β̂ = (XᵀX + λI)⁻¹Xᵀy.</li><li><b>LASSO:</b> minimiza SCR + λΣ|βⱼ|. Lleva algunos coeficientes exactamente a cero (selección automática). Se resuelve por descenso de coordenadas.</li><li><b>LASSO por grupo:</b> penaliza la norma ‖β_g‖₂ de cada grupo, de modo que el grupo entra o sale completo (útil para variables indicadoras de una misma categórica).</li><li><b>PCR:</b> regresión sobre los k primeros componentes principales. <b>PLS:</b> componentes que maximizan la covarianza con y.</li><li>El parámetro (λ o k) se elige por <b>validación cruzada</b> k-fold; la regla de 1 error estándar prefiere el modelo más simple dentro de un error estándar del óptimo.</li></ul>`,
  code: `# Python\nfrom sklearn.linear_model import RidgeCV, LassoCV\nfrom sklearn.cross_decomposition import PLSRegression\nLassoCV(cv=5).fit(Z, y)\n# R\nlibrary(glmnet); cv.glmnet(X, y, alpha = 0)  # ridge;  alpha = 1 LASSO\nlibrary(grpreg); library(pls); pcr(y ~ ., ncomp = 4, validation = "CV")`,
  build() {
    const form = Form('reg', [{ k: 'data', t: 'data', label: 'Datos', sample: SAMPLES.colin, rows: 7 }, { k: 'y', t: 'col', from: 'data', label: 'Variable respuesta', def: 'consumo_kwh' }, { k: 'x', t: 'cols', from: 'data', label: 'Variables explicativas' }, { k: 'folds', t: 'num', label: 'Pliegues de validación cruzada', val: 5, min: 3, max: 10 }, { k: 'ncomp', t: 'num', label: 'Componentes para PCR / PLS', val: 2, min: 1 }, { k: 'seed', t: 'num', label: 'Semilla aleatoria', val: 7 }]);
    return {
      form, run(out, v) {
        const tb = L.parseTable(v.data), D = design(tb, v.y, v.x), n = D.n, p = D.names.length, st = L.standardize(D.X), ym = L.mean(D.y), yc = D.y.map(t => t - ym), rnd = L.rng(v.seed), K = Math.round(v.folds), folds = L.kfold(n, K, rnd);
        const lmax = Math.max(...L.M.mulv(L.M.T(st.Z), yc).map(Math.abs)) / n, grid = Array.from({ length: 40 }, (_, i) => lmax * 10 ** (-3 * i / 39));
        const cv = (fit) => { const errs = []; for (const f of folds) { const te = new Set(f), tr = [...Array(n).keys()].filter(i => !te.has(i)), Ztr = tr.map(i => st.Z[i]), ytr = tr.map(i => yc[i]), mu = L.mean(ytr), b = fit(Ztr, ytr.map(t => t - mu)); errs.push(L.mean(f.map(i => (yc[i] - mu - L.sum(st.Z[i].map((z, j) => z * b[j]))) ** 2))); } return { m: L.mean(errs), se: L.sd(errs) / Math.sqrt(K) }; };
        const rcv = grid.map(l => cv((Z, y) => L.ridge(Z, y, l))), lcv = grid.map(l => cv((Z, y) => L.lasso(Z, y, l)));
        const pick = c => { let bi = 0; c.forEach((e, i) => { if (e.m < c[bi].m) bi = i; }); return bi; }, ri = pick(rcv), li = pick(lcv);
        const lasso1se = (() => { const th = lcv[li].m + lcv[li].se; let j = li; while (j > 0 && lcv[j - 1].m <= th) j--; return j; })();
        const pathR = grid.map(l => L.ridge(st.Z, yc, l)), pathL = (() => { let b = null; return grid.map(l => b = L.lasso(st.Z, yc, l, b)); })();
        const nc = Math.min(Math.round(v.ncomp), p), pcaZ = L.pca(D.X, true); const fitPCR = (Z, y, k) => { const pc = L.pca(Z, true), T = Z.map(r => pc.vecs.slice(0, k).map(vv => L.sum(r.map((x, j) => (x - pc.mu[j]) / pc.sd[j] * vv[j])))); const g = L.M.solve(L.M.mul(L.M.T(T), T), L.M.mulv(L.M.T(T), y)); const bz = new Array(Z[0].length).fill(0); for (let a = 0; a < k; a++) for (let j = 0; j < bz.length; j++) bz[j] += g[a] * pc.vecs[a][j] / pc.sd[j]; return bz; };
        const pcrCV = [], plsCV = []; for (let k = 1; k <= p; k++) { pcrCV.push(cv((Z, y) => fitPCR(Z, y, k)).m); plsCV.push(cv((Z, y) => L.pls1(Z, y, k)).m); }
        const grp = D.groups; const gl = L.groupLasso(st.Z, yc, grid[li] * 1.0, grp), olsM = L.ols(st.Z, yc, { intercept: false }), pcrB = fitPCR(st.Z, yc, nc), plsB = L.pls1(st.Z, yc, nc);
        const toOrig = b => b.map((t, j) => t / st.sd[j]), models = [['MCO', olsM.b], ['Ridge', pathR[ri]], ['LASSO', pathL[li]], ['LASSO (1 EE)', pathL[lasso1se]], ['LASSO por grupo', gl], [`PCR (k=${nc})`, pcrB], [`PLS (k=${nc})`, plsB]];
        const cvr = { 'MCO': null, Ridge: rcv[ri].m, LASSO: lcv[li].m, 'PCR': pcrCV[nc - 1], 'PLS': plsCV[nc - 1] };
        let html = kpis([['λ óptimo Ridge', grid[ri]], ['λ óptimo LASSO', grid[li]], ['λ LASSO (1 EE)', grid[lasso1se]], ['Variables LASSO', pathL[li].filter(b => Math.abs(b) > 1e-8).length, `de ${p}`]]);
        html += H4('Coeficientes en escala estandarizada') + tbl(['Variable', ...models.map(m => m[0])], D.names.map((nm, j) => [esc(nm), ...models.map(m => m[1][j])]));
        html += H4('Coeficientes en la escala original') + tbl(['Variable', ...models.map(m => m[0])], D.names.map((nm, j) => [esc(nm), ...models.map(m => toOrig(m[1])[j])]));
        const sx = grid.map(l => Math.log10(l)), colorOf = j => (j % 6) + 1;
        html += `<div class="grid2">${fig(plot({ title: 'Trayectoria Ridge', xlab: 'log₁₀ λ', ylab: 'Coeficiente estandarizado', xlim: ext(sx, .02), ylim: ext(pathR.flat(), .05) }, a => D.names.map((_, j) => path(sx, pathR.map(b => b[j]), a.sx, a.sy, colorOf(j), 1.8)).join('') + `<line class="ref" x1="${a.sx(sx[ri])}" x2="${a.sx(sx[ri])}" y1="${a.m.t}" y2="${a.H - a.m.b}"/>`))}${fig(plot({ title: 'Trayectoria LASSO', xlab: 'log₁₀ λ', ylab: 'Coeficiente estandarizado', xlim: ext(sx, .02), ylim: ext(pathL.flat(), .05) }, a => D.names.map((_, j) => path(sx, pathL.map(b => b[j]), a.sx, a.sy, colorOf(j), 1.8)).join('')))}</div>` + legendHTML(D.names.map((n, j) => [colorOf(j), n]));
        html += `<div class="grid2">${fig(lineSVG([{ name: 'Ridge', x: sx, y: rcv.map(e => e.m), c: 1 }, { name: 'LASSO', x: sx, y: lcv.map(e => e.m), c: 2 }], { title: `Error de validación cruzada (${K} pliegues)`, xlab: 'log₁₀ λ', ylab: 'ECM' }))}${fig(lineSVG([{ name: 'PCR', x: pcrCV.map((_, i) => i + 1), y: pcrCV, c: 1, dots: true }, { name: 'PLS', x: plsCV.map((_, i) => i + 1), y: plsCV, c: 3, dots: true }], { title: 'ECM de CV según componentes', xlab: 'Componentes', ylab: 'ECM', xticks: pcrCV.map((_, i) => i + 1) }))}</div>`;
        const kb = { pcr: pcrCV.indexOf(Math.min(...pcrCV)) + 1, pls: plsCV.indexOf(Math.min(...plsCV)) + 1 }; const rmses = [['Ridge', rcv[ri].m], ['LASSO', lcv[li].m], ['PCR óptimo', Math.min(...pcrCV)], ['PLS óptimo', Math.min(...plsCV)]].sort((a, b) => a[1] - b[1]);
        html += tbl(['Método', 'ECM CV mínimo', 'RMSE CV'], rmses.map(r => [r[0], r[1], Math.sqrt(r[1])]));

reg({
  id: 'outl', group: 'Modelos lineales', ref: 'Avanzado 1d', title: 'Valores atípicos y estimación robusta',
  lead: 'Detecta observaciones influyentes con leverage, residuos estudentizados y distancia de Cook, y compara con la estimación robusta de Huber.',
  review: `<p>Tres conceptos distintos: un punto puede ser <b>atípico en y</b> (residuo grande), tener <b>alto leverage</b> (x extremo) o ser <b>influyente</b> (cambia el ajuste si se elimina).</p>
  <ul><li><b>Leverage</b> hᵢᵢ = diag(X(XᵀX)⁻¹Xᵀ); se marca si hᵢᵢ &gt; 2k/n.</li><li><b>Residuo estudentizado</b> rᵢ = eᵢ/(σ̂√(1−hᵢᵢ)); |rᵢ| &gt; 2 es sospechoso y &gt; 3 es claramente atípico.</li><li><b>Distancia de Cook</b> Dᵢ = rᵢ²·hᵢᵢ/(k(1−hᵢᵢ)); se revisa si Dᵢ &gt; 4/n.</li><li><b>Estimación robusta de Huber (M-estimador):</b> pondera cada observación con wᵢ = min(1, c/|uᵢ|), uᵢ = eᵢ/s, c = 1,345 y s = MAD; se itera por mínimos cuadrados ponderados.</li></ul>`,
  code: `# Python\nimport statsmodels.api as sm\ninf = m.get_influence(); inf.cooks_distance, inf.hat_matrix_diag, inf.resid_studentized_internal\nsm.RLM(y, X, M=sm.robust.norms.HuberT()).fit()\n# R\ncooks.distance(m); hatvalues(m); rstudent(m); MASS::rlm(y ~ ., df)`,
  build() { const form = regForm('outl'); return { form, run(out, v) { const tb = L.parseTable(v.data), D = design(tb, v.y, v.x), m = olsFit(D), n = D.n, k = m.k, thr = 2 * k / n; const flag = D.y.map((_, i) => ({ i, h: m.h[i], r: m.stud[i], c: m.cook[i], fl: [m.h[i] > thr ? 'leverage' : null, Math.abs(m.stud[i]) > 2 ? '|r|>2' : null, m.cook[i] > 4 / n ? 'Cook' : null].filter(Boolean) })).filter(f => f.fl.length).sort((a, b) => b.c - a.c);
    // Huber
    let w = new Array(n).fill(1), hb; for (let it = 0; it < 60; it++) { hb = L.ols(L.withIntercept(D.X), D.y, { w }); const s = L.median(hb.res.map(Math.abs)) / 0.6745 || 1, nw = hb.res.map(e => { const u = Math.abs(e) / s; return u <= 1.345 ? 1 : 1.345 / u; }); const d = Math.max(...nw.map((t, i) => Math.abs(t - w[i]))); w = nw; if (d < 1e-8) break; }
    const keep = [...Array(n).keys()].filter(i => !(m.cook[i] > 4 / n && Math.abs(m.stud[i]) > 2)), m2 = L.ols(L.withIntercept(keep.map(i => D.X[i])), keep.map(i => D.y[i]));

    html += fig(plot({ title: 'Leverage vs residuo estudentizado (tamaño = distancia de Cook)', xlab: 'Leverage', ylab: 'Residuo estudentizado', xlim: [0, Math.max(...m.h) * 1.1], ylim: ext(m.stud, .1) }, a => `<line class="ref" x1="${a.sx(thr)}" x2="${a.sx(thr)}" y1="${a.m.t}" y2="${a.H - a.m.b}"/><line class="ref" x1="${a.m.l}" x2="${a.W - a.m.r}" y1="${a.sy(2)}" y2="${a.sy(2)}"/><line class="ref" x1="${a.m.l}" x2="${a.W - a.m.r}" y1="${a.sy(-2)}" y2="${a.sy(-2)}"/>` + m.h.map((hh, i) => `<circle class="f${m.cook[i] > 4 / n ? 4 : 1}" fill-opacity=".6" cx="${a.sx(hh)}" cy="${a.sy(m.stud[i])}" r="${3 + Math.min(14, m.cook[i] * 40)}"><title>Fila ${i + 1}: Cook ${F(m.cook[i], 3)}</title></circle>`).join('')));
